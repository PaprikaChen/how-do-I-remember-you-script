<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How Do I Remember You Script Editor</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#22272b; --muted:#6c7378; --line:#ddd7ca;
  --edit:#fff1bf; --edit-line:#b98900; --error:#b3261e; --link:#1c5d99; --choice:#2b4b63;
  --c0:#3f7d4e; --c1:#2f6aa8; --c2:#a3572a; --c3:#7a4f9c; --c4:#927100; --c5:#1f7a7a; --c6:#a33b5e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--choice);border-color:var(--choice);color:#fff}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;margin-right:auto}
header input[type=search]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;width:220px}
header label{font-size:13px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr)}
nav{position:sticky;top:var(--top,55px);height:calc(100vh - var(--top,55px));overflow:auto;border-right:1px solid var(--line);padding:10px 8px 40px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px}
nav button:hover{background:#ece7db}
nav .ch.on{background:var(--choice);color:#fff}
nav .sub{font-size:12.5px;color:var(--muted);padding-left:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav .count{float:right;font-size:11px;background:var(--edit);color:#4a3800;border-radius:9px;padding:0 7px;margin-top:2px}
main{padding:20px 24px 80px;min-width:0;max-width:1500px}
h2{margin:0 0 14px;font-size:22px}
.help{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.help summary{cursor:pointer;font-weight:600}
.help ul{margin:8px 0 0;padding-left:20px}
.line{max-width:760px;padding:6px 0 8px}
.meta{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.who{font-weight:700;color:var(--ink);font-size:12.5px}
.narr .who{color:var(--muted);font-weight:600}
.inner .who{color:#7a4f9c}
.chat .who{color:#1f7a7a}
.eid{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;opacity:.7}
.notebtn{margin-left:auto;font-size:11.5px;padding:0 7px;border-color:transparent;background:none;color:var(--muted)}
.text{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:pre-wrap;overflow-wrap:anywhere;outline:none}
.text:focus{border-color:var(--link);box-shadow:0 0 0 2px #1c5d9930}
.inner .text{font-style:italic}
.edited>.text{background:var(--edit);border-color:var(--edit-line)}
.bad>.text{border-color:var(--error);box-shadow:0 0 0 2px #b3261e30}
.zh{display:none;font-size:13px;color:var(--muted);padding:3px 2px 0}
body.show-zh .zh{display:block}
.orig,.warn,.shared{font-size:12.5px;padding:3px 2px 0;color:var(--muted)}
.orig button{font-size:11.5px;padding:0 7px;margin-left:6px}
.warn{color:var(--error);font-weight:600}
.note{width:100%;font:inherit;font-size:13px;margin-top:5px;padding:6px 10px;border:1px dashed var(--edit-line);border-radius:6px;background:#fffbea;resize:vertical;min-height:52px}
.block{margin:16px 0 22px;border:1px solid var(--line);border-radius:12px;background:#ffffff80}
.block>.head{padding:10px 14px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.choice>.head{background:var(--choice);color:#fff}
.if>.head{background:#e9e3d4}
.head .kind{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.head .eid{margin-left:8px}
.head .info{font-size:13px;margin-top:3px}
.head .line{color:var(--ink)}
.head .line .meta,.head .line .who,.head .line .zh,.head .line .orig,.head .line .shared{color:#e3ebf1}
.head .line .warn{color:#ffd2cd}
.chip{display:inline-block;font-size:12px;border:1px solid currentColor;border-radius:12px;padding:0 9px;margin:3px 5px 0 0;background:none;color:inherit;max-width:100%;text-align:left}
.if>.head .chip{color:var(--link)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.tab{border-width:2px;border-color:var(--c);color:var(--c);font-size:13px;font-weight:600;text-align:left;max-width:360px}
.tab.on{background:var(--c);color:#fff}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f2b705;margin-left:6px}
.mode{margin-left:auto;font-size:12px;color:var(--muted)}
.cols{display:grid;gap:12px;padding:12px;align-items:start}
.cols.side{grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr))}
.col{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:8px 12px;background:var(--bg);min-width:0}
.col>.coltitle{color:var(--c);font-weight:700;font-size:13.5px}
.col>.coltitle .eid{margin-left:6px;font-weight:400}
.cond{font-size:12.5px;color:var(--muted);font-style:italic}
.empty{font-size:13px;color:var(--muted);padding:8px 0;font-style:italic}
.join{text-align:center;font-size:12px;color:var(--muted);padding:6px;border-top:1px dashed var(--line)}
.mark{max-width:760px;margin:10px 0;padding:6px 12px;border:1px dashed var(--muted);border-radius:6px;font-size:13px;color:var(--muted)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px #f2b705}100%{box-shadow:0 0 0 4px #f2b70500}}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.list{max-width:860px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.item del{color:var(--muted)}
#msg{width:100%;font-size:13px;display:none}
#msg.show{display:block}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;max-height:240px;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>

<script>
"use strict";
const DATA = {"title":"How Do I Remember You","nameToken":"[teacher_name]","chapters":[{"key":"COLD","title":"Cold open","nodes":[{"t":"line","id":"COLD-010","who":"Narration","cls":"narr","en":"Many years later, I still remember that sweltering, rainy night.","zh":"很多年以后，我还是记得那个闷热的雨夜。"},{"t":"line","id":"COLD-020","who":"Narration","cls":"narr","en":"Rain hammered on the classroom's tin roof. Someone was knocking on the window.","zh":"雨点砸在教室的铁皮屋顶上。有一个人在敲窗户。"},{"t":"line","id":"COLD-030","who":"Narration","cls":"narr","en":"It was her. Soaked through, mud caked up to her knees, her braid plastered to her neck. Lightning flashed, and I saw a hair tie with a little yellow duck wound around the end of her braid.","zh":"是她。浑身湿透，泥一直糊到膝盖，辫子贴在脖子上。一道闪电亮起，我看见辫尾绑着一根小黄鸭发绳。"},{"t":"line","id":"COLD-040","who":"Narration","cls":"narr","en":"Her hand was pressed against the glass.","zh":"她的手按在玻璃上。"},{"t":"line","id":"COLD-050","who":"?","cls":"talk","en":"“Teacher, please. Please help me.”","zh":"“老师，求求你帮帮我。”"}]},{"key":"INT","title":"Introduction","nodes":[{"t":"line","id":"INT-010","who":"Narration","cls":"narr","en":"That summer, I had just finished my second year of college.","zh":"那年夏天，我大二。"},{"t":"line","id":"INT-020","who":"Narration","cls":"narr","en":"I grew up in Beijing and had hardly ever seen real mountains. Before summer break, I signed up with my university's volunteer teaching team to spend one short month at a village primary school in southwestern China.","zh":"我在北京长大，没怎么见过真正的山。放暑假前，我报名了学校的支教队，要去西南山区的一所村小待上短短一个月。"},{"t":"line","id":"INT-021","who":"Narration","cls":"narr","en":"The school had very few teachers. Every summer, university volunteers came in batch after batch, taking turns to teach. I would be teaching English.","zh":"那里的老师很少。每年暑假，都是大学生志愿者一批接一批轮换着来上课。我负责教英语。"},{"t":"line","id":"INT-022","who":"Narration","cls":"narr","en":"I told the team I wanted to shoot that summer on film. There was a student film photography contest in September, its theme simply “Summer,” and I wanted to enter it.","zh":"我跟队里说，我想用胶片拍下这个夏天。九月有一个大学生胶片摄影大赛，主题就叫“夏天”，我想拿它去投。"},{"t":"line","id":"INT-026","who":"Narration","cls":"narr","en":"I dug my dad's old film camera out of a cupboard at home. Film was hard to find by then; the only roll I could get was a half-used one from a flea market, with five frames left.","zh":"我从家里翻出爸爸那台老胶片相机。胶卷早就不好买了，我只在旧货市场淘到一卷别人拍剩的，还剩五张。"},{"t":"line","id":"INT-040","who":"Narration","cls":"narr","en":"I thought it would just be a “summer camp,” only a bit rougher than most.","zh":"我本以为，这只是一场条件比较艰苦的“夏令营”。"}]},{"key":"PRO","title":"Prologue · Choosing a nickname","nodes":[{"t":"line","id":"PRO-010","who":"Narration","cls":"narr","en":"Before we left, the volunteer teaching team collected everyone's nicknames in the group chat.","zh":"出发前，支教队在群里收集大家的花名。"},{"t":"line","id":"PRO-020","who":"Volunteer team","cls":"talk","en":"“This is what the children will call us at school. Pick something easy for them to remember and say. It could be a food, a plant, or the weather—something like Ginger, Sunny, or Hazel.”","zh":"“到了学校，孩子们就这样叫我们。给自己取个他们容易记住、也方便叫的名字吧。可以是吃的、植物，或者天气，比如小姜、小雨、栗子。”"},{"t":"line","id":"PRO-030","who":"Narration","cls":"narr","en":"I looked at the names appearing on the list and found an empty line for mine. What should the children call me?","zh":"我看着名单上一个个新添的名字，也给自己留了一行。孩子们该怎么称呼我？"},{"t":"choice","id":"PRO-C1","timer":null,"loop":false,"prompt":{"t":"line","id":"PRO-050","who":"Narration","cls":"narr","en":"Enter a name, or choose: Ginger / Sunny / Hazel.","zh":"可以自己输入，也可以选择：小姜／小雨／栗子。"},"writes":["teacher_name"],"options":[{"id":"PRO-C1A","en":"Choose my own name","zh":"自己取一个名字","cond":null,"leaves":false,"body":[]},{"id":"PRO-C1B","en":"Ginger","zh":"小姜","cond":null,"leaves":false,"body":[]},{"id":"PRO-C1C","en":"Sunny","zh":"小雨","cond":null,"leaves":false,"body":[]},{"id":"PRO-C1D","en":"Hazel","zh":"栗子","cond":null,"leaves":false,"body":[]}],"affects":[],"about":["your nickname"]},{"t":"line","id":"PRO-070","who":"Narration","cls":"narr","en":"I wrote my name on the list: [teacher_name].","zh":"我在名单上写下：[teacher_name]。"},{"t":"line","id":"PRO-080","who":"Narration","cls":"narr","en":"Here, I would be Teacher [teacher_name].","zh":"以后在这里，我就是[teacher_name]老师了。"},{"t":"line","id":"PRO-090","who":"Narration","cls":"narr","en":"From the airport, we drove two hours deep into the mountains, then caught a three-wheeled cart in town and bounced over ridge after ridge before we finally arrived.","zh":"从机场出发，往大山的方向开了两个小时，又在镇上搭了三轮车，翻过一个又一个山头，我们才终于到了。"}]},{"key":"A1","title":"Act 1 · First meeting at sunset","nodes":[{"t":"line","id":"A1-010","who":"Narration","cls":"narr","en":"The first time I saw her was in the classroom for the older students.","zh":"我第一次见到她，是在高年级班的教室里。"},{"t":"line","id":"A1-020","who":"Narration","cls":"narr","en":"During break, a group of girls were laughing and playing together. One glanced over at us, then turned back to whisper in a friend's ear.","zh":"课间，班里的女生嬉笑打闹成一团。有人朝我们这边看了一眼，又转回去，凑到同伴耳边说话。"},{"t":"line","id":"A1-030","who":"Girl A","cls":"talk","en":"“Hey, did you smell that sour stink on Mai after PE today?”","zh":"“欸，今天体育课之后你们有闻到小麦身上的酸臭味吗？”"},{"t":"line","id":"A1-040","who":"Girl B","cls":"talk","en":"“Keep saying that and I'll tell her you want to sit next to her all summer!”","zh":"“你再这样说，小心我跟她说你这个暑假愿意当她的同桌啊~”"},{"t":"line","id":"A1-050","who":"Narration","cls":"narr","en":"A few whispered remarks drifted over between bursts of laughter.","zh":"几句压低了声音的议论，夹在笑声里飘过来。"},{"t":"line","id":"A1-070","who":"Narration","cls":"narr","en":"Just then, a girl's indignant voice came from farther down the corridor. Two or three boys who had been hanging around us earlier came running toward the classroom, shouting as they went.","zh":"就在这时，一个女孩带着嗔怒的声音从走廊深处传来。紧接着，三两个刚才一直围着我们转的男孩一边大叫，一边往教室这边跑。"},{"t":"line","id":"A1-080","who":"Boys","cls":"talk","en":"“Mai's coming!”","zh":"“小麦来了！”"},{"t":"line","id":"A1-090","who":"Narration","cls":"narr","en":"A girl, skinny as a bamboo pole and dark from the sun, came stumbling through the back door after them.","zh":"一个竹竿般干瘦、黝黑的女孩，追着他们从教室后门趔趄着跑进来。"},{"t":"line","id":"A1-100","who":"?","cls":"talk","en":"“Teacher! He's been making things up about me again!”","zh":"“老师！他又在外面到处造我的谣！”"},{"t":"line","id":"A1-110","who":"Narration","cls":"narr","en":"She pointed at one of the boys who had just run past, still out of breath.","zh":"她指着刚跑过去的一个男孩，气还没喘匀。"},{"t":"line","id":"A1-120","who":"Narration","cls":"narr","en":"Her eyelids had no crease, but her eyes were round and bright.","zh":"她是单眼皮，眼睛却又圆又亮。"},{"t":"line","id":"A1-130","who":"Narration","cls":"narr","en":"Her hair was naturally curly, untended and frizzy. But in the evening sunlight coming through the window, it looked soft and fuzzy.","zh":"她的头发是很典型的自然卷，没有怎么打理，显得毛毛躁躁的。但夕阳透过窗户照在上面，又显得毛茸茸的。"},{"t":"line","id":"A1-140","who":"Narration","cls":"narr","en":"As soon as she stopped, the other girls casually shifted a couple of steps toward the teacher's desk or the front door. It was as though an invisible boundary had suddenly been drawn around her.","zh":"她刚站定，其他几个女孩便装作漫不经心地，往讲台或教室前门挪了两步。仿佛以她为圆心，地上忽然划出了一道看不见的界线。"},{"t":"line","id":"A1-150","who":"Narration","cls":"narr","en":"Their eyes crinkled as they glanced at one another, passing some unspoken joke between them.","zh":"她们弯着眼角，移动时互相看着，像是有什么心照不宣的笑话，可以在眼波流转间传递。"},{"t":"line","id":"A1-160","who":"Narration","cls":"narr","en":"Oh. I thought I had worked it out. The girl with the curly hair was probably *Mai*.","zh":"噢，我感觉我知道了，那个自然卷的女孩，可能就叫*小麦*。"},{"t":"line","id":"A1-170","who":"Narration","cls":"narr","en":"She was still glaring at the boy, waiting for him to explain what he'd said. But I found myself looking again at the space that had opened up beside her.","zh":"她还在嗔怒着看着那个男孩，等着他为自己说过的话作个解释。我却忍不住又看了一眼她身旁空出来的位置。"},{"t":"line","id":"A1-180","who":"The Teacher · inner voice","cls":"inner","en":"Did she hear what they said? Should I ask what happened?","zh":"刚才那些话，她听见了吗？要不要先问问发生了什么？"},{"t":"line","id":"A1-190","who":"The Passerby · inner voice","cls":"inner","en":"We've only just arrived. Would stepping in too soon make the hidden bullying worse?","zh":"我们才刚来。贸然介入会不会加重隐性霸凌行为？"},{"t":"choice","id":"A1-C1","timer":null,"loop":false,"prompt":null,"writes":["first_contact"],"options":[{"id":"A1-C1A","en":"Go over to her and ask what happened.","zh":"走到她身边，问问发生了什么。","cond":null,"leaves":false,"body":[{"t":"line","id":"A1-210","who":"Me","cls":"me","en":"“Your name's Mai, right? What did he say?”","zh":"“你叫小麦是吗？他说了什么？”"},{"t":"line","id":"A1-220","who":"Mai","cls":"talk","en":"“I was taking pictures of the clouds that day! He just happened to walk past the window!”","zh":"“我那天在拍天上的云！他刚好从窗户外面走过去！”"},{"t":"line","id":"A1-230","who":"Me","cls":"me","en":"“I see. I believe you.”","zh":"“原来是这样。老师相信你。”"},{"t":"line","id":"A1-235","who":"Narration","cls":"narr","en":"I turned to the boys.","zh":"我转过头，看向那几个男孩。"},{"t":"line","id":"A1-240","who":"Me","cls":"me","en":"“Did you hear what she said?”","zh":"“你们听见她说的了吗？”"},{"t":"line","id":"A1-242","who":"Narration","cls":"narr","en":"They gave a half-hearted nod, then all scattered at once and ran out of the classroom.","zh":"他们敷衍地点了点头，然后突然一哄而散，跑出了教室。"},{"t":"line","id":"A1-244","who":"Narration","cls":"narr","en":"All I could do was sigh and pat Mai on the shoulder.","zh":"我只好叹了口气，拍了拍小麦的肩膀。"},{"t":"line","id":"A1-246","who":"Narration","cls":"narr","en":"She looked down at my hand, but she didn't pull away.","zh":"她低头看了看我的手，没有躲开。"}]},{"id":"A1-C1B","en":"Ask the boys first.","zh":"先问问那几个男孩。","cond":null,"leaves":false,"body":[{"t":"line","id":"A1-250","who":"Me","cls":"me","en":"“What were you saying just now? Why was she chasing you?”","zh":"“你们刚才在说什么？她为什么追着你们跑？”"},{"t":"line","id":"A1-260","who":"Boy","cls":"talk","en":"“Nothing, Teacher. We were only joking.”","zh":"“没什么，老师，开玩笑的。”"},{"t":"line","id":"A1-270","who":"Me","cls":"me","en":"“It's only a joke if both people are laughing. Is she laughing?”","zh":"“开玩笑要两个人都笑才算。她笑了吗？”"},{"t":"line","id":"A1-280","who":"Narration","cls":"narr","en":"The boys looked at one another, mumbled “Sorry,” and bolted. When I turned back, Mai was still standing there, watching me.","zh":"男孩们互相看了看，嘀咕了一句“对不起”，一溜烟跑了。我再转过头时，小麦还站在原地，看着我。"}]},{"id":"A1-C1C","en":"Leave the questions for now and introduce myself.","zh":"暂时不追问，先和她打个招呼。","cond":null,"leaves":false,"body":[{"t":"line","id":"A1-290","who":"Me","cls":"me","en":"“You're Mai, right? I'm one of the new teachers.”","zh":"“你叫小麦，对吗？我是新来的老师。”"},{"t":"line","id":"A1-300","who":"Narration","cls":"narr","en":"She nodded, then asked my name.","zh":"她点点头，又问了我的名字。"},{"t":"line","id":"A1-310","who":"Me","cls":"me","en":"“[teacher_name]. You can call me Teacher [teacher_name].”","zh":"“[teacher_name]。叫我[teacher_name]老师就好。”"},{"t":"line","id":"A1-320","who":"Narration","cls":"narr","en":"She repeated the name, then tried “Teacher [teacher_name]” and laughed.","zh":"她把这个名字念了一遍，又叫了一声“[teacher_name]老师”，自己先笑了。"},{"t":"line","id":"A1-325","who":"Narration","cls":"narr","en":"The boys were still poking their heads in at the door. No one mentioned what had happened.","zh":"门口那几个男孩还在探头探脑。没有人再提刚才的事。"}]}],"affects":[{"id":"A3-K2","label":"Act 3: If I listened to her explanation yesterday"}],"about":["how you first approached Mai"]},{"t":"line","id":"A1-330","who":"Narration","cls":"narr","en":"The bell rang. The children drifted back to their seats in twos and threes.","zh":"上课铃响了。孩子们三三两两回到座位上。"},{"t":"line","id":"A1-340","who":"Narration","cls":"narr","en":"Mai sat near the middle of the back row. The seats on either side of her were empty.","zh":"小麦坐在最后一排靠中间的位置。她旁边的两个座位都空着。"},{"t":"line","id":"A1-350","who":"Narration","cls":"narr","en":"The argument was over. But the invisible line hadn't gone away with the bell.","zh":"吵架结束了。但那道看不见的线，并没有跟着铃声一起消失。"}]},{"key":"A2","title":"Act 2 · Buying bedding at the village shop","nodes":[{"t":"line","id":"A2-010","who":"Narration","cls":"narr","en":"There was a little restaurant beside the school. Before we even reached the door, the smell of pigs and their urine hit us.","zh":"学校旁边有一家小餐馆。还没走到门口，一股猪骚味就迎面扑了过来。"},{"t":"line","id":"A2-020","who":"Narration","cls":"narr","en":"The couple who ran it welcomed us in with smiles. We arranged to eat there for the whole month. There weren't really any other options nearby.","zh":"老板和老板娘笑着招呼我们进去。我们跟他们说好，这一个月都在这里吃。附近也没有什么别的选择。"},{"t":"line","id":"A2-030","who":"Narration","cls":"narr","en":"I had thought meals would at least be cheaper this far into the mountains. The menu wasn't much cheaper than Beijing.","zh":"我以为进了这么深的山，吃饭总该便宜些。看过菜单才知道，和北京也没差多少。"},{"t":"line","id":"A2-040","who":"Narration","cls":"narr","en":"Especially the meat dishes. We talked it over with the menu in front of us and ordered a few anyway.","zh":"尤其是肉菜。我们对着菜单商量了一会儿，还是点了几道。"},{"t":"line","id":"A2-050","who":"Narration","cls":"narr","en":"When the dishes arrived, there were only scattered bits of meat among the vegetables. I turned one over with my chopsticks. Most of it was fat.","zh":"菜端上来，肉零零星星地散在里面。夹起一块翻过来，大半是肥的。"},{"t":"line","id":"A2-060","who":"Narration","cls":"narr","en":"The owner brought over another dish and urged us, smiling, to eat while it was hot. But the rank smell of pork made it hard to swallow.","zh":"老板娘又端来一盘菜，笑着叫我们趁热吃。但那股猪骚味实在让人难以下咽。"},{"t":"line","id":"A2-070","who":"Narration","cls":"narr","en":"Later, at lunchtime, a few children would always gather to watch us eat. They were very polite; they just gazed starry-eyed at the meat dishes on our table.","zh":"后来，每到中午，总有几个孩子围过来看我们吃饭。他们很有礼貌，只是用星星眼盯着桌上的肉菜。"},{"t":"line","id":"A2-080","who":"Narration","cls":"narr","en":"We saw that their lunch was a bowl of meatless noodles that cost one yuan. The same thing every day.","zh":"我们看到他们吃的是一块钱一碗的素面，里面没有肉。每天都是。"},{"t":"line","id":"A2-090","who":"Narration","cls":"narr","en":"We would share some of our meat with them. They took it and thanked us.","zh":"我们会从盘里分些肉给他们。几个孩子接过去，说谢谢老师。"},{"t":"line","id":"A2-100","who":"Narration","cls":"narr","en":"After dinner, someone said we needed to buy sheets for sleeping on the floor before the village shop closed.","zh":"晚饭后，同事说，得趁村里的小卖部关门前，去买打地铺用的被单。"},{"t":"line","id":"A2-110","who":"Narration","cls":"narr","en":"There were no beds in the classroom. Tonight, we'd be sleeping on the concrete floor.","zh":"教室里没有床。今晚，我们要睡在水泥地上。"},{"t":"line","id":"A2-120","who":"Narration","cls":"narr","en":"The village shop was smaller than an ordinary bedroom in the city. A huge freezer by the entrance held three or four kinds of ice pops.","zh":"村里的小卖部，还没有城市里一间普通卧室大。门口放着一个巨大的冰柜，里面有三四种冰棍。"},{"t":"line","id":"A2-130","who":"Narration","cls":"narr","en":"A few deeply tanned older men sat outside on little wooden chairs, chatting and fanning themselves with palm-leaf fans. They watched our group of young women approach with friendly curiosity.","zh":"几个晒得黝黑的大叔坐在小木椅上，扇着蒲扇聊天。看见我们几个年轻姑娘结伴过来，他们投来好奇而友善的目光。"},{"t":"line","id":"A2-140","who":"The Passerby · inner voice","cls":"inner","en":"I suddenly remembered accounts I'd read online before coming here, about young women volunteer teachers being harmed by local people.","zh":"我忽然想起，来之前曾在网上读过一些年轻支教女老师遭到当地人侵害的讲述。"},{"t":"line","id":"A2-150","who":"Narration","cls":"narr","en":"A little fear shot through my chest like electricity.","zh":"一点害怕从心口像电流一样蹿过。"},{"t":"line","id":"A2-160","who":"Narration","cls":"narr","en":"But the men in front of us looked genuinely friendly, apparently just curious about our unexpected arrival.","zh":"而眼前这几位大叔，神情实在友善，似乎只是对突然出现的我们感到好奇。"},{"t":"choice","id":"A2-C2","timer":null,"loop":false,"prompt":{"t":"line","id":"A2-170","who":"Narration","cls":"narr","en":"Should I say hello before going in?","zh":"进小卖部前，要打个招呼吗？"},"writes":["greeted_villagers"],"options":[{"id":"A2-C2A","en":"Of course. They look friendly, and they seem curious about us.","zh":"当然。他们看起来很友善，也似乎对我们很好奇。","cond":null,"leaves":false,"body":[{"t":"line","id":"A2-180","who":"Me","cls":"me","en":"“Good evening.”","zh":"“叔叔好。”"},{"t":"line","id":"A2-190","who":"Narration","cls":"narr","en":"They seemed surprised that we'd spoken first. After a moment, they smiled shyly and raised their hands in greeting.","zh":"他们像是没想到我们会先开口，愣了一下，随后腼腆地笑着举了举手。"},{"t":"line","id":"A2-200","who":"Villager","cls":"talk","en":"“Come to buy something?”","zh":"“来买东西啊？”"}]},{"id":"A2-C2B","en":"Better not. We'll mostly be teaching at the school and may not have much contact with them. There's no need to say hello.","zh":"还是算了。我们主要在小学里教书，和他们未必会有多少交集，也不一定要打招呼。","cond":null,"leaves":false,"body":[{"t":"line","id":"A2-210","who":"Narration","cls":"narr","en":"I followed the others inside. The conversation behind us paused briefly, then started up again.","zh":"我跟着同伴走进店里。身后的聊天声停了一会儿，很快又继续了。"}]}],"affects":[{"id":"A2-K3","label":"Act 2: If I greeted the villagers"},{"id":"A3-K1","label":"Act 3: If I greeted the villagers in Act Two"},{"id":"A7-K1","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-KW1","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-KW3","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-KR1","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-KR3","label":"Act 7: If I greeted the villagers in Act Two"}],"about":["whether you greeted the villagers"]},{"t":"choice","id":"A2-C3","timer":null,"loop":false,"prompt":{"t":"line","id":"A2-220","who":"Narration","cls":"narr","en":"There weren't many kinds of sheets. I stood in front of the shelf and chose one.","zh":"店里的被单没有多少种。我站在货架前，挑了起来。"},"writes":["sheet_choice"],"options":[{"id":"A2-C3A","en":"A pink Peppa Pig sheet.","zh":"粉色的小猪佩奇床单。","cond":null,"leaves":false,"body":[{"t":"line","id":"A2-221","who":"Narration","cls":"narr","en":"I picked the pink Peppa Pig one. In a place this unfamiliar, I wanted something cute, something that could make me smile.","zh":"我挑了粉色的小猪佩奇。在这个陌生的地方，我想要一点可爱的、能让自己笑出来的东西。"}]},{"id":"A2-C3B","en":"A pale blue, fleecy sheet.","zh":"浅蓝色的毛绒床单。","cond":null,"leaves":false,"body":[{"t":"line","id":"A2-223","who":"Narration","cls":"narr","en":"I picked the pale blue fleecy one. The day had been exhausting enough. At least at night, I wanted something soft.","zh":"我挑了浅蓝色的毛绒床单。今天已经够累了，至少晚上，我想睡得软一点。"}]},{"id":"A2-C3C","en":"A plain light gray sheet.","zh":"朴素的浅灰色床单。","cond":null,"leaves":false,"body":[{"t":"line","id":"A2-225","who":"Narration","cls":"narr","en":"I picked the plain light gray one. Unremarkable and hard to stain, it seemed the most practical choice out here.","zh":"我挑了朴素的浅灰色。不起眼，也耐脏，在这里大概最实用。"}]},{"id":"A2-C3D","en":"A comfortable black sheet.","zh":"舒适的纯黑色床单。","cond":null,"leaves":false,"body":[{"t":"line","id":"A2-227","who":"Narration","cls":"narr","en":"I picked the black one. It looked clean and simple, and it wouldn't show the dirt.","zh":"我挑了纯黑色。看起来干净利落，脏了也不显。"}]}],"affects":[{"id":"A2-K2","label":"Act 2: If I chose the pink or pale blue sheet"}],"about":["which bed sheet you bought"]},{"t":"line","id":"A2-230","who":"Narration","cls":"narr","en":"Once we'd finished shopping, we returned to the classroom. For safety, more than twenty of us teachers had decided to sleep together on the floor of a single room.","zh":"买完东西，我们回到教室。出于安全考虑，二十几位老师决定一起在一间教室里打地铺。"},{"t":"line","id":"A2-240","who":"Narration","cls":"narr","en":"I spread my sheet on the concrete and tried lying down. The floor was hard, and it dug into my shoulders.","zh":"我在水泥地上铺开被单，试着躺了一下。水泥地很硬，硌得肩膀发疼。"},{"t":"line","id":"A2-260","who":"Narration","cls":"narr","en":"The classroom had several large windows. With so many people inside, we had to open them, but the room was still as hot and muggy as a steamer.","zh":"教室里有几扇很大的窗户。人太多，只能把窗户打开，屋里却依旧像蒸笼一样闷热。"},{"t":"line","id":"A2-270","who":"Narration","cls":"narr","en":"Dense mountain woodland stood just outside. The relentless cicadas sounded close to my ears. Very, very close—","zh":"窗外就是茂盛的山林。喋喋不休的蝉鸣，似乎离耳朵很近，很近——"},{"t":"if","id":"A2-K2","vars":["sheet_choice"],"branches":[{"id":"A2-K2a","label":"If I chose the pink or pale blue sheet","body":[{"t":"line","id":"A2-280","who":"Narration","cls":"narr","en":"Oh my God. They really were that close!","zh":"哦，天哪，是真的很近！"},{"t":"line","id":"A2-290","who":"Narration","cls":"narr","en":"A plump cicada as long as my index finger fluttered up from the floor right in front of my face.","zh":"一只有食指那么长、肥美的蝉，从地板上扑腾到了眼前。"},{"t":"line","id":"A2-300","who":"Narration","cls":"narr","en":"Bugs of every shape and color were paying enthusiastic visits to my sheet. Against the pale fabric, I could see every single one.","zh":"还有各种形状、各种颜色的小虫子，热情地造访了我的床单。在浅色的底布上，每一只都显得格外清楚。"},{"t":"line","id":"A2-310","who":"Narration","cls":"narr","en":"I'd forgotten that bugs like bright colors best. Living in the city, it was something I'd never had to think about.","zh":"我忘了，虫子更喜欢亮色。这是在城市里生活的我从来不用考虑的事。"}]},{"id":"A2-K2b","label":"If I chose the light gray or black sheet","body":[{"t":"line","id":"A2-320","who":"Narration","cls":"narr","en":"Something suddenly fluttered near my feet. I looked down. A cicada as long as my index finger was struggling to turn itself over.","zh":"脚边忽然响起一阵扑腾声。我低头一看，一只有食指那么长的蝉正挣扎着翻身。"},{"t":"line","id":"A2-322","who":"Narration","cls":"narr","en":"Good thing I'd chosen a dark one. The bugs didn't seem to like it much, and the few that did crawl on blended right into the fabric. I could barely see them.","zh":"幸好我选了深色。虫子们似乎并不怎么喜欢它，就算有几只爬了上来，也和床单的颜色融成一片，几乎看不见。"}]}],"depends":[{"name":"which bed sheet you bought","from_":[{"id":"A2-C3A","label":"Act 2: “A pink Peppa Pig sheet.”"},{"id":"A2-C3B","label":"Act 2: “A pale blue, fleecy sheet.”"},{"id":"A2-C3C","label":"Act 2: “A plain light gray sheet.”"},{"id":"A2-C3D","label":"Act 2: “A comfortable black sheet.”"}]}]},{"t":"line","id":"A2-330","who":"Narration","cls":"narr","en":"I was so, so tired. Resigned, I lay down.","zh":"今天已经很累，很累了。我认命地躺下。"},{"t":"line","id":"A2-332","who":"Narration","cls":"narr","en":"The night was hot, and the cicadas never stopped.","zh":"夜里很热，蝉声一直没停。"},{"t":"line","id":"A2-334","who":"Narration","cls":"narr","en":"Knock, knock. Someone was knocking on the window.","zh":"叩，叩。有人在敲窗户。"},{"t":"line","id":"A2-336","who":"Narration","cls":"narr","en":"All twenty-odd of us went silent at once. In the dark, someone grabbed my wrist.","zh":"二十几个人一下子都安静了。黑暗里，不知道是谁抓住了我的手腕。"},{"t":"line","id":"A2-338","who":"Narration","cls":"narr","en":"I thought of the things I'd read online before coming.","zh":"我想起了来之前在网上读到的那些事。"},{"t":"line","id":"A2-339","who":"Narration","cls":"narr","en":"A shadow moved outside the window.","zh":"窗外的人影晃了一下。"},{"t":"if","id":"A2-K3","vars":["greeted_villagers"],"branches":[{"id":"A2-K3a","label":"If I greeted the villagers","body":[{"t":"line","id":"A2-341","who":"Narration","cls":"narr","en":"“You girls asleep?” It was the voice of one of the men from outside the village shop.","zh":"“睡了没？”是小卖部门口那位大叔的声音。"},{"t":"line","id":"A2-342","who":"Narration","cls":"narr","en":"He set a coil of mosquito incense on the windowsill.","zh":"他把一盘蚊香搁在窗台上。"},{"t":"line","id":"A2-343","who":"Villager","cls":"talk","en":"“Figured you city girls have never met mountain mosquitoes. Light it.”","zh":"“晓得你们城里小姑娘没见识过山里的毒蚊子。点上。”"},{"t":"line","id":"A2-344","who":"Narration","cls":"narr","en":"Once it was lit, a faint smoky smell filled the room. That night, I slept better than I'd expected.","zh":"蚊香点起来，屋里有了一股淡淡的烟味。那天晚上，我居然睡得比想象中好。"}]},{"id":"A2-K3b","label":"If I did not greet the villagers","body":[{"t":"line","id":"A2-346","who":"Narration","cls":"narr","en":"The shadow lingered outside for a while, said nothing, and left.","zh":"人影在窗外停了一会儿，什么也没说，走了。"},{"t":"line","id":"A2-348","who":"Narration","cls":"narr","en":"I lay awake until very late.","zh":"我睁着眼睛躺到很晚。"}]}],"depends":[{"name":"whether you greeted the villagers","from_":[{"id":"A2-C2A","label":"Act 2: “Of course. They look friendly, and they seem curious about…"},{"id":"A2-C2B","label":"Act 2: “Better not. We'll mostly be teaching at the school and may…"}]}]},{"t":"line","id":"A2-360","who":"Narration","cls":"narr","en":"Half asleep, I thought again of the girl called Mai.","zh":"半梦半醒间，我又想起那个叫小麦的女孩。"},{"t":"line","id":"A2-370","who":"Narration","cls":"narr","en":"The way she'd looked at her classmates reminded me of the one little lamb that didn't fit into the flock.","zh":"她看向同学们的眼神，让我想起一群小羊里最不合群的那一只。"}]},{"key":"A3","title":"Act 3 · The next morning and the braid","nodes":[{"t":"if","id":"A3-K1","vars":["greeted_villagers"],"branches":[{"id":"A3-K1a","label":"If I greeted the villagers in Act Two","body":[{"t":"line","id":"A3-010","who":"Narration","cls":"narr","en":"When I woke, the coil on the windowsill had burned down to a ring of pale ash. The other teachers were already up and talking.","zh":"醒来时，窗台上的蚊香已经烧成了一圈灰白的灰。其他老师已经在起床交谈了。"}]},{"id":"A3-K1b","label":"If I did not greet the villagers in Act Two","body":[{"t":"line","id":"A3-020","who":"Narration","cls":"narr","en":"The next morning, a coil of mosquito incense that hardly anyone had noticed sat on the windowsill, already burned out.","zh":"第二天早上，窗台上放着一盘没几个人注意到的蚊香，已经烧完了。"}]}],"depends":[{"name":"whether you greeted the villagers","from_":[{"id":"A2-C2A","label":"Act 2: “Of course. They look friendly, and they seem curious about…"},{"id":"A2-C2B","label":"Act 2: “Better not. We'll mostly be teaching at the school and may…"}]}]},{"t":"line","id":"A3-030","who":"Narration","cls":"narr","en":"Right in front of my face lay an enormous dead cicada.","zh":"映入眼帘的，是一具近在咫尺、硕大的蝉的尸体。"},{"t":"line","id":"A3-040","who":"Narration","cls":"narr","en":"After a whole night's practice, I wasn't even startled by this particular roommate.","zh":"经过一整晚的磨砺，这一次，我竟然没有被这位室友吓到。"},{"t":"line","id":"A3-050","who":"Narration","cls":"narr","en":"We packed away our bedding and went back into the classroom.","zh":"收拾完地铺，我们再次走进教室。"},{"t":"line","id":"A3-060","who":"Narration","cls":"narr","en":"The first lesson hadn't started yet. The students stood chatting in little groups.","zh":"第一节课还没开始。学生们三三两两围在一起聊天。"},{"t":"line","id":"A3-070","who":"Narration","cls":"narr","en":"I spotted her immediately—Mai.","zh":"我一眼又看到了她——小麦。"},{"t":"line","id":"A3-080","who":"Narration","cls":"narr","en":"She sat near the middle of the back row, head lowered, looking at a phone by herself. Her hair was still a tangle.","zh":"她坐在教室后面靠中间的位置，低着头，一个人看手机。头发依旧乱糟糟的。"},{"t":"line","id":"A3-082","who":"Narration","cls":"narr","en":"It was a very old phone, its screen covered in a spiderweb of cracks, its case yellowed, a little wood ash stuck in the corners.","zh":"那是一部很旧的手机，屏幕上全是蛛网一样的裂痕，手机壳已经发黄，边角上沾着一点柴灰。"},{"t":"line","id":"A3-084","who":"Narration","cls":"narr","en":"Her finger swiped across the screen. She was flipping through photos.","zh":"她的手指在屏幕上划来划去，在翻照片。"},{"t":"line","id":"A3-086","who":"The Passerby · inner voice","cls":"inner","en":"I wonder where she got it. Probably an old one her parents left her when they went off to work in the city.","zh":"不知道这是她从哪儿弄来的。是在城里打工的爸妈用旧了，留给她的吧。"},{"t":"line","id":"A3-088","who":"Narration","cls":"narr","en":"I walked toward her. She noticed, quickly switched off the screen, and turned the phone face down on the desk. The tips of her ears went a little red.","zh":"我朝她走过去。她察觉到了，飞快地按灭屏幕，把手机扣在桌上，耳朵尖有点红。"},{"t":"if","id":"A3-K2","vars":["first_contact"],"branches":[{"id":"A3-K2a","label":"If I listened to her explanation yesterday","body":[{"t":"line","id":"A3-090","who":"Narration","cls":"narr","en":"When she saw it was me, her shoulders relaxed.","zh":"她看见是我，肩膀松了下来。"},{"t":"line","id":"A3-100","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], that boy said sorry to me today.”","zh":"“[teacher_name]老师，那个男生今天跟我说对不起了。”"},{"t":"line","id":"A3-110","who":"Narration","cls":"narr","en":"She said it quickly, as if she'd been holding it in all morning, waiting to tell me.","zh":"她说得很快，像是憋了一早上，就等着告诉我。"}]},{"id":"A3-K2b","label":"If I asked the boys first yesterday","body":[{"t":"line","id":"A3-120","who":"Narration","cls":"narr","en":"When she saw me, she glanced toward the door.","zh":"她看见我，先朝门口望了一眼。"},{"t":"line","id":"A3-130","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], he isn't here yet today.”","zh":"“[teacher_name]老师，他今天还没来。”"}]},{"id":"A3-K2c","label":"If I introduced myself first yesterday","body":[{"t":"line","id":"A3-150","who":"Narration","cls":"narr","en":"She looked up and hesitated, as if trying to remember.","zh":"她抬起头，像是在回忆，试探着叫了一声："},{"t":"line","id":"A3-160","who":"Mai","cls":"talk","en":"“Teacher [teacher_name]?”","zh":"“[teacher_name]老师？”"},{"t":"line","id":"A3-170","who":"Me","cls":"me","en":"“That's right. You remembered.”","zh":"“对，你记住了。”"}]}],"depends":[{"name":"how you first approached Mai","from_":[{"id":"A1-C1A","label":"Act 1: “Go over to her and ask what happened.”"},{"id":"A1-C1B","label":"Act 1: “Ask the boys first.”"},{"id":"A1-C1C","label":"Act 1: “Leave the questions for now and introduce myself.”"}]}]},{"t":"line","id":"A3-190","who":"Narration","cls":"narr","en":"Looking at her hair, I felt a sudden impulse.","zh":"我看着她的头发，心底忽然涌起一股冲动。"},{"t":"line","id":"A3-200","who":"Narration","cls":"narr","en":"I remembered the other girls shifting away from her yesterday. Perhaps, just for today, I could help her feel a little different.","zh":"昨天那几个女孩挪开的脚步又浮现在眼前。也许，至少今天，我能让她有一点不一样的心情。"},{"t":"line","id":"A3-210","who":"Narration","cls":"narr","en":"I crouched down beside her and pointed to my own braid.","zh":"我在她旁边蹲下来，指了指自己的辫子。"},{"t":"line","id":"A3-220","who":"Me","cls":"me","en":"“Mai, do you like my braid? Would you like me to braid your hair?”","zh":"“小麦，你喜欢老师这样的麻花辫吗？我可以帮你扎一个吗？”"},{"t":"line","id":"A3-230","who":"Narration","cls":"narr","en":"She looked at my braid, then touched her own hair.","zh":"她看了看我的辫子，又摸了摸自己的头发。"},{"t":"line","id":"A3-240","who":"Mai","cls":"talk","en":"“Now?”","zh":"“现在吗？”"},{"t":"line","id":"A3-270","who":"Narration","cls":"narr","en":"She turned around and sat up straight with her back to me.","zh":"她转过身，背对着我坐好。"},{"t":"line","id":"A3-280","who":"Narration","cls":"narr","en":"Up close, her hair smelled of sunshine and woodsmoke. It looked fluffy but felt dry, and the comb caught in her curls the moment I tried it. I gave up on the comb and used my fingers to divide her hair, bit by bit, into three strands.","zh":"离得近了，她的头发里有一股太阳和柴火烟的味道。看着蓬松，摸上去却很干，梳子一下去就被卷发缠住。我只好放下梳子，用手指一点点把头发分成三股。"},{"t":"line","id":"A3-310","who":"Mai","cls":"talk","en":"“Hurry up, Teacher [teacher_name]. Class is about to start.”","zh":"“[teacher_name]老师你快点，要上课了。”"},{"t":"mark","text":"Braiding mini-game plays here","link":"UI-429"},{"t":"if","id":"A3-K8","vars":["braid_upset"],"branches":[{"id":"A3-K8a","label":"If no student left upset","body":[{"t":"line","id":"A3-318","who":"Narration","cls":"narr","en":"Now I finally knew how exhausting it was to look after so many children at once. Still, I'd done all right.","zh":"现在我终于知道，要同时应付这么多孩子有多累了。还好，我做得还不错。"}]},{"id":"A3-K8b","label":"If any student left upset","body":[{"t":"line","id":"A3-319","who":"Narration","cls":"narr","en":"Now I finally knew how exhausting it was to look after so many children at once. And still, I hadn't managed to look after them all.","zh":"现在我终于知道，要同时应付这么多孩子有多累了。可我还是没能顾上所有人。"}]}],"depends":[{"name":"which students left upset during the braid","from_":[{"id":"UI-429","label":"Menus and mini-game text: the braiding mini-game"}]}]},{"t":"if","id":"A3-K4","vars":["braid_left"],"branches":[{"id":"A3-K4a","label":"If I never left Mai","body":[{"t":"line","id":"A3-420","who":"Narration","cls":"narr","en":"I finished the last section, slipped a hair tie with a little yellow duck on it off my wrist, and wound it twice around the end of the braid.","zh":"我编完最后一节，从手腕上褪下一根小黄鸭发绳，在辫尾绕了两圈。"}]},{"id":"A3-K4b","label":"If I left to fix the fan","body":[{"t":"line","id":"A3-425","who":"Narration","cls":"narr","en":"When I came back from fixing the fan, she was still sitting perfectly still, and the part I'd braided had come a little loose. I redid it, slipped a hair tie with a little yellow duck on it off my wrist, and wound it twice around the end.","zh":"等我修好电扇回来，她还一动不动地坐着，刚编好的那一截已经松开了一点。我重新编好，从手腕上褪下一根小黄鸭发绳，在辫尾绕了两圈。"}]}],"depends":[{"name":"whether you left Mai mid-braid to fix the fan","from_":[{"id":"UI-429","label":"Menus and mini-game text: the braiding mini-game"}]}]},{"t":"line","id":"A3-440","who":"Narration","cls":"narr","en":"Mai reached back and felt the braid from top to bottom, then from top to bottom again.","zh":"小麦伸手往后摸了摸辫子，从上摸到下，又从上摸到下。"},{"t":"if","id":"A3-K5","vars":["braid_upset"],"branches":[{"id":"A3-K5a","label":"If the two girls left upset","body":[{"t":"line","id":"A3-442","who":"Narration","cls":"narr","en":"The two girls didn't come to me again all morning.","zh":"那两个女生一整个早上都没再来找我。"}]},{"id":"A3-K5b","label":"Otherwise","body":[]}],"depends":[{"name":"which students left upset during the braid","from_":[{"id":"UI-429","label":"Menus and mini-game text: the braiding mini-game"}]}]},{"t":"if","id":"A3-K6","vars":["braid_upset"],"branches":[{"id":"A3-K6a","label":"If the boy left angry","body":[{"t":"line","id":"A3-444","who":"Narration","cls":"narr","en":"The boy kept his head turned to the window for the whole lesson.","zh":"那个男孩一整节课都把头扭向窗外。"}]},{"id":"A3-K6b","label":"Otherwise","body":[]}],"depends":[{"name":"which students left upset during the braid","from_":[{"id":"UI-429","label":"Menus and mini-game text: the braiding mini-game"}]}]},{"t":"if","id":"A3-K7","vars":["braid_upset"],"branches":[{"id":"A3-K7a","label":"If the girl who tattled cried","body":[{"t":"line","id":"A3-446","who":"Narration","cls":"narr","en":"Girl B kept her head down on the desk for a long time.","zh":"女生乙趴在桌上，好久都没有抬头。"}]},{"id":"A3-K7b","label":"Otherwise","body":[]}],"depends":[{"name":"which students left upset during the braid","from_":[{"id":"UI-429","label":"Menus and mini-game text: the braiding mini-game"}]}]},{"t":"line","id":"A3-380","who":"The Teacher · inner voice","cls":"inner","en":"They're all my students. In those few minutes, who did I actually look after?","zh":"她们也都是我的学生。刚才那几分钟里，我到底顾上了谁？"},{"t":"line","id":"A3-390","who":"The Passerby · inner voice","cls":"inner","en":"It's only a braid. So what if I finish it today? In a month, who's going to braid her hair?","zh":"不过是一根辫子。今天编完了又怎样？一个月以后，谁来给她编？"},{"t":"line","id":"A3-510","who":"Narration","cls":"narr","en":"At noon, we went back to the restaurant beside the school.","zh":"中午，我们又去了学校旁边的餐馆。"},{"t":"line","id":"A3-520","who":"Narration","cls":"narr","en":"A few children had finished their noodles and were still beside our table. When the owner came over with a dish, they stepped aside to let her through.","zh":"几个孩子吃完了面，还在桌边待着。老板娘端菜过来，他们就往旁边让一让。"},{"t":"line","id":"A3-530","who":"Me","cls":"me","en":"“Don't you go home for lunch?”","zh":"“你们中午不回家吗？”"},{"t":"line","id":"A3-540","who":"Narration","cls":"narr","en":"“There's no time. We have class again this afternoon,” one child said.","zh":"“回不去。下午还要上课。”一个孩子说。"},{"t":"line","id":"A3-550","who":"Me","cls":"me","en":"“Is your house far away?”","zh":"“你家很远？”"},{"t":"line","id":"A3-560","who":"Narration","cls":"narr","en":"He nodded. “We walk along the highway.”","zh":"他点点头：“走高速过来。”"},{"t":"line","id":"A3-570","who":"Me","cls":"me","en":"“The highway?”","zh":"“高速公路？”"},{"t":"line","id":"A3-580","who":"Narration","cls":"narr","en":"He explained: they left home, climbed up to the highway, and walked along the shoulder at the edge for over an hour. Then they climbed back down.","zh":"他说，先从家里出来，爬上高速公路，沿着最边上的应急车道走一个多小时，再翻下来。"},{"t":"line","id":"A3-590","who":"Me","cls":"me","en":"“And then you're at school?”","zh":"“下来就到学校了？”"},{"t":"line","id":"A3-600","who":"Narration","cls":"narr","en":"“Then it's another half hour on the mountain path.”","zh":"“还要走半个小时山路。”"},{"t":"line","id":"A3-610","who":"Narration","cls":"narr","en":"I asked what time they left home. Some said after four. Others said five.","zh":"我问他们早上几点出门。有的说四点多，有的说五点。"},{"t":"line","id":"A3-620","who":"Narration","cls":"narr","en":"I later learned that many children in the class came that way. The school was already deep in the mountains. Their homes were farther still.","zh":"后来才知道，班里不少孩子都是这样来的。学校已经在山里，他们的家还在更远的山里。"}]},{"key":"A4","title":"Act 4 · The lens","nodes":[{"t":"line","id":"A4-010","who":"Narration","cls":"narr","en":"After school, the classroom emptied in minutes. Chairs scraped across the floor, laughter ran off with the footsteps, and then everything went quiet.","zh":"放学后，教室几分钟就空了。椅子刮过地面，嬉笑声随着脚步声跑远，然后一切安静下来。"},{"t":"line","id":"A4-020","who":"Narration","cls":"narr","en":"Mai was still in her seat, pinching the end of her braid.","zh":"小麦还坐在座位上，捏着辫梢。"},{"t":"line","id":"A4-030","who":"Narration","cls":"narr","en":"I was packing my bag. Before we left, I had told everyone I wanted to shoot this summer on film. But two days in, the camera was still sitting in my bag. I hadn't taken it out once.","zh":"我在收拾背包。出发前我跟大家说过，想用胶片拍下这个夏天。可来了两天，相机一直躺在包里，我一次都没拿出来。"},{"t":"line","id":"A4-040","who":"Narration","cls":"narr","en":"She spotted it first.","zh":"她先看见了。"},{"t":"line","id":"A4-050","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], is that a camera? Are you going to take pictures of us?”","zh":"“[teacher_name]老师，那是相机吗？你要拍我们吗？”"},{"t":"line","id":"A4-060","who":"Narration","cls":"narr","en":"She leaned in, eyes bright, staring at the bit of lens poking out of the bag.","zh":"她凑过来，盯着包口露出来的那截镜头，眼睛亮亮的。"},{"t":"line","id":"A4-070","who":"The Lens · inner voice","cls":"inner","en":"If my five frames can only go to one person, it should be her.","zh":"如果五张胶片只能拍一个人，就该是她。"},{"t":"line","id":"A4-080","who":"The Teacher · inner voice","cls":"inner","en":"If I make her the star, will she feel she's finally been seen? Or will the other kids just think she's even more different?","zh":"让她当主角，她会觉得自己终于被看见了吗？还是会让其他孩子更觉得她特殊？"},{"t":"choice","id":"A4-C1","timer":null,"loop":false,"prompt":null,"writes":["camera","mai_subject"],"options":[{"id":"A4-C1A","en":"Invite her to be the subject of my photos.","zh":"邀请她当照片的主角。","cond":null,"leaves":false,"body":[{"t":"line","id":"A4-090","who":"Me","cls":"me","en":"“I want to capture this summer on film. Would you like to be the one in my pictures?”","zh":"“老师想用胶片拍下这个夏天。你愿意当照片里的主角吗？”"},{"t":"line","id":"A4-100","who":"Narration","cls":"narr","en":"She looked almost startled, and then her eyes lit up.","zh":"她有些受宠若惊，眼睛一下子亮了起来。"},{"t":"line","id":"A4-110","who":"Mai","cls":"talk","en":"“Me? You want to take pictures of me?”","zh":"“我吗？要拍我吗？”"},{"t":"line","id":"A4-120","who":"Narration","cls":"narr","en":"She picked up her new braid and swung it back and forth while she thought.","zh":"她捏起刚编好的麻花辫，一边思考一边摇了几下。"},{"t":"line","id":"A4-130","who":"The Passerby · inner voice","cls":"inner","en":"Maybe it's not the right thing to say, but right now Mai is as sweet as an innocent little puppy wagging its tail.","zh":"虽然这么说可能不太合适，但是此刻的小麦就像摇着尾巴的天真无邪的小狗一样可爱。"},{"t":"line","id":"A4-140","who":"Mai","cls":"talk","en":"“Okay! Take pictures of me—wait, wait, let me wash my face first.”","zh":"“好呀！就来拍我吧——等等啊，我先去洗个脸。”"},{"t":"line","id":"A4-150","who":"Narration","cls":"narr","en":"She really did run to the sink and wash her face. When she came back, the hair on her forehead was still dripping.","zh":"她真的跑到水池边洗了把脸，回来时额前的头发还在滴水。"}]},{"id":"A4-C1B","en":"Start with the classroom itself.","zh":"还是先拍拍这间教室吧。","cond":null,"leaves":false,"body":[{"t":"line","id":"A4-152","who":"Me","cls":"me","en":"“I think I'll start with the classroom. You should head home.”","zh":"“老师想先拍拍这间教室。你早点回家吧。”"},{"t":"line","id":"A4-154","who":"Narration","cls":"narr","en":"I turned to the empty desks and windows and raised the camera.","zh":"我对着空下来的课桌和窗户，举起了相机。"}]}],"affects":[{"id":"A4-K2","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K1","label":"Act 4: If I invited her to be the subject"},{"id":"A5-K5","label":"Act 5: If I am taking photos"},{"id":"A5-K1","label":"Act 5: If I am taking photos"},{"id":"A5-K3","label":"Act 5: If I left the camera in my bag"},{"id":"A5-K6","label":"Act 5: If I am taking photos"},{"id":"A6-K1","label":"Act 6: If I am taking photos"},{"id":"A6-K2","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-K3","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-C1C","label":"Act 6: option “Raise the camera.”"},{"id":"A7-K2","label":"Act 7: If I am taking photos"},{"id":"A8-C2B","label":"Act 8: option “Leave her a children's camera.”"},{"id":"A8-K5","label":"Act 8: If I am taking photos and there is film left"},{"id":"A8-K2","label":"Act 8: If nothing or the hair tie, trust ≥ 4"},{"id":"DV-K1","label":"Back in the city: If I am taking photos"},{"id":"EP-K0","label":"Epilogue: If I am taking photos and I took photos"},{"id":"EP-K5","label":"Epilogue: If I am taking photos and I photographed people"},{"id":"EP-K3","label":"Epilogue: If the children's camera, trust ≥ 4, Maizai lame"},{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"},{"id":"EP-K6","label":"Epilogue: If I took photos"}],"about":["whether you are taking photos","whether Mai is the subject of your photos"]},{"t":"if","id":"A4-K2","vars":["mai_subject"],"branches":[{"id":"A4-K2a","label":"If I invited her to be the subject","body":[{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A4-155","who":"Narration","cls":"narr","en":"The shutter clicked. She froze, then burst out laughing. “I wasn't ready!”","zh":"快门咔嚓一声。她愣了一下，然后笑出了声：“我还没准备好呢！”"}]},{"id":"A4-K2b","label":"If I photographed the classroom","body":[{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A4-156","who":"Narration","cls":"narr","en":"The shutter clicked. In the empty classroom, it sounded very loud.","zh":"快门咔嚓一声。在空荡荡的教室里，这一声显得格外响。"}]}],"depends":[{"name":"whether Mai is the subject of your photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"}]}]},{"t":"line","id":"A4-200","who":"Narration","cls":"narr","en":"She got as far as the door, then turned back.","zh":"她走到门口，又折回来。"},{"t":"if","id":"A4-K1","vars":["mai_subject"],"branches":[{"id":"A4-K1b","label":"If I invited her to be the subject","body":[{"t":"line","id":"A4-220","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], do you want to come take pictures at my house on Saturday? We have a doggy.”","zh":"“[teacher_name]老师，周六你要不要来我家里拍照片？我家里有小狗。”"}]},{"id":"A4-K1c","label":"If I photographed the classroom","body":[{"t":"line","id":"A4-222","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], do you want to come over to my house on Saturday? We have a doggy. You can take pictures of her!”","zh":"“[teacher_name]老师，周六你要不要来我家玩？我家里有小狗，你可以拍它！”"}]}],"depends":[{"name":"whether Mai is the subject of your photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"}]}]},{"t":"line","id":"A4-230","who":"Me","cls":"me","en":"“Is your house far?”","zh":"“你家远吗？”"},{"t":"line","id":"A4-250","who":"Mai","cls":"talk","en":"“Not that far, compared to the other kids' houses. It's just over a little hill.”","zh":"“跟别的同学家比起来不算远吧。翻过一座小山就到了。”"}]},{"key":"A5","title":"Act 5 · Over the mountain","nodes":[{"t":"line","id":"A5-010","who":"Narration","cls":"narr","en":"When Mai said “not far,” she meant not far for her.","zh":"小麦说的“不远”，是对她自己来说的。"},{"t":"line","id":"A5-020","who":"Narration","cls":"narr","en":"To get to her house, we first crossed a wooden bridge over a stream, then picked our way along the narrow, raised ridges between the rice paddies.","zh":"去她家要先通过一条小溪上方的木桥，然后小心翼翼地穿过几个水稻田之间的细细高高的田埂。"},{"t":"line","id":"A5-030","who":"Narration","cls":"narr","en":"At the far end of the fields rose a modest hill. In her plastic sandals, she climbed as if she were walking on flat ground, stopping every few bends to wait for me.","zh":"田野的尽头是一个不高不矮的小山坡。她穿着塑料凉鞋，走得像在平地上，每拐几个弯就停下来等我。"},{"t":"line","id":"A5-040","who":"Narration","cls":"narr","en":"The higher we went, the thicker the bamboo grew on both sides of the path. Most of the afternoon sun was caught by the bamboo leaves and scattered dizzily across the trail.","zh":"越往后走，土路两侧开始长出细细密密的竹林。午后大部分的光线都被竹叶挡住了，晕头转向地在这条小路上散开来。"},{"t":"line","id":"A5-050","who":"Narration","cls":"narr","en":"The few beams that slipped through landed on the path as dapples of light, or settled on Mai's shoulders and hair, wrapping her in a thin veil of sunshine.","zh":"为数不多的光照进来，有的落在了路上变成光斑，有的栖息在小麦的肩膀和头发上，给她笼上一层阳光罩子。"},{"t":"if","id":"A5-K5","vars":["camera"],"branches":[{"id":"A5-K5a","label":"If I am taking photos","body":[{"t":"choice","id":"A5-C5","timer":"5","loop":false,"prompt":null,"writes":["photos"],"options":[{"id":"A5-C5A","en":"Capture this moment.","zh":"拍下这一刻。","cond":null,"leaves":false,"body":[{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A5-055","who":"Narration","cls":"narr","en":"As the shutter clicked, a dapple of light settled right on the end of her braid.","zh":"快门响的时候，一片光斑正好停在她的辫梢上。"}]},{"id":"A5-C5B","en":"Just watch.","zh":"只是看着。","cond":null,"leaves":false,"body":[]}],"affects":[{"id":"A5-K2","label":"Act 5: If I photographed Grandpa"},{"id":"A6-K2","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-K3","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-C1C","label":"Act 6: option “Raise the camera.”"},{"id":"A8-K5","label":"Act 8: If I am taking photos and there is film left"},{"id":"DV-K2","label":"Back in the city: If I took any photos"},{"id":"EP-K0","label":"Epilogue: If I am taking photos and I took photos"},{"id":"EP-K5","label":"Epilogue: If I am taking photos and I photographed people"},{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"},{"id":"EP-K6","label":"Epilogue: If I took photos"}],"about":["which photos you have taken"]}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]},{"t":"line","id":"A5-060","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], you're so slow.”","zh":"“[teacher_name]老师，你走得好慢。”"},{"t":"line","id":"A5-070","who":"Narration","cls":"narr","en":"Panting, my vision swimming, I tried to keep up.","zh":"我气喘吁吁两眼昏花地企图跟上。"},{"t":"line","id":"A5-080","who":"Me","cls":"me","en":"“I'm not as young as you, you know.”","zh":"“老师不像你那么年轻了。”"},{"t":"line","id":"A5-090","who":"Narration","cls":"narr","en":"She laughed so hard she had to crouch on a rock, and for a long while she couldn't get back up.","zh":"她笑得蹲在一块石头上，半天站不起来。"},{"t":"line","id":"A5-110","who":"Narration","cls":"narr","en":"A yellow dog came charging up the path and threw herself against Mai's legs.","zh":"一条黄狗顺着山路冲上来，一头扑到小麦腿上。"},{"t":"line","id":"A5-120","who":"Mai","cls":"talk","en":"“This is Maizai.” Mai cupped the dog's face in her hands. “I named her.”","zh":"“它叫麦仔。”小麦捧着它的脸，“我取的名字。”"},{"t":"line","id":"A5-130","who":"Narration","cls":"narr","en":"Maizai sniffed all around my shoes, seemed to decide I was acceptable, and ran ahead of us with her tail wagging.","zh":"麦仔把我的鞋闻了一圈，好像认定我还算可以，摇着尾巴跑在我们前面。"},{"t":"line","id":"A5-140","who":"Mai","cls":"talk","en":"“Every morning she walks me to the top of the hill,” Mai said, “and every evening she waits for me there.”","zh":"“它每天早上送我到山顶，”小麦说，“晚上就在山顶等我回来。”"},{"t":"line","id":"A5-150","who":"Narration","cls":"narr","en":"Mai's house was at the very back of the valley. From the foot of the hill we walked into the woods, and behind a few plum and pear trees was a yard fenced in with branches.","zh":"小麦的家在山谷最里面。我们从山脚出发往林子里走，在几棵李子树和梨子树后面有一个用一些树枝围起来的院子。"},{"t":"line","id":"A5-160","who":"Narration","cls":"narr","en":"A flock of chickens was filing into the yard, clucking, pecking at the layer of last year's golden corn scattered over the ground, and swaggering right into the house.","zh":"一大群鸡正咕咕咕地往院子里鱼贯而入，啄着地上撒开的一层黄澄澄的陈玉米，大摇大摆地往屋里去了。"},{"t":"line","id":"A5-170","who":"Narration","cls":"narr","en":"As we stepped onto the crunching kernels ourselves, two small figures darted out from behind the house.","zh":"当我们也踩上那层咯吱作响的玉米粒时，从屋子后方突然窜出来两个小小的身影。"},{"t":"line","id":"A5-180","who":"Narration","cls":"narr","en":"Looking closer, I saw two children of four or five. The girl was a little bigger than the boy. They were barefoot, and the mud on their feet ran up their spattered trouser legs to their pale, fraying vests. Even their round cheeks and little noses were smudged black.","zh":"我定睛一看，是两个四五岁的小孩子，其中的女孩比男孩要高大一些。他们没有穿鞋，脚上的泥巴顺着沾满泥点的裤脚一路向上延伸到浅色的脱线背心上，甚至圆圆的脸颊和小小的鼻头上也都黑乎乎的。"},{"t":"line","id":"A5-190","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], this is my second sister, and my fourth brother.”","zh":"“[teacher_name]老师，这是我的二妹和四弟。”"},{"t":"line","id":"A5-200","who":"Narration","cls":"narr","en":"She was about to call them over to say hello, but the moment they saw a stranger in the yard, both of them ran to hide in the house, sneaking glances back at me as they went.","zh":"她正想要招呼弟弟妹妹来给我打招呼，结果两个小孩看到院子里出现了陌生人，不约而同地往屋里躲去，边跑还一边回头偷瞄我。"},{"t":"line","id":"A5-210","who":"Narration","cls":"narr","en":"So I followed Mai inside. It was a summer afternoon, yet somehow the house was dark. In the main room stood a bamboo bed, and an old man sat on it, barefoot too, with a blanket of no particular color over his legs.","zh":"我于是跟小麦一起往屋里走去。明明是夏日的午后，屋里不知道为何却黑黢黢的。客厅里放了一张竹床，一位老人坐在上面，脚上也没有穿鞋，腿上盖着一条看不出颜色的毯子。"},{"t":"line","id":"A5-220","who":"Narration","cls":"narr","en":"At some point Maizai had come in, and now she lay quietly at the old man's feet.","zh":"麦仔不知道何时进了屋，乖乖地趴在老人脚边。"},{"t":"line","id":"A5-230","who":"Mai","cls":"talk","en":"“This is my grandpa. His legs don't work anymore.” Mai said it the way you'd say it was hot today.","zh":"“这是爷爷。爷爷的腿不能走了。”小麦说，语气就像在说今天天气很热。"},{"t":"line","id":"A5-240","who":"Narration","cls":"narr","en":"The room had a heavy smell of bedding that hadn't been washed in a long time, and of urine. A few flies circled the bamboo bed.","zh":"屋里有一股很重的气味，是很久没有换洗的被褥和尿的味道。几只苍蝇在竹床边上绕来绕去。"},{"t":"line","id":"A5-250","who":"Narration","cls":"narr","en":"Mai didn't seem to notice the smell at all. She put down her schoolbag and, with practiced hands, propped up the pillow behind her grandpa.","zh":"小麦像是什么都没闻到。她放下书包，熟练地把爷爷身后的枕头垫高了一点。"},{"t":"line","id":"A5-260","who":"Narration","cls":"narr","en":"Grandpa asked something in the local dialect. When he opened his mouth, drool ran from the corner of his lips and dripped onto the concrete floor. He raised a hand to wipe it away, but a fresh thread of saliva caught on the back of his hand.","zh":"爷爷用方言问了句什么。他张嘴的时候，口水从嘴角流淌出来，一直掉在了水泥地上。他抬起手想擦掉，但是手背又沾上了新的口水丝。"},{"t":"choice","id":"A5-C1","timer":null,"loop":true,"prompt":null,"writes":[],"options":[{"id":"A5-C1A","en":"Check my pockets for a tissue.","zh":"找找口袋里有没有纸。","cond":null,"leaves":false,"body":[{"t":"line","id":"A5-270","who":"Narration","cls":"narr","en":"I felt my pockets. I hadn't brought any tissues today.","zh":"我摸了摸口袋，发现今天并没有带纸。"}]},{"id":"A5-C1B","en":"Look around the room for something to use.","zh":"看看屋里有没有可以用的东西。","cond":null,"leaves":false,"body":[{"t":"line","id":"A5-280","who":"Narration","cls":"narr","en":"Apart from a table, the bamboo bed, and some odds and ends, there were no tissues or cloths anywhere in the room.","zh":"客厅里除了一张桌子、一张竹床和一些杂物外，并没有看到抽纸或者别的布。"}]},{"id":"A5-C1C","en":"Pretend I didn't see anything, as if everything were normal.","zh":"装作什么都没有看到，一切都很正常的样子。","cond":null,"leaves":true,"body":[]}],"affects":[],"about":[]},{"t":"line","id":"A5-290","who":"Narration","cls":"narr","en":"Mai stepped forward and, as if it were nothing, wiped her grandpa's mouth with her own sleeve.","zh":"小麦走上前去，很自然地用自己的袖子替爷爷擦掉口水。"},{"t":"line","id":"A5-300","who":"Mai","cls":"talk","en":"“He's asking if you're the new teacher.”","zh":"“他问你是不是新来的老师。”"},{"t":"line","id":"A5-310","who":"Narration","cls":"narr","en":"I smiled and nodded at Grandpa. He looked at me and kept nodding and nodding.","zh":"我向爷爷笑着点点头。爷爷看着我，一直不住地点头。"},{"t":"line","id":"A5-320","who":"Narration","cls":"narr","en":"The afternoon sun slanted in through the doorway, falling on Grandpa's hands, on the bamboo bed, on the floor.","zh":"下午的阳光从门口斜照进来，落在爷爷的手上，落在竹床上，落在地上。"},{"t":"if","id":"A5-K1","vars":["camera"],"branches":[{"id":"A5-K1a","label":"If I am taking photos","body":[{"t":"line","id":"A5-330","who":"The Lens · inner voice","cls":"inner","en":"If I got this on film, the judges would never forget it...","zh":"这样的场景如果拍下来了，评委一定会记住这个镜头……"},{"t":"line","id":"A5-340","who":"The Passerby · inner voice","cls":"inner","en":"This smell... I really can't stay here. Let's just go.","zh":"这股味道……我真的待不下去了。赶紧走吧。"},{"t":"line","id":"A5-350","who":"The Teacher · inner voice","cls":"inner","en":"Does he even know what a camera is? Would he want to be photographed like this? Could this end up hurting Mai?","zh":"他知道相机是什么吗？他会愿意现在的样子被拍下来吗？这样做以后会伤害到小麦吗？"},{"t":"choice","id":"A5-C2","timer":null,"loop":false,"prompt":null,"writes":["photos"],"options":[{"id":"A5-C2A","en":"Raise the camera and photograph Grandpa.","zh":"举起相机，拍下爷爷。","cond":null,"leaves":false,"body":[{"t":"line","id":"A5-360","who":"Narration","cls":"narr","en":"I took out the camera and raised it to my eye.","zh":"我拿出相机，凑到眼前。"},{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A5-370","who":"Narration","cls":"narr","en":"The shutter clicked. Grandpa's cloudy eyes turned toward the black eye of the lens, as if only now understanding what I was doing.","zh":"快门响了。爷爷浑浊的眼睛看向那个黑洞洞的镜头，好像这才明白我在做什么。"},{"t":"line","id":"A5-380","who":"Narration","cls":"narr","en":"He froze for a moment, then tried to pull the blanket up, but couldn't. Finally he turned his face to the wall and said something in dialect. Mai didn't translate.","zh":"他愣了一会，想把毯子往上拉，又拉不动。最后，他把脸转向了墙，用方言说了一句话。小麦没有翻译。"},{"t":"line","id":"A5-390","who":"Narration","cls":"narr","en":"Mai looked at me, then down at the floor.","zh":"小麦看了看我，又低头看着地面。"},{"t":"line","id":"A5-400","who":"Narration","cls":"narr","en":"The light was beautiful. I knew it would be the best frame on the whole roll.","zh":"光线很美。我知道，这会是整卷胶片里最好的一张。"}]},{"id":"A5-C2B","en":"Leave the camera in my bag.","zh":"把相机留在包里。","cond":null,"leaves":false,"body":[{"t":"line","id":"A5-410","who":"Narration","cls":"narr","en":"I left the camera where it was and sat down on a little stool beside the bamboo bed.","zh":"我没有拿相机，在竹床边的小板凳上坐了下来。"},{"t":"line","id":"A5-420","who":"Narration","cls":"narr","en":"After a while, Grandpa pushed a basin of beans toward me. I copied him and started shelling them, much slower and clumsier than he was.","zh":"过了一会儿，爷爷把身边一盆豆子推到我面前。我学着他的样子剥豆子，比他慢得多，也笨得多。"},{"t":"line","id":"A5-430","who":"Narration","cls":"narr","en":"He watched me for a while, then started to laugh.","zh":"他看了我一会儿，笑了起来。"},{"t":"line","id":"A5-440","who":"Grandpa","cls":"talk","en":"“Stay for dinner.”","zh":"“留下吃饭。”"},{"t":"line","id":"A5-450","who":"Narration","cls":"narr","en":"That much I understood.","zh":"这句我听懂了。"}]}],"affects":[{"id":"A5-K2","label":"Act 5: If I photographed Grandpa"},{"id":"A6-K2","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-K3","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-C1C","label":"Act 6: option “Raise the camera.”"},{"id":"A8-K5","label":"Act 8: If I am taking photos and there is film left"},{"id":"DV-K2","label":"Back in the city: If I took any photos"},{"id":"EP-K0","label":"Epilogue: If I am taking photos and I took photos"},{"id":"EP-K5","label":"Epilogue: If I am taking photos and I photographed people"},{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"},{"id":"EP-K6","label":"Epilogue: If I took photos"}],"about":["which photos you have taken"]}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]},{"t":"if","id":"A5-K2","vars":["photos"],"branches":[{"id":"A5-K2a","label":"If I photographed Grandpa","body":[]},{"id":"A5-K2b","label":"If I did not photograph Grandpa","body":[{"t":"line","id":"A5-470","who":"Grandpa","cls":"talk","en":"“Where are you from?”","zh":"“你是哪里来的？”"},{"t":"line","id":"A5-480","who":"Narration","cls":"narr","en":"Mai translated for him. I said, Beijing.","zh":"小麦在旁边帮着翻译。我说，北京。"},{"t":"line","id":"A5-490","who":"Grandpa","cls":"talk","en":"“Far, that.”","zh":"“远哦。”"},{"t":"if","id":"A5-K3","vars":["camera"],"branches":[{"id":"A5-K3a","label":"If I left the camera in my bag","body":[{"t":"line","id":"A5-510","who":"Narration","cls":"narr","en":"Then he asked whether Mai behaved at school. I said Mai was very bright. Grandpa nodded and went back to shelling beans.","zh":"他又问小麦在学校乖不乖。我说小麦很聪明。爷爷点点头，继续低头剥着豆子。"}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]}]}],"depends":[{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"}]}]},{"t":"line","id":"A5-530","who":"Narration","cls":"narr","en":"We didn't head back until evening. Maizai walked us to the top of the hill, then sat down, as if that were the edge of her world.","zh":"我们傍晚才往回走。麦仔把我们送到山顶，然后坐了下来，好像那里就是它世界的边界。"},{"t":"if","id":"A5-K6","vars":["camera"],"branches":[{"id":"A5-K6a","label":"If I am taking photos","body":[{"t":"choice","id":"A5-C6","timer":"5","loop":false,"prompt":null,"writes":["photos"],"options":[{"id":"A5-C6A","en":"Capture this moment.","zh":"拍下这一刻。","cond":null,"leaves":false,"body":[{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A5-535","who":"Narration","cls":"narr","en":"In the viewfinder she sat bolt upright, a whole sky burning red behind her.","zh":"取景框里，它坐得笔直，身后是一整片烧红的天。"}]},{"id":"A5-C6B","en":"Just watch.","zh":"只是看着。","cond":null,"leaves":false,"body":[]}],"affects":[{"id":"A6-K2","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-K3","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-C1C","label":"Act 6: option “Raise the camera.”"},{"id":"A8-K5","label":"Act 8: If I am taking photos and there is film left"},{"id":"DV-K2","label":"Back in the city: If I took any photos"},{"id":"EP-K0","label":"Epilogue: If I am taking photos and I took photos"},{"id":"EP-K5","label":"Epilogue: If I am taking photos and I photographed people"},{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"},{"id":"EP-K6","label":"Epilogue: If I took photos"}],"about":["which photos you have taken"]}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]}]},{"key":"F1","title":"Fragment 1","nodes":[{"t":"line","id":"F1-010","who":"Narration","cls":"narr","en":"After that, Mai followed me every day after school. When I went to fetch water, she fetched water too. When I graded homework, she leaned on the next desk and watched.","zh":"那之后，小麦每天放学都跟在我后面。我去打水，她也去打水；我改作业，她就趴在旁边的桌子上看。"},{"t":"line","id":"F1-101","who":"Narration","cls":"narr","en":"One noon, on my way to lunch, I passed the classroom and saw Mai still sitting inside.","zh":"有一天中午，我去吃饭，经过教室，看见小麦还坐在里面。"},{"t":"line","id":"F1-111","who":"Me","cls":"me","en":"“Aren't you going to have lunch?”","zh":"“怎么还不去吃饭？”"},{"t":"line","id":"F1-121","who":"Narration","cls":"narr","en":"She held up the plums.","zh":"她把手里的李子举给我看。"},{"t":"line","id":"F1-131","who":"Mai","cls":"talk","en":"“This is lunch. I just picked them.”","zh":"“吃这个。我刚摘的。”"},{"t":"line","id":"F1-141","who":"Me","cls":"me","en":"“Just those two?”","zh":"“就这两个？”"},{"t":"line","id":"F1-151","who":"Narration","cls":"narr","en":"She nodded and took a bite.","zh":"她点点头，咬了一口。"},{"t":"line","id":"F1-161","who":"Narration","cls":"narr","en":"I asked what she ate at home. Pumpkin and potatoes, she said. They grew them themselves.","zh":"我问她在家吃什么。她说南瓜、土豆，都是自家种的。"},{"t":"line","id":"F1-171","who":"Narration","cls":"narr","en":"“What about rice?” I asked. She shook her head hard. “Where would we get the money for rice!”","zh":"“米饭呢？”我问。她忙不迭地摇摇头：“哪来的钱买米哦！”"},{"t":"line","id":"F1-181","who":"Me","cls":"me","en":"“Come on. Have lunch with me today.”","zh":"“走，今天跟老师一起吃。”"},{"t":"line","id":"F1-191","who":"Narration","cls":"narr","en":"She came out of the classroom with me, still holding her plums.","zh":"她拿着剩下的李子，跟我出了教室。"},{"t":"line","id":"F1-012","who":"Narration","cls":"narr","en":"Back then, we all borrowed the bathroom at the village official's house to wash.","zh":"那段时间，我们洗澡都借用村干部家的厕所。"},{"t":"line","id":"F1-014","who":"Narration","cls":"narr","en":"“Washing” really meant a hose hooked up to a tap. The water ran hot, then cold, then a trickle, then a gush, just enough for a quick rinse. We were grateful all the same.","zh":"说是洗澡，其实只是一根水管接在水龙头上。水忽冷忽热，忽大忽小，只够简单冲一冲。可我们还是很感激。"},{"t":"line","id":"F1-016","who":"Narration","cls":"narr","en":"Every time, I brought Mai along. I held the hose for her while she bent over and scrubbed her hair clean, bit by bit.","zh":"每次去，我都会带上小麦。我帮她举着水管，她弯下腰，把头发一点一点搓干净。"},{"t":"line","id":"F1-018","who":"Narration","cls":"narr","en":"Suds ran down her curls into the little gutter in the concrete floor. When she was done, she shook her head and sprayed me with water, and she was the first to laugh.","zh":"泡沫顺着她的卷发流下来，流进水泥地上的小沟里。洗完了，她甩甩头，水珠溅了我一身，她自己先笑了起来。"},{"t":"line","id":"F1-020","who":"Narration","cls":"narr","en":"One day, she slid that cracked phone across the desk to me.","zh":"有一天，她把那部裂了屏的手机推到我面前。"},{"t":"line","id":"F1-030","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], look.”","zh":"“[teacher_name]老师，你看。”"},{"t":"line","id":"F1-040","who":"Narration","cls":"narr","en":"The screen was full of clouds, one photo after another. Morning clouds, noon clouds, evening clouds. Through the cracks, each one looked cut into pieces.","zh":"屏幕上是一张又一张的云。早上的，中午的，傍晚的。隔着那些裂痕，每一朵都像被切成了好几块。"},{"t":"line","id":"F1-060","who":"Narration","cls":"narr","en":"It was the first time she'd shown me the photos on her phone.","zh":"那是她第一次把手机里的照片翻给我看。"}]},{"key":"A6","title":"Act 6 · River bend and cornfield","nodes":[{"t":"if","id":"A6-K1","vars":["camera"],"branches":[{"id":"A6-K1a","label":"If I am taking photos","body":[{"t":"line","id":"A6-010","who":"Narration","cls":"narr","en":"Some time later, one day after school, Mai said her mother was working in the cornfield across the river, and asked if I wanted to come photograph her.","zh":"又过了些日子，一天放学后，小麦说她妈妈在河对岸的玉米地里干活，问我想不想去拍她妈妈。"}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]},{"t":"line","id":"A6-030","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], are you coming?”","zh":"“[teacher_name]老师，你要一起去吗？”"},{"t":"line","id":"A6-040","who":"Me","cls":"me","en":"“Sure.”","zh":"“好呀。”"},{"t":"line","id":"A6-050","who":"Narration","cls":"narr","en":"We followed a low slope, and around a bend, a wide, flat meadow of lush green grass suddenly opened up on our right. A flock of fat geese was strolling across it without a care in the world.","zh":"我们沿着一个小山坡走，拐过一个弯之后，右侧突然出现了一大片绿油油的平坦草地。一群大肥鹅在上面悠哉游哉地散步。"},{"t":"line","id":"A6-060","who":"Mai","cls":"talk","en":"“Maizai!”","zh":"“麦仔！”"},{"t":"line","id":"A6-070","who":"Narration","cls":"narr","en":"I turned around just in time to see Mai fail to catch Maizai.","zh":"我回头，看到小麦没来得及拦住麦仔。"},{"t":"line","id":"A6-080","who":"Narration","cls":"narr","en":"Maizai shot into the meadow like a bullet, tumbling and scrambling straight for the geese. In the brilliant sunshine, the fat geese fled honking ahead of her, every one of them spreading angel-like wings and running belly-first.","zh":"麦仔像一颗子弹一样连滚带爬地钻进草地，直奔鹅群而去。在灿烂的阳光下，一群大肥鹅在前面嘎嘎嘎地逃窜，一个个都张开天使似的翅膀顶着肚子往前跑。"},{"t":"line","id":"A6-090","who":"Narration","cls":"narr","en":"And behind them, never too close and never too far, one very happy yellow dog gave chase.","zh":"而一只开心的大黄狗在后面不远不近地追逐。"},{"t":"if","id":"A6-K2","vars":["camera","photos"],"branches":[{"id":"A6-K2a","label":"If I am taking photos and there is film left","body":[{"t":"choice","id":"A6-C2","timer":"5","loop":false,"prompt":null,"writes":["photos"],"options":[{"id":"A6-C2A","en":"Capture this moment.","zh":"拍下这一刻。","cond":null,"leaves":false,"body":[{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A6-100","who":"The Lens · inner voice","cls":"inner","en":"Good thing I caught that on film. It looked like something out of heaven.","zh":"幸好这一幕被拍下来了，好像在天堂一样美好的一幕。"}]},{"id":"A6-C2B","en":"Just watch.","zh":"只是看着。","cond":null,"leaves":false,"body":[]}],"affects":[{"id":"A6-K3","label":"Act 6: If I am taking photos and there is film left"},{"id":"A6-C1C","label":"Act 6: option “Raise the camera.”"},{"id":"A8-K5","label":"Act 8: If I am taking photos and there is film left"},{"id":"DV-K2","label":"Back in the city: If I took any photos"},{"id":"EP-K0","label":"Epilogue: If I am taking photos and I took photos"},{"id":"EP-K5","label":"Epilogue: If I am taking photos and I photographed people"},{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"},{"id":"EP-K6","label":"Epilogue: If I took photos"}],"about":["which photos you have taken"]}]},{"id":"A6-K2b","label":"Otherwise","body":[]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"}]}]},{"t":"line","id":"A6-110","who":"Narration","cls":"narr","en":"Next we passed a river. The water was shallow and clear, and the stones on the bottom looked close enough to touch.","zh":"我们接着路过一条河流。水很浅，也很清，水底的石头看上去伸手就能摸到。"},{"t":"line","id":"A6-120","who":"Narration","cls":"narr","en":"At the bend, the river suddenly widened and the water became a deep, dark pool. She stopped and tossed a pebble into it.","zh":"走到河湾，河面忽然变宽，水变成了深深的一潭。她突然停下来，往水里扔了一颗石子。"},{"t":"line","id":"A6-130","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], did you know? This is where my third sister died.”","zh":"“[teacher_name]老师你知道吗？我三妹就是在这里没的。”"},{"t":"line","id":"A6-140","who":"Narration","cls":"narr","en":"It was as if that pebble had landed inside me. I was stunned, and I didn't know what to do.","zh":"那颗石头好像扔到了我心里，震惊之余，我手足无措。"},{"t":"line","id":"A6-150","who":"The Teacher · inner voice","cls":"inner","en":"Should I say something? Or give her a hug?","zh":"我该说点什么吗？还是抱抱她？"},{"t":"line","id":"A6-160","who":"The Passerby · inner voice","cls":"inner","en":"This is her private business. Anything I say right now could be wrong.","zh":"这是她的私事。我此刻说什么都可能是错的。"},{"t":"if","id":"A6-K3","vars":["camera","photos"],"branches":[{"id":"A6-K3a","label":"If I am taking photos and there is film left","body":[{"t":"line","id":"A6-170","who":"The Lens · inner voice","cls":"inner","en":"She's standing right where her sister drowned. If I ask her what happened that day and press the shutter, that will be the heart of the whole roll.","zh":"她就站在妹妹溺水的地方。如果现在问她那天发生了什么，再按下快门，这会是整卷胶片的核心。"}]},{"id":"A6-K3b","label":"Otherwise","body":[]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"},{"id":"A6-C2A","label":"Act 6: “Capture this moment.”"}]}]},{"t":"choice","id":"A6-C1","timer":null,"loop":false,"prompt":null,"writes":["photos","trust"],"options":[{"id":"A6-C1A","en":"Say nothing. Stand with her for a while.","zh":"什么也不说，陪她站一会儿。","cond":null,"leaves":false,"body":[{"t":"line","id":"A6-180","who":"Narration","cls":"narr","en":"I didn't say anything. We stood by the pool for a while, then walked on.","zh":"我什么都没有说。我们在潭边站了一会儿，然后继续往前走。"},{"t":"line","id":"A6-190","who":"Narration","cls":"narr","en":"We'd gone a long way before she spoke again.","zh":"走出去很远，她才又开口。"},{"t":"line","id":"A6-200","who":"Mai","cls":"talk","en":"“It rained really hard that day. She never came home.”","zh":"“那天下了很大的雨。她一直没回来。”"},{"t":"line","id":"A6-210","who":"Mai","cls":"talk","en":"“The next morning, some old men on their way to market found her by the river.”","zh":"“第二天早上，去赶集的大爷们在河边看见了她。”"},{"t":"line","id":"A6-212","who":"Narration","cls":"narr","en":"When she finished, she said nothing more. I didn't ask.","zh":"她说完，就不再说了。我也没有追问。"},{"t":"line","id":"A6-214","who":"Narration","cls":"narr","en":"I thought of that pebble sinking. The water had closed over it so quickly, as if nothing had happened at all.","zh":"我想起刚才那颗石子沉下去的样子。水面合拢得那么快，好像什么都没有发生过。"}]},{"id":"A6-C1B","en":"Ask her what happened.","zh":"问她当时发生了什么。","cond":null,"leaves":false,"body":[{"t":"line","id":"A6-220","who":"Me","cls":"me","en":"“What happened that day?”","zh":"“那天是怎么回事？”"},{"t":"line","id":"A6-230","who":"Narration","cls":"narr","en":"She walked on, running her hand over the wild grass by the path.","zh":"她边走边抚摸着路边的野草。"},{"t":"line","id":"A6-240","who":"Mai","cls":"talk","en":"“It was raining really hard that night. It was the middle of the night and she still wasn't home. I ran and told Mom my little sister wasn't back yet. But she was so tired from the farm work. She said we'd go look when the rain stopped, and then she fell right back asleep.”","zh":"“那天夜里雨下的特别大，半夜了也没见她回来。我跑去跟妈说，三妹儿还没回来。但是她干农活太累，说等雨停了再去找，没说两句就又睡着了。”"},{"t":"line","id":"A6-250","who":"Mai","cls":"talk","en":"“The next morning, some old men on their way to market saw her body lying by the river. They ran to our house to tell us. That's how we found out.”","zh":"“等到第二天早上，去赶集的大爷们在河边看见她的身体躺在那里，赶忙跑来我们家，我们才知道。”"},{"t":"line","id":"A6-260","who":"Narration","cls":"narr","en":"Then she said, “Let's go.”","zh":"然后她说：“我们走吧。”"},{"t":"line","id":"A6-264","who":"Narration","cls":"narr","en":"I opened my mouth to say “It wasn't your fault,” but felt I had no right to say anything at all. In the end, I just followed her.","zh":"我张了张嘴，想说“这不是你的错”，又觉得我什么都没资格说。最后，我只是跟上了她。"}]},{"id":"A6-C1C","en":"Raise the camera.","zh":"举起相机。","cond":"you are taking photos and have film left","leaves":false,"body":[{"t":"line","id":"A6-270","who":"Narration","cls":"narr","en":"Almost without thinking, I raised the camera.","zh":"我几乎是下意识地举起了相机。"},{"t":"line","id":"A6-280","who":"Narration","cls":"narr","en":"She saw the lens and was quiet for a moment.","zh":"她看见镜头，沉默了一会。"},{"t":"line","id":"A6-290","who":"Mai","cls":"talk","en":"“It was raining really hard that night. It was the middle of the night and she still wasn't home.”","zh":"“那天夜里雨下的特别大，半夜了也没见她回来。”"},{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A6-30
