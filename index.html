"Act 8: ““I will.””"},{"id":"A8-C1B","label":"Act 8: ““There'll be lots of fun new teachers coming next year.””"},{"id":"A8-C1C","label":"Act 8: ““I probably won't come back next year. But I'll miss you a…"},{"id":"A8-C1D","label":"Act 8: “Say nothing.”"}]}]},{"t":"line","id":"EP-130","who":"Narration","cls":"narr","en":"Many years later.","zh":"很多年以后。"},{"t":"if","id":"EP-K3","vars":["trust","camera","dog","gift"],"branches":[{"id":"EP-K3a","label":"If the children's camera, trust ≥ 4, Maizai lame","body":[{"t":"line","id":"EP-140","who":"Narration","cls":"narr","en":"One day, I received an envelope with no return address. Inside was a stack of photos: the cornfield, the river, a yellow dog with a lame leg. And one of me, standing in the classroom doorway, squinting into the sun. I don't remember when she took it.","zh":"有一天，我收到一个没有寄件地址的信封。里面是一叠照片：玉米地，河，一条瘸了腿的黄狗。还有一张是我，站在教室门口，眯着眼看太阳。我不记得她什么时候拍的。"}]},{"id":"EP-K3b","label":"If the children's camera, trust ≥ 4, Maizai unhurt","body":[{"t":"line","id":"EP-150","who":"Narration","cls":"narr","en":"One day, I received an envelope with no return address. Inside was a stack of photos: the cornfield, the river, a yellow dog sitting on a hilltop. And one of me, standing in the classroom doorway, squinting into the sun. I don't remember when she took it.","zh":"有一天，我收到一个没有寄件地址的信封。里面是一叠照片：玉米地，河，一条蹲在山顶的黄狗。还有一张是我，站在教室门口，眯着眼看太阳。我不记得她什么时候拍的。"}]},{"id":"EP-K3c","label":"If the children's camera, trust ≥ 3, Maizai dead (not interfering caps trust at 3)","body":[{"t":"line","id":"EP-160","who":"Narration","cls":"narr","en":"One day, I received an envelope with no return address. Inside was a stack of photos: the cornfield, the river, an empty hilltop. And one of me, standing in the classroom doorway, squinting into the sun. I don't remember when she took it.","zh":"有一天，我收到一个没有寄件地址的信封。里面是一叠照片：玉米地，河，空荡荡的山顶。还有一张是我，站在教室门口，眯着眼看太阳。我不记得她什么时候拍的。"}]},{"id":"EP-K3d","label":"If the children's camera, trust 2–3","body":[{"t":"line","id":"EP-170","who":"Narration","cls":"narr","en":"That autumn, I received a few photos. The cornfield. The sky above the hilltop. There were no people in them.","zh":"那年秋天，我收到过几张照片。玉米地。山顶上的天空。照片里没有人。"}]},{"id":"EP-K3e","label":"If the children's camera, trust ≤ 1","body":[{"t":"line","id":"EP-180","who":"Narration","cls":"narr","en":"Later, another teacher told me that when the new term began, the camera was still sitting on the teacher's desk. No one had taken it.","zh":"后来听别的老师说，新学期开学的时候，那台相机还放在讲台上。没有人拿走。"}]},{"id":"EP-K3f","label":"If the letter","body":[{"t":"line","id":"EP-190","who":"Narration","cls":"narr","en":"I never found out when she read the letter, or what she was thinking when she did.","zh":"我始终不知道她什么时候读了那封信，读的时候又在想什么。"}]},{"id":"EP-K3g","label":"If nothing or the hair tie","body":[]}],"depends":[{"name":"Mai's trust in you (hidden score)","from_":[{"id":"A3-K4a","label":"Act 3: If I never left Mai"},{"id":"A6-C1A","label":"Act 6: “Say nothing. Stand with her for a while.”"},{"id":"A7-C1A","label":"Act 7: ““Let's look for it when the rain stops. It's too dangerous…"},{"id":"A7-K4a","label":"Act 7: If I waited for the others"},{"id":"A7-KW9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-K4b","label":"Act 7: If I rushed in"},{"id":"A7-KR9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-C3A","label":"Act 7: “Tell her the truth.”"},{"id":"A8-K0a","label":"Act 8: If I told her sister's story in front of the teachers"}]},{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"what happened to Maizai","from_":[{"id":"A7-K4a","label":"Act 7: If I waited for the others"},{"id":"A7-K4b","label":"Act 7: If I rushed in"},{"id":"A7-K4c","label":"Act 7: If I did not interfere"}]},{"name":"what you left for Mai","from_":[{"id":"A8-C2A","label":"Act 8: “Leave nothing.”"},{"id":"A8-C2B","label":"Act 8: “Leave her a children's camera.”"},{"id":"A8-C2D","label":"Act 8: “Leave her a letter.”"}]}]},{"t":"line","id":"EP-200","who":"Narration","cls":"narr","en":"Many years later, I still remember that rainy night, but I can no longer remember her voice.","zh":"很多年以后，那个雨夜我还记得，可我已经想不起她的声音了。"},{"t":"if","id":"EP-K4","vars":["camera","photos","festival"],"branches":[{"id":"EP-K4a","label":"If I am taking photos, I took photos, and I did not enter the contest","body":[{"t":"line","id":"EP-210","who":"Narration","cls":"narr","en":"I've kept those photos all this time, tucked into an old album, and every so often I take them out. But every time, it's like looking at someone else's summer.","zh":"那几张照片我一直留着，夹在一本旧相册里，时不时翻出来看。可每次看，都像在看别人的夏天。"}]},{"id":"EP-K4b","label":"Otherwise","body":[]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"},{"id":"A6-C2A","label":"Act 6: “Capture this moment.”"},{"id":"A6-C1C","label":"Act 6: “Raise the camera.”"},{"id":"A8-C5A","label":"Act 8: “Capture this moment.”"}]},{"name":"what you did about the photo contest","from_":[{"id":"EP-C2A","label":"Epilogue: “Submit the ones with people in them.”"},{"id":"EP-C2B","label":"Epilogue: “Put away the ones with people, then submit.”"},{"id":"EP-C2C","label":"Epilogue: “Ask her first.”"},{"id":"EP-C2D","label":"Epilogue: “Don't submit it.”"}]}]},{"t":"line","id":"EP-220","who":"Narration","cls":"narr","en":"What that month meant to her, I don't know.","zh":"那一个月对她来说意味着什么，我不知道。"},{"t":"line","id":"EP-230","who":"Narration","cls":"narr","en":"I don't even know how I should remember you.","zh":"我甚至不知道，我该怎么回忆你。"},{"t":"if","id":"EP-K6","vars":["camera","photos"],"branches":[{"id":"EP-K6a","label":"If I took photos","body":[{"t":"mark","text":"The developed photos are shown here","link":null}]},{"id":"EP-K6b","label":"Otherwise","body":[]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"},{"id":"A6-C2A","label":"Act 6: “Capture this moment.”"},{"id":"A6-C1C","label":"Act 6: “Raise the camera.”"},{"id":"A8-C5A","label":"Act 8: “Capture this moment.”"}]}]},{"t":"line","id":"EP-240","who":"Narration","cls":"narr","en":"The rest, I'll leave in that cornfield. Next autumn, she'll grow up well, I hope.","zh":"更多的，就留在那片玉米地里吧。来年秋天，她会长得很好吧。"}]},{"key":"END","title":"Ending","nodes":[{"t":"line","id":"END-010","who":"Title card","cls":"title","en":"The End","zh":"完"}]},{"key":"UI","title":"Menus and mini-game text","nodes":[{"t":"line","id":"UI-010","who":"Interface","cls":"ui","en":"What should the children call me?","zh":"孩子们该怎么称呼我？"},{"t":"line","id":"UI-020","who":"Interface","cls":"ui","en":"Just the name. No need to add “Teacher.”","zh":"只填名字，不用加‘老师’"},{"t":"line","id":"UI-030","who":"Interface","cls":"ui","en":"OK","zh":"确定"},{"t":"line","id":"UI-040","who":"Interface","cls":"ui","en":"Language","zh":"语言"},{"t":"line","id":"UI-050","who":"Interface","cls":"ui","en":"Days left","zh":"剩余天数"},{"t":"line","id":"UI-300","who":"Interface","cls":"ui","en":"Content Warning","zh":"内容提示"},{"t":"line","id":"UI-310","who":"Interface","cls":"ui","en":"This story involves abuse and violence, and depicts physical harm and psychological trauma.","zh":"本片涉及虐待与暴力，并描写身体伤害及心理创伤。"},{"t":"line","id":"UI-320","who":"Interface","cls":"ui","en":"Click to continue","zh":"点击继续"},{"t":"line","id":"UI-400","who":"Interface","cls":"ui","en":"Mai: “Hurry up, Teacher [teacher_name]. Class is about to start.”","zh":"小麦：“[teacher_name]老师你快点，要上课了。”"},{"t":"line","id":"UI-401","who":"Interface","cls":"ui","en":"She was still sitting perfectly still.","zh":"她还一动不动地坐着。"},{"t":"line","id":"UI-402","who":"Interface","cls":"ui","en":"Mai: “Ow—”","zh":"小麦：“嘶——”"},{"t":"line","id":"UI-403","who":"Interface","cls":"ui","en":"She didn't move, but her shoulders went tight.","zh":"她没有动，肩膀一下子绷紧了。"},{"t":"line","id":"UI-404","who":"Interface","cls":"ui","en":"Two girls","zh":"两个女生"},{"t":"line","id":"UI-405","who":"Interface","cls":"ui","en":"“Teacher [teacher_name], do one for me too!”","zh":"“[teacher_name]老师，也给我编一个！”"},{"t":"line","id":"UI-406","who":"Interface","cls":"ui","en":"“Teacher! The fan's stopped working!”","zh":"“老师！电扇不转了！”"},{"t":"line","id":"UI-407","who":"Interface","cls":"ui","en":"“Teacher, he took my notebook and won't give it back!”","zh":"“老师，他拿了我的本子不还！”"},{"t":"line","id":"UI-408","who":"Interface","cls":"ui","en":"They stood beside me, waiting.","zh":"她们站在旁边等着。"},{"t":"line","id":"UI-409","who":"Interface","cls":"ui","en":"They got their turn.","zh":"她们等到了。"},{"t":"line","id":"UI-410","who":"Interface","cls":"ui","en":"They walked off, a little disappointed.","zh":"她们有点失落地走开了。"},{"t":"line","id":"UI-411","who":"Interface","cls":"ui","en":"They pouted and walked away.","zh":"她们嘟着嘴走开了。"},{"t":"line","id":"UI-412","who":"Interface","cls":"ui","en":"You never answered them.","zh":"你一直没有回应她们。"},{"t":"line","id":"UI-413","who":"Interface","cls":"ui","en":"He's waiting under the fan.","zh":"他站在电扇底下等着。"},{"t":"line","id":"UI-414","who":"Interface","cls":"ui","en":"You've gone to fix the fan...","zh":"你去修电扇了……"},{"t":"line","id":"UI-415","who":"Interface","cls":"ui","en":"The fan's spinning again.","zh":"电扇又转起来了。"},{"t":"line","id":"UI-416","who":"Interface","cls":"ui","en":"He waited and waited, but you never came. He went back to his seat, glum.","zh":"他等了半天，你也没过去。他闷闷不乐地回了座位。"},{"t":"line","id":"UI-417","who":"Interface","cls":"ui","en":"“You've got favorites!” He stomped off.","zh":"“老师偏心！”他生气地走开了。"},{"t":"line","id":"UI-418","who":"Interface","cls":"ui","en":"You never answered him.","zh":"你一直没有回应他。"},{"t":"line","id":"UI-419","who":"Interface","cls":"ui","en":"She got her notebook back.","zh":"本子要回来了。"},{"t":"line","id":"UI-420","who":"Interface","cls":"ui","en":"She went back to her seat, sulking.","zh":"她闷闷地回到了座位上。"},{"t":"line","id":"UI-421","who":"Interface","cls":"ui","en":"She put her head down on the desk and cried.","zh":"她趴在桌上哭了。"},{"t":"line","id":"UI-422","who":"Interface","cls":"ui","en":"You never answered her.","zh":"你一直没有回应她。"},{"t":"line","id":"UI-423","who":"Interface","cls":"ui","en":"I'll do yours as soon as Mai's is done.","zh":"等我编完小麦的，就给你们编。"},{"t":"line","id":"UI-424","who":"Interface","cls":"ui","en":"There isn't time today. Tomorrow, okay?","zh":"今天来不及了，明天吧。"},{"t":"line","id":"UI-425","who":"Interface","cls":"ui","en":"Just a second!","zh":"等我一下！"},{"t":"line","id":"UI-426","who":"Interface","cls":"ui","en":"Go help","zh":"过去帮忙"},{"t":"line","id":"UI-427","who":"Interface","cls":"ui","en":"A-Jie, give it back to her.","zh":"阿杰，还给她。"},{"t":"line","id":"UI-428","who":"Interface","cls":"ui","en":"We'll sort it out after school.","zh":"放学再说。"},{"t":"line","id":"UI-429","who":"Interface","cls":"ui","en":"Braiding","zh":"编辫子"},{"t":"line","id":"UI-430","who":"Interface","cls":"ui","en":"Take turns clicking the left and right strands to cross them over the middle one. You can also use the ← → keys.","zh":"轮流点左边和右边的那股头发，让它跨过中间那股。也可以按键盘的 ← →。"},{"t":"line","id":"UI-431","who":"Interface","cls":"ui","en":"Other students will come to you on the right. Watch their patience bars and respond before they run out.","zh":"右边会有同学来找你。留意他们的耐心条，在它走完之前回应。"},{"t":"line","id":"UI-432","who":"Interface","cls":"ui","en":"Finish the braid before the bell rings.","zh":"上课铃响之前，把辫子编完。"},{"t":"line","id":"UI-433","who":"Interface","cls":"ui","en":"(Timers are off: each click on the braid counts as one tick of time.)","zh":"（限时已关闭：每点一下辫子算一格时间。）"},{"t":"line","id":"UI-434","who":"Interface","cls":"ui","en":"Start","zh":"开始"},{"t":"line","id":"UI-435","who":"Interface","cls":"ui","en":"Bell","zh":"上课铃"},{"t":"line","id":"UI-436","who":"Interface","cls":"ui","en":"Left","zh":"左"},{"t":"line","id":"UI-437","who":"Interface","cls":"ui","en":"Middle","zh":"中"},{"t":"line","id":"UI-438","who":"Interface","cls":"ui","en":"Right","zh":"右"},{"t":"line","id":"UI-439","who":"Interface","cls":"ui","en":"Her curls are tangled. Click a few times to work them loose.","zh":"卷发缠住了，连点几下解开它。"},{"t":"line","id":"UI-440","who":"Interface","cls":"ui","en":"Untangle","zh":"解开"},{"t":"line","id":"UI-441","who":"Interface","cls":"ui","en":"The braid is done.","zh":"辫子编好了。"},{"t":"line","id":"UI-442","who":"Interface","cls":"ui","en":"Play again","zh":"再来一次"},{"t":"line","id":"UI-443","who":"Interface","cls":"ui","en":"Continue","zh":"继续"},{"t":"line","id":"UI-444","who":"Interface","cls":"ui","en":"The bell rang, and the braid wasn't finished.","zh":"上课铃响了，辫子还没编完。"},{"t":"line","id":"UI-445","who":"Interface","cls":"ui","en":"Try again","zh":"重来"},{"t":"line","id":"UI-500","who":"Interface","cls":"ui","en":"Your earlier choices have left their mark on how this moment unfolds","zh":"你以前的选择在这一帧的走向里留下了印记"},{"t":"line","id":"UI-100","who":"Interface","cls":"ui","en":"Placeholder: before leaving","zh":"占位背景：出发之前"},{"t":"line","id":"UI-110","who":"Interface","cls":"ui","en":"Placeholder: the name list","zh":"占位背景：出发前的名单"},{"t":"line","id":"UI-120","who":"Interface","cls":"ui","en":"Placeholder: classroom at sunset","zh":"占位背景：夕阳下的教室"},{"t":"line","id":"UI-130","who":"Interface","cls":"ui","en":"Placeholder: the old dormitory","zh":"占位背景：废弃的旧宿舍"},{"t":"line","id":"UI-140","who":"Interface","cls":"ui","en":"Placeholder: the village shop","zh":"占位背景：村里的小卖部"},{"t":"line","id":"UI-150","who":"Interface","cls":"ui","en":"Placeholder: classroom at night","zh":"占位背景：夜晚的教室"},{"t":"line","id":"UI-160","who":"Interface","cls":"ui","en":"Placeholder: classroom in the morning","zh":"占位背景：清晨的教室"},{"t":"line","id":"UI-170","who":"Interface","cls":"ui","en":"Placeholder: bamboo path over the hill","zh":"占位背景：翻山的竹林小路"},{"t":"line","id":"UI-180","who":"Interface","cls":"ui","en":"Placeholder: the yard scattered with old corn","zh":"占位背景：撒着陈玉米的院子"},{"t":"line","id":"UI-190","who":"Interface","cls":"ui","en":"Placeholder: Mai's dim main room","zh":"占位背景：小麦家昏暗的客厅"},{"t":"line","id":"UI-200","who":"Interface","cls":"ui","en":"Placeholder: the goose meadow","zh":"占位背景：鹅群草地"},{"t":"line","id":"UI-210","who":"Interface","cls":"ui","en":"Placeholder: the river bend","zh":"占位背景：河湾"},{"t":"line","id":"UI-220","who":"Interface","cls":"ui","en":"Placeholder: the cornfield across the river","zh":"占位背景：河对岸的玉米地"},{"t":"line","id":"UI-230","who":"Interface","cls":"ui","en":"Placeholder: rainy night","zh":"占位背景：雨夜"},{"t":"line","id":"UI-240","who":"Interface","cls":"ui","en":"Placeholder: the chicken coop in the rain","zh":"占位背景：雨夜的鸡舍"},{"t":"line","id":"UI-250","who":"Interface","cls":"ui","en":"Placeholder: the old locust tree at the village edge","zh":"占位背景：村口的老槐树"},{"t":"line","id":"UI-260","who":"Interface","cls":"ui","en":"Placeholder: after leaving","zh":"占位背景：离开之后"},{"t":"line","id":"UI-270","who":"Interface","cls":"ui","en":"Placeholder: many years later","zh":"占位背景：很多年以后"},{"t":"line","id":"UI-272","who":"Interface","cls":"ui","en":"Placeholder: the little restaurant beside the school","zh":"占位背景：学校旁的小餐馆"},{"t":"line","id":"UI-274","who":"Interface","cls":"ui","en":"Placeholder: the classroom at noon","zh":"占位背景：中午的教室"},{"t":"line","id":"UI-276","who":"Interface","cls":"ui","en":"Placeholder: the bathroom at the village official's house","zh":"占位背景：村干部家的厕所"},{"t":"line","id":"UI-278","who":"Interface","cls":"ui","en":"Placeholder: the darkroom","zh":"占位背景：暗房"},{"t":"line","id":"UI-279","who":"Interface","cls":"ui","en":"Placeholder: the darkroom with the light on","zh":"占位背景：开了灯的暗房"},{"t":"line","id":"UI-600","who":"Interface","cls":"ui","en":"Film left","zh":"剩余胶卷"},{"t":"line","id":"UI-610","who":"Interface","cls":"ui","en":"Press the shutter when the aperture closes inside the gold ring (click or Space).","zh":"光圈收进金色刻度里时，按下快门（点击或空格）。"},{"t":"line","id":"UI-611","who":"Interface","cls":"ui","en":"Out of focus. You have one more try.","zh":"没对上焦。只能再试一次。"},{"t":"line","id":"UI-612","who":"Interface","cls":"ui","en":"Last try.","zh":"最后一次。"},{"t":"line","id":"UI-620","who":"Interface","cls":"ui","en":"The classroom at dusk. She has just washed her face; the hair on her forehead is still dripping, and she is laughing at the lens.","zh":"傍晚的教室。她刚洗过脸，额前的头发还在滴水，冲着镜头笑。"},{"t":"line","id":"UI-621","who":"Interface","cls":"ui","en":"The classroom at dusk, blurred into a wash of orange. But I remember the hair on her forehead was still dripping.","zh":"傍晚的教室，糊成了一片橘色。可我记得，她额前的头发还在滴水。"},{"t":"line","id":"UI-624","who":"Interface","cls":"ui","en":"The empty classroom at dusk. Crooked desks and chairs, a layer of gold light beyond the windows.","zh":"傍晚空下来的教室。桌椅歪歪扭扭，窗外是一层金色的光。"},{"t":"line","id":"UI-625","who":"Interface","cls":"ui","en":"The classroom, blurred into an orange haze. The desks are only faint shadows.","zh":"糊成一片橘色的教室。桌椅只剩一些模糊的影子。"},{"t":"line","id":"UI-622","who":"Interface","cls":"ui","en":"Dapples of light in the bamboo, resting on her shoulders and her braid.","zh":"竹林里的光斑，落在她的肩膀和辫子上。"},{"t":"line","id":"UI-623","who":"Interface","cls":"ui","en":"A blurred bamboo grove, nothing but soft blots of light. Somewhere in there, her braid is bouncing.","zh":"糊掉的竹林，只剩一团一团的光。她的辫子在里面一跳一跳的。"},{"t":"line","id":"UI-626","who":"Interface","cls":"ui","en":"In the dim room, the old man is trying to pull his blanket up. The photo is sharp, so sharp I can't bring myself to look for long.","zh":"昏暗的屋子里，老人想把毯子往上拉。照片很清楚，清楚得让我不敢多看。"},{"t":"line","id":"UI-627","who":"Interface","cls":"ui","en":"A dim room, a blurred figure turning his face to the wall. To my surprise, I was a little relieved it came out blurred.","zh":"昏暗的屋子，一个模糊的人影把脸转向了墙。我竟然有点庆幸，它糊了。"},{"t":"line","id":"UI-628","who":"Interface","cls":"ui","en":"The hilltop at dusk. Maizai sits at the edge of her world.","zh":"傍晚的山顶，麦仔坐在它世界的边界上。"},{"t":"line","id":"UI-629","who":"Interface","cls":"ui","en":"A small blurred yellow dot on the hilltop. I know it's Maizai, waiting for her to come home.","zh":"山顶上一个模糊的小黄点。我知道那是麦仔，在等她回家。"},{"t":"line","id":"UI-630","who":"Interface","cls":"ui","en":"In the sunshine, the fat geese flee with their wings spread, and Maizai chases them, never too close and never too far.","zh":"阳光下，一群大肥鹅张着翅膀逃窜，麦仔在后面不远不近地追。"},{"t":"line","id":"UI-631","who":"Interface","cls":"ui","en":"A frame full of shaking white wings and one streak of yellow. Badly blurred, and the liveliest one of all.","zh":"满画面晃动的白翅膀和一道黄影。糊得厉害，却是最热闹的一张。"},{"t":"line","id":"UI-632","who":"Interface","cls":"ui","en":"The river bend. Her back is to the lens; she stopped halfway through what she was saying.","zh":"河湾。她背对着镜头，话说到一半就停住了。"},{"t":"line","id":"UI-633","who":"Interface","cls":"ui","en":"The river bend, a blur of dark water. That day she stopped halfway, and said no more.","zh":"河湾，一片模糊的深色水面。那天她说到一半，就不说了。"},{"t":"line","id":"UI-634","who":"Interface","cls":"ui","en":"The yards spread with new corn, a sheet of gold. That was the morning I left.","zh":"院坝上铺满了新玉米，金灿灿的一片。那是我离开的早晨。"},{"t":"line","id":"UI-635","who":"Interface","cls":"ui","en":"A blur of gold. That was the morning I left; the cart was already moving.","zh":"一片糊掉的金黄。那是我离开的早晨，车已经开动了。"},{"t":"line","id":"UI-640","who":"Interface","cls":"ui","en":"The rest of the frames were blank.","zh":"剩下的几格胶片，是空白的。"},{"t":"line","id":"UI-650","who":"Interface","cls":"ui","en":"Five Frames","zh":"五张胶片"},{"t":"line","id":"UI-651","who":"Interface","cls":"ui","en":"You only have five frames of film. You won't see what you took until you leave the village and develop the roll back in the city.","zh":"你只有五张胶片。拍下的照片要等离开村子、回到城里，才能洗出来看。"},{"t":"line","id":"UI-652","who":"Interface","cls":"ui","en":"When a moment is worth taking, “Capture this moment” will appear. Save your film for the moments you most want to keep.","zh":"遇到值得拍的瞬间，会出现“拍下这一刻”。请抓住你最想留下的瞬间。"},{"t":"line","id":"UI-653","who":"Interface","cls":"ui","en":"Once the camera is raised, press the shutter when the aperture closes inside the gold ring. If you miss, you get one more try.","zh":"举起相机后，等光圈收进金色刻度里，再按下快门。没对准可以重来一次。"},{"t":"line","id":"UI-654","who":"Interface","cls":"ui","en":"Got it","zh":"知道了"},{"t":"line","id":"UI-660","who":"Interface","cls":"ui","en":"Mai trusts you more.","zh":"小麦对你的信任增加了"},{"t":"line","id":"UI-661","who":"Interface","cls":"ui","en":"Mai trusts you less.","zh":"小麦对你的信任减少了"}]}],"linked":{"A5-C5A":["A5-C5A","A5-C6A","A6-C2A","A8-C5A"],"A5-C6A":["A5-C5A","A5-C6A","A6-C2A","A8-C5A"],"A6-C2A":["A5-C5A","A5-C6A","A6-C2A","A8-C5A"],"A8-C5A":["A5-C5A","A5-C6A","A6-C2A","A8-C5A"],"A5-C5B":["A5-C5B","A5-C6B","A6-C2B","A8-C5B"],"A5-C6B":["A5-C5B","A5-C6B","A6-C2B","A8-C5B"],"A6-C2B":["A5-C5B","A5-C6B","A6-C2B","A8-C5B"],"A8-C5B":["A5-C5B","A5-C6B","A6-C2B","A8-C5B"],"A7-C2A":["A7-C2A","A7-C4A"],"A7-C4A":["A7-C2A","A7-C4A"],"A7-C2B":["A7-C2B","A7-C4B"],"A7-C4B":["A7-C2B","A7-C4B"],"A7-C2C":["A7-C2C","A7-C4C"],"A7-C4C":["A7-C2C","A7-C4C"],"A7-CW1A":["A7-CW1A","A7-CW2A","A7-CR1A","A7-CR2A"],"A7-CW2A":["A7-CW1A","A7-CW2A","A7-CR1A","A7-CR2A"],"A7-CR1A":["A7-CW1A","A7-CW2A","A7-CR1A","A7-CR2A"],"A7-CR2A":["A7-CW1A","A7-CW2A","A7-CR1A","A7-CR2A"],"A7-CW1B":["A7-CW1B","A7-CW2B","A7-CR1B","A7-CR2B"],"A7-CW2B":["A7-CW1B","A7-CW2B","A7-CR1B","A7-CR2B"],"A7-CR1B":["A7-CW1B","A7-CW2B","A7-CR1B","A7-CR2B"],"A7-CR2B":["A7-CW1B","A7-CW2B","A7-CR1B","A7-CR2B"],"A7-CW1C":["A7-CW1C","A7-CW2C","A7-CR1C","A7-CR2C"],"A7-CW2C":["A7-CW1C","A7-CW2C","A7-CR1C","A7-CR2C"],"A7-CR1C":["A7-CW1C","A7-CW2C","A7-CR1C","A7-CR2C"],"A7-CR2C":["A7-CW1C","A7-CW2C","A7-CR1C","A7-CR2C"],"A7-CW1D":["A7-CW1D","A7-CR1D"],"A7-CR1D":["A7-CW1D","A7-CR1D"],"A7-CW2D":["A7-CW2D","A7-CR2D"],"A7-CR2D":["A7-CW2D","A7-CR2D"],"A7-CW2E":["A7-CW2E","A7-CR2E"],"A7-CR2E":["A7-CW2E","A7-CR2E"],"A7-CW2F":["A7-CW2F","A7-CR2F"],"A7-CR2F":["A7-CW2F","A7-CR2F"],"EP-C3B":["EP-C3B","EP-C4A"],"EP-C4A":["EP-C3B","EP-C4A"],"EP-C3C":["EP-C3C","EP-C4C","EP-C5C","EP-C6C"],"EP-C4C":["EP-C3C","EP-C4C","EP-C5C","EP-C6C"],"EP-C5C":["EP-C3C","EP-C4C","EP-C5C","EP-C6C"],"EP-C6C":["EP-C3C","EP-C4C","EP-C5C","EP-C6C"]}};
const KEY = "mei-script-edits-v1";
const COLORS = 7;

/* ---------- index ---------- */
const lines = {};          // id -> {en, zh, who}
const where = {};          // id -> {ch, path:[[blockId, branchIndex]]}
const ordered = [];        // ids in reading order
function index(nodes, ch, path) {
  for (const n of nodes) {
    if (n.t === "line") addLine(n, ch, path);
    else if (n.t === "choice") {
      where[n.id] = {ch, path};
      if (n.prompt) addLine(n.prompt, ch, path);
      n.options.forEach((o, i) => {
        const p = path.concat([[n.id, i]]);
        addLine({id: o.id, en: o.en, zh: o.zh, who: "Choice button"}, ch, p);
        index(o.body, ch, p);
      });
    } else if (n.t === "if") {
      where[n.id] = {ch, path};
      n.branches.forEach((b, i) => {
        const p = path.concat([[n.id, i]]);
        where[b.id] = {ch, path: p};
        index(b.body, ch, p);
      });
    }
  }
}
function addLine(n, ch, path) {
  lines[n.id] = n;
  where[n.id] = {ch, path};
  ordered.push(n.id);
}
DATA.chapters.forEach((c, i) => index(c.nodes, i, []));

/* ---------- saved edits ---------- */
let edits = {};            // id -> {orig, text?, note?}
let storageOk = true;
try { edits = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { storageOk = false; }
for (const e of Object.values(edits)) if (e.text !== undefined) e.text = tidy(e.text);   // closed mid-typing
function clean() {
  for (const [id, e] of Object.entries(edits)) {
    if (!lines[id] && !where[id]) continue;          // keep unknown ids so nothing is lost
    if (e.text !== undefined && lines[id] && e.text === lines[id].en) delete e.text;
    if (e.text === undefined && !e.note) delete edits[id];
  }
}
function persist() {
  clean();
  try { localStorage.setItem(KEY, JSON.stringify(edits)); storageOk = true; }
  catch (e) { storageOk = false; }
  if (!storageOk) say("This browser is not saving your work. Download your changes before closing the page.");
  updateCounts();
}
const current = id => edits[id]?.text ?? lines[id].en;

/* ---------- text rules (same as the build script) ---------- */
function tidy(s) {
  s = s.replace(/[ \r\n\t]+/g, " ").replace(/ {2,}/g, " ").trim();
  return s.replace(/"/g, (m, i, all) => {
    const before = all[i - 1] || " ", after = all[i + 1] || " ";
    if (/[\s(‘“*]/.test(before)) return "“";
    if (/[—–-]/.test(before) && /\w/.test(after)) return "“";
    return "”";
  });
}
const count = (s, t) => s.split(t).length - 1;
function problems(id, text) {
  const zh = lines[id].zh, out = [], token = DATA.nameToken;
  if (!text) return ["This line cannot be empty."];
  const rest = text.split(token).join("");
  if (/[{}\[\]\\"]/.test(rest)) out.push("Please remove these characters: { } [ ] \\  (the only exception is " + token + ").");
  if (rest.replace(/\*[^*\s](?:[^*]*[^*\s])?\*/g, "").includes("*")) out.push("Emphasis needs a pair of asterisks around the word, like *this*.");
  if (count(text, token) !== count(zh, token)) out.push("This line should contain " + token + " exactly " + count(zh, token) + " time(s).");
  if (text.includes("*") !== zh.includes("*")) out.push(zh.includes("*") ? "Keep one word emphasised with *asterisks* (the Chinese line has emphasis)." : "Please remove the asterisks (the Chinese line has no emphasis).");
  return out;
}

/* ---------- DOM helpers ---------- */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
}
let msgTimer;
function say(text) {
  const m = document.getElementById("msg");
  m.textContent = text; m.className = "show"; fit();
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { m.className = ""; fit(); }, 9000);
}
function fit() {
  document.documentElement.style.setProperty("--top", document.getElementById("top").offsetHeight + "px");
}

/* ---------- one editable line ---------- */
function setText(id, text) {
  for (const other of (DATA.linked[id] || [id])) {
    const e = edits[other] || (edits[other] = {orig: lines[other].en});
    if (e.text === undefined) e.orig = lines[other].en;
    e.text = text;
  }
  persist();
  (DATA.linked[id] || [id]).forEach(refresh);
}
function revert(id) {
  for (const other of (DATA.linked[id] || [id])) if (edits[other]) delete edits[other].text;
  persist();
  (DATA.linked[id] || [id]).forEach(refresh);
}
function refresh(id) {
  document.querySelectorAll('[data-line="' + id + '"]').forEach(box => {
    const e = edits[id], changed = e?.text !== undefined, text = current(id);
    const field = box.querySelector(":scope>.text");
    if (field.textContent !== text) field.textContent = text;
    const bad = problems(id, text);
    box.classList.toggle("edited", changed);
    box.classList.toggle("bad", bad.length > 0);
    const extra = box.querySelector(":scope>.extra");
    extra.replaceChildren();
    bad.forEach(b => extra.append(el("div", {class: "warn"}, b)));
    if (changed) {
      extra.append(el("div", {class: "orig"}, "Original: " + lines[id].en,
        el("button", {onclick: () => revert(id)}, "Undo")));
      if (e.orig !== lines[id].en) extra.append(el("div", {class: "warn"}, "The script was updated after you edited this line. Your text was based on: " + e.orig));
    }
  });
  markTabs();
}
function noteArea(id) {
  const area = el("textarea", {class: "note", placeholder: "Note to the author (for example: add a line after this one, or why you changed it)"});
  area.value = edits[id]?.note || "";
  area.addEventListener("input", () => {
    const e = edits[id] || (edits[id] = {orig: lines[id]?.en ?? ""});
    if (area.value.trim()) e.note = area.value; else delete e.note;
    persist();
  });
  return area;
}
function noteButton(id, host) {
  return el("button", {class: "notebtn", onclick: () => {
    let area = host().querySelector(":scope>.note");
    if (!area) { area = noteArea(id); host().append(area); }
    area.focus();
  }}, "+ note");
}
function lineBox(n, who) {
  const id = n.id;
  const box = el("div", {class: "line " + (n.cls || ""), "data-line": id, "data-id": id});
  const field = el("div", {class: "text", spellcheck: "true", lang: "en"});
  field.setAttribute("contenteditable", "plaintext-only");
  if (field.contentEditable !== "plaintext-only") field.setAttribute("contenteditable", "true");
  field.textContent = current(id);
  field.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); field.blur(); } });
  field.addEventListener("input", () => {
    // save while typing; tidy up quotes and spaces when leaving the box
    const e = edits[id] || (edits[id] = {orig: lines[id].en});
    if (e.text === undefined) e.orig = lines[id].en;
    e.text = field.textContent;
    try { localStorage.setItem(KEY, JSON.stringify(edits)); } catch (err) { storageOk = false; }
  });
  field.addEventListener("blur", () => {
    const text = tidy(field.textContent);
    if (text === current(id) && text === field.textContent && edits[id]?.text === undefined) return;
    setText(id, text);
  });
  box.append(
    el("div", {class: "meta"}, el("span", {class: "who"}, who || n.who), el("span", {class: "eid"}, id), noteButton(id, () => box)),
    field,
    el("div", {class: "zh", lang: "zh"}, n.zh),
    el("div", {class: "extra"}));
  if (DATA.linked[id]) box.append(el("div", {class: "shared"}, "The same text appears in " + DATA.linked[id].length + " places (" + DATA.linked[id].join(", ") + "). They change together."));
  if (edits[id]?.note) box.append(noteArea(id));
  return box;
}

/* ---------- blocks ---------- */
const view = {};           // blockId -> {all:bool, tab:int}
const letter = i => String.fromCharCode(65 + i);
const nested = branches => branches.some(b => b.body.some(n => n.t === "choice" || n.t === "if"));
const chips = list => list.map(x => el("button", {class: "chip", onclick: () => go(x.id)}, x.label));
function branchIds(branch) {
  const out = [];
  (function walk(b) {
    out.push(b.id);
    for (const n of b.body) {
      if (n.t === "line") out.push(n.id);
      if (n.t === "choice") { out.push(n.id); if (n.prompt) out.push(n.prompt.id); n.options.forEach(walk); }
      if (n.t === "if") { out.push(n.id); n.branches.forEach(walk); }
    }
  })(branch);
  return out;
}
function markTabs() {
  document.querySelectorAll(".tab").forEach(t => {
    const has = t.dataset.ids.split(" ").some(i => edits[i]);
    const dot = t.querySelector(".dot");
    if (has && !dot) t.append(el("span", {class: "dot", title: "You changed something in here"}));
    if (!has && dot) dot.remove();
  });
}
function columns(blockId, branches, makeColumn, tabLabel) {
  const wrap = el("div");
  const deep = nested(branches);
  const state = view[blockId] || (view[blockId] = {all: !deep, tab: 0});
  const draw = () => {
    wrap.replaceChildren();
    if (deep) {
      const bar = el("div", {class: "toolbar"});
      if (!state.all) branches.forEach((b, i) => bar.append(el("button", {
        class: "tab" + (i === state.tab ? " on" : ""), style: "--c:var(--c" + i % COLORS + ")", "data-ids": branchIds(b).join(" "),
        onclick: () => { state.tab = i; draw(); }}, tabLabel(b, i))));
      bar.append(el("button", {class: "mode", onclick: () => { state.all = !state.all; draw(); }},
        state.all ? "Show one path at a time" : "Show all paths"));
      wrap.append(bar);
    }
    const grid = el("div", {class: "cols" + (!deep && branches.length > 1 ? " side" : "")});
    branches.forEach((b, i) => { if (!deep || state.all || i === state.tab) grid.append(makeColumn(b, i)); });
    wrap.append(grid);
    markTabs();
  };
  draw();
  return wrap;
}
function choiceBlock(n) {
  const head = el("div", {class: "head"},
    el("span", {class: "kind"}, "Choice · the player picks one"), el("span", {class: "eid"}, n.id), noteButton(n.id, () => head));
  if (n.timer) head.append(el("div", {class: "info"}, "Timed: " + n.timer + " seconds. If time runs out, the last visible option is picked."));
  if (n.loop) head.append(el("div", {class: "info"}, "The player can try options one by one and returns here, until picking the option that moves on."));
  if (n.about.length) head.append(el("div", {class: "info"}, "Decides: " + n.about.join("; ")));
  if (n.affects.length) head.append(el("div", {class: "info"}, "Comes back later in: ", chips(n.affects)));
  if (n.prompt) head.append(el("div", {class: "info"}, "Shown above the buttons:"), lineBox(n.prompt));
  if (edits[n.id]?.note) head.append(noteArea(n.id));
  const body = columns(n.id, n.options, (o, i) => {
    const col = el("div", {class: "col", style: "--c:var(--c" + i % COLORS + ")"},
      el("div", {class: "coltitle"}, "Option " + letter(i)),
      o.cond ? el("div", {class: "cond"}, "Only appears if " + o.cond + ".") : null,
      lineBox(lines[o.id], "Button text"),
      o.leaves ? el("div", {class: "cond"}, "Picking this moves the story on.") : null);
    col.append(...render(o.body));
    if (!o.body.length) col.append(el("div", {class: "empty"}, "No extra lines for this option. The story continues below."));
    return col;
  }, (o, i) => letter(i) + ". " + current(o.id));
  return el("section", {class: "block choice", "data-id": n.id}, head, body, el("div", {class: "join"}, "▼ All options rejoin here"));
}
function ifBlock(n) {
  const head = el("div", {class: "head"},
    el("span", {class: "kind"}, "Branch · the story picks one automatically"), el("span", {class: "eid"}, n.id), noteButton(n.id, () => head));
  for (const d of n.depends) {
    head.append(el("div", {class: "info"}, "Depends on " + d.name + (d.from_.length ? ". Decided at: " : "."), chips(d.from_)));
  }
  if (edits[n.id]?.note) head.append(noteArea(n.id));
  const body = columns(n.id, n.branches, (b, i) => {
    const col = el("div", {class: "col", "data-id": b.id, style: "--c:var(--c" + i % COLORS + ")"},
      el("div", {class: "coltitle"}, b.label, el("span", {class: "eid"}, b.id)));
    col.append(...render(b.body));
    if (!b.body.length) col.append(el("div", {class: "empty"}, "Nothing extra plays."));
    return col;
  }, b => b.label);
  return el("section", {class: "block if", "data-id": n.id}, head, body,
    el("div", {class: "join"}, n.branches.length > 1 ? "▼ Paths rejoin here" : "▼ Everyone continues here"));
}
function render(nodes) {
  return nodes.map(n => {
    if (n.t === "line") return lineBox(n);
    if (n.t === "choice") return choiceBlock(n);
    if (n.t === "if") return ifBlock(n);
    return el("div", {class: "mark"}, "▶ " + n.text + " ",
      n.link ? el("button", {class: "chip", onclick: () => go(n.link)}, "See its text") : null);
  });
}

/* ---------- pages ---------- */
let page = 0;              // chapter index, or "changes"
const main = document.getElementById("main");
function help() {
  const d = el("details", {class: "help"}, el("summary", {}, "How to use this page"), el("ul", {},
    [["Click any line and type. Press Enter or click elsewhere when you are done. Changed lines turn yellow."],
     ["Your work saves automatically in this browser. When you are ready, press “Download my changes” and send that file back."],
     ["To add or remove lines, or change how branches work, press “+ note” and describe it. Please do not try to do it inside a line."],
     [DATA.nameToken + " is replaced by the player's nickname. Keep it as it is. *Asterisks* make a word emphasised in the game."],
     ["Blue boxes are choices the player makes. Beige boxes are branches the game picks based on earlier choices. Click the pill buttons to jump between a choice and its consequences."],
     ["Text drawn inside pictures (such as chapter title pages) is not on this page. Leave a note if you want it changed."]]
      .map(t => el("li", {}, t[0]))));
  d.open = !localStorage_get("mei-help-seen");
  d.addEventListener("toggle", () => { try { localStorage.setItem("mei-help-seen", d.open ? "" : "1"); } catch (e) {} });
  return d;
}
function localStorage_get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function show(p, keepScroll) {
  page = p;
  main.replaceChildren(help());
  if (p === "changes") renderChanges();
  else {
    const c = DATA.chapters[p];
    main.append(el("h2", {}, c.title), ...render(c.nodes));
    main.append(el("div", {class: "pager"},
      p > 0 ? el("button", {onclick: () => show(p - 1)}, "← " + DATA.chapters[p - 1].title) : el("span"),
      p < DATA.chapters.length - 1 ? el("button", {onclick: () => show(p + 1)}, DATA.chapters[p + 1].title + " →") : el("span")));
    main.querySelectorAll("[data-line]").forEach(b => refresh(b.dataset.line));
  }
  drawNav();
  if (!keepScroll) window.scrollTo(0, 0);
}
function renderChanges() {
  const list = el("div", {class: "list"});
  const ids = Object.keys(edits).sort((a, b) => ordered.indexOf(a) - ordered.indexOf(b));
  if (!ids.length) list.append(el("p", {}, "You have not changed anything yet."));
  for (const id of ids) {
    const e = edits[id];
    const item = el("div", {class: "item"}, el("div", {class: "meta"},
      el("span", {class: "who"}, lines[id]?.who || "Choice / branch"), el("span", {class: "eid"}, id),
      where[id] ? el("button", {class: "notebtn", onclick: () => go(id)}, "Go to it →") : "no longer in the script"));
    if (e.text !== undefined) {
      item.append(el("div", {}, el("del", {}, e.orig)), el("div", {}, e.text));
      if (lines[id]) problems(id, e.text).forEach(b => item.append(el("div", {class: "warn"}, b)));
    }
    if (e.note) item.append(el("div", {class: "orig"}, "Note: " + e.note));
    list.append(item);
  }
  main.append(el("h2", {}, "My changes"), list);
}
function drawNav() {
  const nav = document.getElementById("nav"), scroll = nav.scrollTop;
  nav.replaceChildren();
  DATA.chapters.forEach((c, i) => {
    const button = el("button", {class: "ch" + (page === i ? " on" : ""), onclick: () => show(i)}, c.title);
    badge(button, i);
    nav.append(button);
    if (page === i) (function subs(nodes, depth) {
      for (const n of nodes) {
        if (n.t === "choice") {
          const label = n.options.map(o => current(o.id)).join(" / ");
          nav.append(el("button", {class: "sub", style: "padding-left:" + (22 + depth * 10) + "px", title: label, onclick: () => go(n.id)}, "◆ " + label));
          n.options.forEach(o => subs(o.body, depth + 1));
        } else if (n.t === "if") n.branches.forEach(b => subs(b.body, depth));
      }
    })(c.nodes, 0);
  });
  nav.scrollTop = scroll;
}
function updateCounts() {
  document.getElementById("changes").textContent = "My changes (" + Object.keys(edits).length + ")";
  document.querySelectorAll("#nav .ch").forEach((b, i) => badge(b, i));
}
function badge(button, i) {
  const n = Object.keys(edits).filter(id => where[id]?.ch === i).length;
  let mark = button.querySelector(".count");
  if (!n) { mark?.remove(); return; }
  if (!mark) { mark = el("span", {class: "count"}); button.append(mark); }
  mark.textContent = n;
}
function go(id) {
  const w = where[id];
  if (!w) return;
  for (const [block, i] of w.path) view[block] = {all: false, tab: i, ...(view[block]?.all ? {all: true} : {})};
  show(w.ch, true);
  const target = main.querySelector('[data-id="' + id + '"]');
  if (target) {
    target.scrollIntoView({block: "center"});
    target.classList.add("flash");
  }
}

/* ---------- toolbar ---------- */
document.getElementById("changes").onclick = () => show("changes");
document.getElementById("zh").onchange = e => document.body.classList.toggle("show-zh", e.target.checked);
let lastQuery = "", hit = -1;
document.getElementById("search").addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = ev.target.value.trim().toLowerCase();
  if (!q) return;
  const found = ordered.filter(id => (current(id) + " " + lines[id].zh + " " + id).toLowerCase().includes(q));
  if (!found.length) { say("Nothing found for “" + ev.target.value + "”."); return; }
  hit = q === lastQuery ? (hit + 1) % found.length : 0;
  lastQuery = q;
  say("Result " + (hit + 1) + " of " + found.length + ". Press Enter for the next one.");
  go(found[hit]);
});
/* 在线版（claude.ai 页面）里网页不能直接下载，要走 downloads 能力；不可用时改为复制文本 */
let saver = null;
if (window.claude?.use) claude.use("downloads").then(d => { saver = d; }).catch(() => {});
function offerCopy(json) {
  page = "copy";
  const area = el("textarea", {class: "note", rows: "16", readonly: "readonly", "aria-label": "Your changes"});
  area.value = json;
  main.replaceChildren(el("div", {class: "list"},
    el("h2", {}, "Copy your changes"),
    el("p", {}, "The file could not be saved here. Press Copy, paste everything into a message or a document, and send it to the author."),
    el("button", {class: "primary", onclick: () => {
      area.select();
      (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject())
        .then(() => say("Copied."), () => say("Select all the text in the box and copy it."));
    }}, "Copy"), area));
  drawNav();
}
document.getElementById("save").onclick = async () => {
  persist();
  const list = Object.entries(edits).map(([id, e]) => ({id, ...e}));
  if (!list.length) { say("There is nothing to download yet."); return; }
  const bad = list.filter(e => e.text !== undefined && lines[e.id] && problems(e.id, e.text).length).map(e => e.id);
  const json = JSON.stringify({format: "mei-script-edits", version: 1, edits: list}, null, 1);
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const name = "mei-script-changes-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".json";
  if (!window.claude?.use) {
    const a = el("a", {href: URL.createObjectURL(new Blob([json], {type: "application/json"})), download: name});
    document.body.append(a); a.click(); a.remove();
  } else {
    if (!saver) { offerCopy(json); return; }
    try { await saver.save({filename: name, data: json}); }
    catch (e) {
      if (e?.code === "declined") say("Nothing was saved. Press the button again when you are ready.");
      else if (e?.code === "rate_limited") say("Please wait a moment, then try again.");
      else offerCopy(json);
      return;
    }
  }
  say(bad.length ? "Downloaded, but please fix the red lines first if you can: " + bad.join(", ")
                 : "Downloaded " + list.length + " change(s). Send that file to the author.");
};
document.getElementById("load").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.format !== "mei-script-edits") throw new Error();
    for (const {id, ...e} of data.edits) edits[id] = e;
    persist(); show("changes");
    say("Loaded " + data.edits.length + " change(s). Lines you had also edited now show the version from the file.");
  } catch (e) { say("That does not look like a changes file."); }
  ev.target.value = "";
};
window.addEventListener("resize", fit);
fit(); persist(); show(0);
</script>
</body>
