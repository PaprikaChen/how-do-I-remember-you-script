0","who":"Narration","cls":"narr","en":"The shutter clicked. “Forget it,” she said, and turned and walked on.","zh":"快门响了。“算了。”她说，转身往前走。"},{"t":"line","id":"A6-302","who":"Narration","cls":"narr","en":"I lowered the camera and thumbed the film advance. The click sounded very loud by the river.","zh":"我放下相机，拇指扳过了片。咔哒一声，在河边显得特别响。"},{"t":"line","id":"A6-304","who":"Narration","cls":"narr","en":"What that frame had caught, I wouldn't know until I was back in the city.","zh":"那一格胶片上留下了什么，要等回到城里才知道。"}]}],"affects":[{"id":"A8-K5","label":"Act 8: If I am taking photos and there is film left"},{"id":"A8-K2","label":"Act 8: If nothing or the hair tie, trust ≥ 4"},{"id":"DV-K2","label":"Back in the city: If I took any photos"},{"id":"EP-K0","label":"Epilogue: If I am taking photos and I took photos"},{"id":"EP-K5","label":"Epilogue: If I am taking photos and I photographed people"},{"id":"EP-K3","label":"Epilogue: If the children's camera, trust ≥ 4, Maizai lame"},{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"},{"id":"EP-K6","label":"Epilogue: If I took photos"}],"about":["which photos you have taken","Mai's trust in you (hidden score)"]},{"t":"line","id":"A6-306","who":"Narration","cls":"narr","en":"As we walked on, she was the bouncing, skipping Mai again, as if she had never said anything at all.","zh":"往前走的路上，她又变回了那个蹦蹦跳跳的小麦，好像刚才什么都没有说过。"},{"t":"line","id":"A6-308","who":"Narration","cls":"narr","en":"But I couldn't shake it. The river beside us was still so clear that I could see every stone on the bottom.","zh":"我却一直没缓过来。脚下的河水还是那么清，清得能看见底下每一颗石头。"},{"t":"line","id":"A6-310","who":"Narration","cls":"narr","en":"We crossed the river on a line of stepping stones. Mai hopped across without even looking at her feet. I could only wobble my way from one stone to the next.","zh":"我们踩着一排石头过河。小麦一跳一跳地过去，看都不看脚下。我只能颤颤巍巍一块一块地挪。"},{"t":"line","id":"A6-320","who":"Narration","cls":"narr","en":"Across the river was a cornfield. The corn grew almost twice my height, its leaves already turning yellow, and blocked out the sun completely.","zh":"河对岸是一片玉米地，这里的玉米长得快有两个我那么高，叶子已经开始发黄，把太阳遮得严严实实的。"},{"t":"line","id":"A6-330","who":"Narration","cls":"narr","en":"Mai's mother was deep in the field, bent over, snapping off ears of corn. When she straightened up, I saw her belly, round and heavy under her shirt.","zh":"小麦的妈妈在玉米地深处，弯着腰掰玉米。她直起身时，我看见了她的肚子，圆圆的，沉沉地坠在衬衫下面。"},{"t":"line","id":"A6-332","who":"Narration","cls":"narr","en":"Her face was burned a deep brown by the sun, with two sunburned patches of red on her cheekbones. There were already fine lines at the corners of her eyes, and the fingers snapping off the corn were thick-knuckled, with dirt worked into the creases.","zh":"她的脸被太阳晒成了深褐色，颧骨上有两块晒伤的红。眼角已经有了细纹，掰玉米的手指关节粗大，指缝里嵌着泥。"},{"t":"line","id":"A6-334","who":"Narration","cls":"narr","en":"It was only when she smiled at us that I realized it: however finely the years and the weather had carved her, she was probably only just past thirty, just a few years older than my cousin back in Beijing.","zh":"她冲我们笑的时候，我才意识到，即使岁月和风霜细细地雕刻了她，她看起来大概也就三十出头，只比我在北京的表姐大几岁。"},{"t":"line","id":"A6-340","who":"Narration","cls":"narr","en":"She pressed one hand to the small of her back.","zh":"她一只手撑着后腰。"},{"t":"line","id":"A6-350","who":"Narration","cls":"narr","en":"“Teacher [teacher_name]'s here,” Mai said, and went off to gather the picked corn into a pile.","zh":"“[teacher_name]老师来了。”小麦说完，就自己去把掰下来的玉米抱到一起。"},{"t":"line","id":"A6-355","who":"Mai's mother","cls":"talk","en":"“This girl takes my phone to school every single day. The old man at the end of the village wanted to buy corn for his pigs and couldn't get through all day.”","zh":"“这女娃，天天揣着我的手机往学校跑。村头大爷要买玉米喂猪，打了一天都打不通。”"},{"t":"line","id":"A6-360","who":"Me","cls":"me","en":"“Where's Mai's father?”","zh":"“小麦的爸爸呢？”"},{"t":"line","id":"A6-370","who":"Narration","cls":"narr","en":"She glanced at the dirt road in the distance.","zh":"她往远处的土路上看了一眼。"},{"t":"line","id":"A6-380","who":"Mai's mother","cls":"talk","en":"“Him? He came home once for New Year. Since he left this time, I haven't been able to get through to him.”","zh":"“他啊。过年回来过一趟，这次走了以后，电话就再没打通过。”"},{"t":"line","id":"A6-390","who":"Narration","cls":"narr","en":"Mai's mother patted her belly.","zh":"小麦的妈妈拍了拍肚子："},{"t":"line","id":"A6-400","who":"Mai's mother","cls":"talk","en":"“This one's coming when the weather turns cool.”","zh":"“这个，等天凉了就生。”"},{"t":"line","id":"A6-430","who":"Narration","cls":"narr","en":"Just then, Mai's little sister and brother burst out of the corn. Shrieking and shoving, they ran for the grass nearby and rolled into it, where it stood half as tall as a grown-up.","zh":"此时，小麦的二妹和四弟突然从一旁的玉米丛里钻了出来。他们互相尖叫打闹着冲向一旁的草地，然后翻身滚进了半人高的草丛里。"},{"t":"line","id":"A6-440","who":"Narration","cls":"narr","en":"The girl climbed up and poked her head out to look at us. Seeing that nothing was happening, she rolled over and settled back into the grass.","zh":"二妹从草丛里爬起来，伸出脑袋看了看我们，见没什么事发生，又安心地翻了个身躺进草丛里了。"},{"t":"line","id":"A6-450","who":"Narration","cls":"narr","en":"I thought of last year's kernels covering the yard at Mai's house and couldn't imagine how many days and nights of dull labor they meant. This woman, carrying a child, had delivered countless cornstalks with her own two hands, and her own babies too, one autumn after another.","zh":"我想起了小麦家的院子里那一地去年的玉米粒，无法想象那是多少个日夜的枯燥劳作。这个怀着孩子的女人就这样用双手为无数根玉米秆——以及她自己——接生，度过一个又一个秋。"},{"t":"line","id":"A6-460","who":"Narration","cls":"narr","en":"All this corn was probably the mountain's children. When the mountain slept, they pulled the meadows over themselves like blankets. When the mountain raged, the roaring rain swept them back into its belly.","zh":"这些玉米大概都是大山的孩子。大山沉睡的时候，它们就扯过草地当被子；大山震怒的时候，它们就被咆哮的雨水又卷回了大山的肚子里。"},{"t":"line","id":"A6-470","who":"Narration","cls":"narr","en":"Spring, summer, autumn, winter. To bring forth grain takes only a season. When harvest comes, some kernels have grown well, and some have not.","zh":"春夏秋冬，孕育麦子，只需要季度之长。等到收获的季节时，有的麦粒长得很好，有的麦粒却没有。"},{"t":"line","id":"A6-480","who":"Narration","cls":"narr","en":"The new corn was already ripe.","zh":"新的玉米已经成熟了。"},{"t":"line","id":"A6-490","who":"Narration","cls":"narr","en":"I couldn't tell whether this coming and going of life in the mountains was some kind of Zen, or some kind of numbness.","zh":"我分不清，这座大山里生命的来去更迭，是一种禅意，还是一种麻木？"}]},{"key":"F2","title":"Fragment 2","nodes":[{"t":"line","id":"F2-010","who":"Narration","cls":"narr","en":"The days that were left went by faster and faster.","zh":"剩下的日子，一天比一天过得快。"},{"t":"line","id":"F2-101","who":"Narration","cls":"narr","en":"One day during break, I asked the children where they planned to go for junior secondary school after finishing primary school.","zh":"有一天课间，我问起班里的孩子，小学毕业以后，准备去哪里读初中。"},{"t":"line","id":"F2-111","who":"Narration","cls":"narr","en":"There was no junior secondary school in the village. Only one or two said they might try the school in town.","zh":"村里没有初中。只有一两个孩子说，去镇上的学校看看。"},{"t":"line","id":"F2-131","who":"Narration","cls":"narr","en":"I almost called Mai's name.","zh":"我差一点就叫到了小麦的名字。"},{"t":"line","id":"F2-141","who":"Narration","cls":"narr","en":"I was afraid she would say she was going home to help her mother work the fields. So I didn't ask her.","zh":"我怕她说，要回家帮妈妈干农活。所以我不敢问她。"},{"t":"line","id":"F2-012","who":"Narration","cls":"narr","en":"During break on another day, I noticed someone sitting in the seat next to Mai.","zh":"另一天课间，我发现小麦旁边的座位上有一个女孩。"},{"t":"if","id":"F2-K1","vars":["braid_upset"],"branches":[{"id":"F2-K1a","label":"If the two girls got their turn","body":[{"t":"line","id":"F2-014","who":"Narration","cls":"narr","en":"It was one of the girls who had waited for a braid that morning. The two of them leaned close over the phone with its cracked screen, twittering like little birds as they looked through the photos.","zh":"是那天在旁边等着编辫子的女生。两个人头凑在一起叽叽喳喳的，在看那部屏幕裂了的手机里的照片。"}]},{"id":"F2-K1b","label":"If the two girls left upset","body":[{"t":"line","id":"F2-015","who":"Narration","cls":"narr","en":"It was one of the girls who never got her braid that morning. The two of them had their heads together, chattering away over that cracked phone.","zh":"是那天没等到我给她编辫子的女生。两个人头凑在一起叽叽喳喳的，在看那部屏幕裂了的手机。"}]}],"depends":[{"name":"which students left upset during the braid","from_":[{"id":"UI-429","label":"Menus and mini-game text: the braiding mini-game"}]}]},{"t":"line","id":"F2-016","who":"Narration","cls":"narr","en":"I didn't know which day they had become friends. I watched from beside the teacher's desk for a while and didn't go over.","zh":"我不知道她们是从哪一天开始成为朋友的。我站在讲台边看了一会儿，没有过去打扰。"},{"t":"line","id":"F2-020","who":"Narration","cls":"narr","en":"One evening, we went to the village shop for ice pops. The men on the little wooden chairs out front were talking.","zh":"有天傍晚，我们去小卖部买冰棍。门口小木椅上的大叔们正在说话。"},{"t":"line","id":"F2-030","who":"Villager","cls":"talk","en":"“...Killed another chicken. That's the third one now. Whose dog is that, anyway? Nobody ties it up.”","zh":"“……又咬死一只鸡，这都第三只了。哪家的狗嘛，也不拴。”"},{"t":"line","id":"F2-040","who":"Narration","cls":"narr","en":"I couldn’t make out whose dog it was. But that was nothing unusual in the countryside. The ice pop was melting fast; I gave it a lick, then followed the others back.","zh":"我没听清是谁家的狗。不过这在乡村里并不是什么新鲜事。冰棍化得很快，我舔了一口，就跟着大家往回走了。"}]},{"key":"A7","title":"Act 7 · The rainy night","nodes":[{"t":"line","id":"A7-010","who":"Narration","cls":"narr","en":"That night, a storm rolled in from over the mountains.","zh":"那天夜里，暴雨从山那边压了过来。"},{"t":"line","id":"A7-020","who":"Narration","cls":"narr","en":"Rain hammered on the classroom's tin roof. For all that rain, the room was still stiflingly hot.","zh":"雨点砸在教室的铁皮屋顶上。雨下得那么大，屋里却还是闷得透不过气。"},{"t":"line","id":"A7-030","who":"Narration","cls":"narr","en":"Someone was knocking on the window.","zh":"有人在敲窗户。"},{"t":"line","id":"A7-040","who":"Narration","cls":"narr","en":"It was Mai. Soaked through, mud caked up to her knees, her braid plastered to her neck. Lightning flashed, and I saw a hair tie with a little yellow duck wound around the end of her braid.","zh":"是小麦。浑身湿透，泥一直糊到膝盖，辫子贴在脖子上。一道闪电亮起，我看见辫尾绑着一根小黄鸭发绳。"},{"t":"line","id":"A7-042","who":"Narration","cls":"narr","en":"It was the one I'd slipped off my wrist for her the day I braided her hair. It had faded almost white.","zh":"是编辫子那天，我从手腕上褪下来给她的那根。已经旧得发白了。"},{"t":"line","id":"A7-044","who":"Narration","cls":"narr","en":"Her hand was pressed against the glass.","zh":"她的手按在玻璃上。"},{"t":"line","id":"A7-046","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], please. Please help me.”","zh":"“[teacher_name]老师，求求你帮帮我。”"},{"t":"line","id":"A7-050","who":"Mai","cls":"talk","en":"“Maizai's gone. She waits for me on the hilltop every night, but not tonight.”","zh":"“麦仔不见了。它每天晚上都在山顶等我，今天没有。”"},{"t":"line","id":"A7-070","who":"Mai","cls":"talk","en":"“My mom says dogs come back on their own. She told me to hurry up and go to bed.”","zh":"“我妈说狗会自己回来，让我快去睡觉。”"},{"t":"line","id":"A7-090","who":"The Passerby · inner voice","cls":"inner","en":"It's pouring out there, and the mountain paths are all mud. Even her own mother said to wait. Shouldn't I just bring her in out of the rain first?","zh":"外面雨很大，山路全是泥。连她妈妈都说再等等，先让她进来躲躲雨？"},{"t":"choice","id":"A7-C1","timer":null,"loop":false,"prompt":null,"writes":["trust"],"options":[{"id":"A7-C1A","en":"“Let's look for it when the rain stops. It's too dangerous right now.”","zh":"“等雨停了再去找吧，现在太危险了。”","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-100","who":"Narration","cls":"narr","en":"Her face changed.","zh":"她的脸色变了。"},{"t":"line","id":"A7-110","who":"Mai","cls":"talk","en":"“Mom said that the day my third sister died, too.” Her voice was very quiet. “We'll go when the rain stops.”","zh":"“三妹儿没的那天妈妈也是这么说的。”她的声音很轻，“等雨停了再去。”"},{"t":"line","id":"A7-120","who":"Narration","cls":"narr","en":"Before I could say anything, she had turned and run back out into the rain. I grabbed a flashlight and went after her.","zh":"我还没来得及开口，她已经转身冲回了雨里。我抓起手电筒追了出去。"}]},{"id":"A7-C1B","en":"“We'll go right now.”","zh":"“我们现在就去。”","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-130","who":"Narration","cls":"narr","en":"The other teachers were already putting on their shoes. Someone handed out flashlights. Mai clutched my sleeve and walked out into the rain with us.","zh":"其他老师已经在穿鞋了。有人把手电筒分给大家。小麦攥着我的袖子，跟我们一起走进雨里。"}]}],"affects":[{"id":"A8-K2","label":"Act 8: If nothing or the hair tie, trust ≥ 4"},{"id":"EP-K3","label":"Epilogue: If the children's camera, trust ≥ 4, Maizai lame"}],"about":["Mai's trust in you (hidden score)"]},{"t":"line","id":"A7-140","who":"Narration","cls":"narr","en":"We split up and searched the village, calling her name over and over. The rain swallowed our voices.","zh":"我们分头在村子里找，一遍遍喊它的名字。雨声把我们的声音吞掉了。"},{"t":"line","id":"A7-150","who":"Narration","cls":"narr","en":"Near the edge of the village, I heard a man shouting behind one of the houses. Then a dog yelped, sharp and short.","zh":"快到村边时，我听见一户人家后面有男人在吼。然后是一声狗叫，又尖又短。"},{"t":"line","id":"A7-160","who":"Narration","cls":"narr","en":"I came around the corner of a chicken coop.","zh":"我拐过鸡舍的墙角。"},{"t":"line","id":"A7-170","who":"Narration","cls":"narr","en":"Feathers were scattered in the mud. A chicken lay there, not moving. One man was gripping a stick; another held up a flashlight. On the ground between them, Maizai lay on her side, her belly heaving fast.","zh":"泥里散着羽毛。一只鸡躺在那里，不动了。一个男人手里握着一根棍子，另一个举着手电筒。他们中间的地上，麦仔侧躺着，肚子起伏得很快。"},{"t":"line","id":"A7-180","who":"Narration","cls":"narr","en":"The man with the stick was one of the men who sat on the little wooden chairs outside the village shop, fanning themselves.","zh":"握棍子的人，是小卖部门口坐小木椅、扇蒲扇的大叔之一。"},{"t":"if","id":"A7-K1","vars":["greeted_villagers"],"branches":[{"id":"A7-K1a","label":"If I greeted the villagers in Act Two","body":[{"t":"line","id":"A7-185","who":"Narration","cls":"narr","en":"I recognized him too. He was the man who had set the mosquito coil on our windowsill that first night.","zh":"我也认出了他。是那天夜里，把蚊香搁在窗台上的大叔。"},{"t":"line","id":"A7-190","who":"Narration","cls":"narr","en":"He recognized me and froze for a second.","zh":"他认出了我，愣了一下。"},{"t":"line","id":"A7-200","who":"Villager","cls":"talk","en":"“Teacher, stay out of this.”","zh":"“老师，这事你别管。”"},{"t":"line","id":"A7-210","who":"Narration","cls":"narr","en":"His voice wasn't fierce. If anything, he sounded tired.","zh":"他的声音不凶，倒像是很累。"}]},{"id":"A7-K1b","label":"If I did not greet the villagers in Act Two","body":[{"t":"line","id":"A7-215","who":"Narration","cls":"narr","en":"I didn't know him. Maybe he was the shadow outside our window that first night. I couldn't tell.","zh":"我不认识他。也许那天夜里窗外的人影就是他，我不知道。"},{"t":"line","id":"A7-220","who":"Narration","cls":"narr","en":"He squinted into the beam of my flashlight.","zh":"他眯着眼看了看我的手电筒光。"},{"t":"line","id":"A7-230","who":"Villager","cls":"talk","en":"“From the school? Mind your own business.”","zh":"“学校的？别多管闲事。”"}]}],"depends":[{"name":"whether you greeted the villagers","from_":[{"id":"A2-C2A","label":"Act 2: “Of course. They look friendly, and they seem curious about…"},{"id":"A2-C2B","label":"Act 2: “Better not. We'll mostly be teaching at the school and may…"}]}]},{"t":"line","id":"A7-270","who":"Narration","cls":"narr","en":"The hand holding the stick was shaking. I couldn't tell if it was from the cold or something else.","zh":"他握着棍子的手在抖。不知道是因为冷，还是因为别的。"},{"t":"line","id":"A7-280","who":"Narration","cls":"narr","en":"The other teachers were still behind me. It would be a few minutes before they caught up.","zh":"其他老师还在后面，要几分钟才能赶到。"},{"t":"line","id":"A7-310","who":"The Teacher · inner voice","cls":"inner","en":"If I don't stop him now, she's going to die.","zh":"再不拦住他，它会死的。"},{"t":"line","id":"A7-320","who":"The Passerby · inner voice","cls":"inner","en":"His chickens, their village, their rules. I'm leaving in a few days. Don't go looking for trouble now.","zh":"这是他的鸡，他们的村子，他们的规矩。我过几天就走了，别在这时候惹上麻烦。"},{"t":"if","id":"A7-K2","vars":["camera"],"branches":[{"id":"A7-K2a","label":"If I am taking photos","body":[{"t":"line","id":"A7-330","who":"The Lens · inner voice","cls":"inner","en":"Are you sure you want to miss this shot?","zh":"你确定你真的要错过这段画面吗？"}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]},{"t":"choice","id":"A7-C2","timer":"9","loop":false,"prompt":null,"writes":["action","called_police"],"options":[{"id":"A7-C2P","en":"Call the police.","zh":"打电话报警。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-332","who":"Narration","cls":"narr","en":"I pulled my rain-soaked phone out of my pocket and shook it hard. One bar of signal, flickering in and out.","zh":"我掏出口袋里泡了雨水的手机，使劲甩了甩，屏幕上只有一格信号，时有时无。"},{"t":"line","id":"A7-334","who":"Narration","cls":"narr","en":"I thought of the road we'd come in on: several ridges from the nearest town, and no police station in the village at all. Even if I got through, who would cross the mountains in a storm like this over a quarrel about a dog?","zh":"我想起来时的路：从最近的镇上过来要翻好几个山头，村里根本没有派出所。这么大的雨，就算打通了，谁会为了一条狗的纠纷冒着暴雨翻山越岭过来？"},{"t":"line","id":"A7-336","who":"Narration","cls":"narr","en":"In the few seconds I spent looking at my phone, the stick came down. Maizai yelped, sharp and short.","zh":"就在我低头看手机的这几秒里，棍子落了下去。麦仔叫了一声，又尖又短。"}]},{"id":"A7-C2A","en":"Wait for the other teachers, then step in together.","zh":"等待其他老师汇合，等大家一起上前。","cond":null,"leaves":false,"body":[]},{"id":"A7-C2B","en":"There's no time. Rush in and stop him now.","zh":"等不了了，立刻冲上前拦住他。","cond":null,"leaves":false,"body":[]},{"id":"A7-C2C","en":"Stay where I am. Don't interfere.","zh":"站在原地，不插手。","cond":null,"leaves":false,"body":[]}],"affects":[{"id":"A7-K3","label":"Act 7: If the call failed"},{"id":"A7-K4","label":"Act 7: If I waited for the others"},{"id":"A7-CW1C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-CW2C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-CR1C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-CR2C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-K5","label":"Act 7: If I saved Maizai"},{"id":"A7-K8","label":"Act 7: If I saved Maizai and the village is still friend…"}],"about":["what you did on the rainy night","whether you called the police"]},{"t":"if","id":"A7-K3","vars":["called_police","action"],"branches":[{"id":"A7-K3a","label":"If the call failed","body":[{"t":"choice","id":"A7-C4","timer":"9","loop":false,"prompt":null,"writes":["action"],"options":[{"id":"A7-C4A","en":"Wait for the other teachers, then step in together.","zh":"等待其他老师汇合，等大家一起上前。","cond":null,"leaves":false,"body":[]},{"id":"A7-C4B","en":"There's no time. Rush in and stop him now.","zh":"等不了了，立刻冲上前拦住他。","cond":null,"leaves":false,"body":[]},{"id":"A7-C4C","en":"Stay where I am. Don't interfere.","zh":"站在原地，不插手。","cond":null,"leaves":false,"body":[]}],"affects":[{"id":"A7-K4","label":"Act 7: If I waited for the others"},{"id":"A7-K5","label":"Act 7: If I saved Maizai"},{"id":"A7-K8","label":"Act 7: If I saved Maizai and the village is still friend…"}],"about":["what you did on the rainy night"]}]},{"id":"A7-K3b","label":"Otherwise","body":[]}],"depends":[{"name":"whether you called the police","from_":[{"id":"A7-C2P","label":"Act 7: “Call the police.”"}]},{"name":"what you did on the rainy night","from_":[{"id":"A7-C2A","label":"Act 7: “Wait for the other teachers, then step in together.”"},{"id":"A7-C2B","label":"Act 7: “There's no time. Rush in and stop him now.”"},{"id":"A7-C2C","label":"Act 7: “Stay where I am. Don't interfere.”"}]}]},{"t":"if","id":"A7-K4","vars":["action"],"branches":[{"id":"A7-K4a","label":"If I waited for the others","body":[{"t":"line","id":"A7-340","who":"Narration","cls":"narr","en":"I shouted back the way I'd come, again and again.","zh":"我朝来的方向大喊，一遍又一遍。"},{"t":"line","id":"A7-350","who":"Narration","cls":"narr","en":"During those few minutes of waiting, I didn't look at what was happening. But I heard it.","zh":"等待的那几分钟里，我没有去看发生了什么。但我听见了。"},{"t":"line","id":"A7-W010","who":"Narration","cls":"narr","en":"Flashlight beams came swinging through the rain one after another. The other teachers had arrived, and together we stood between him and Maizai.","zh":"手电筒的光一束束从雨里晃过来。其他老师赶到了，我们一起站到了他和麦仔中间。"},{"t":"line","id":"A7-W020","who":"Narration","cls":"narr","en":"He looked at the row of us. He lowered the stick, but he stood up straighter.","zh":"他看了看我们这一排人，手里的棍子放低了，人却站得更直了。"},{"t":"line","id":"A7-W030","who":"Villager","cls":"talk","en":"“That's the third one.” He wiped the rain off his face. “I went to their house twice. Told them to tie it up. Did they?”","zh":"“第三只了。”他抹了一把脸上的雨，“去她家说了两回，说拴，拴了吗？”"},{"t":"choice","id":"A7-CW1","timer":"9","loop":false,"prompt":null,"writes":["attitude","bluffed","listened","paid"],"options":[{"id":"A7-CW1A","en":"Offer to pay for the chicken.","zh":"赔他鸡钱。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-W110","who":"Narration","cls":"narr","en":"One of the teachers took out her wallet. Between us we scraped together a crumpled wad of cash and held it out.","zh":"有个老师掏出钱包，我们几个凑了凑，凑出一沓皱巴巴的钱，递了过去。"},{"t":"line","id":"A7-W120","who":"Narration","cls":"narr","en":"He didn't take it. He looked at the money, then at us.","zh":"他没有接，看看那沓钱，又看看我们。"},{"t":"line","id":"A7-W130","who":"Villager","cls":"talk","en":"“What's this supposed to mean? You think money makes this go away?”","zh":"“你们这是啥意思？拿钱来打发我？”"}]},{"id":"A7-CW1B","en":"Hear him out first.","zh":"先听他说。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-W140","who":"Me","cls":"me","en":"“Sir, what do you want to do?”","zh":"“叔叔，您想怎么办？”"},{"t":"if","id":"A7-KW1","vars":["greeted_villagers"],"branches":[{"id":"A7-KW1a","label":"If I greeted the villagers in Act Two","body":[{"t":"line","id":"A7-W150","who":"Narration","cls":"narr","en":"He paused, as if he hadn't expected anyone to ask.","zh":"他愣了一下，好像没想到会有人问他这个。"},{"t":"line","id":"A7-W160","who":"Villager","cls":"talk","en":"“Those eggs were for my grandson. His parents are off working in the city. We don't get meat at home even once a month.”","zh":"“那几个蛋是留给我孙子的。他爸妈在外面打工，屋头一个月吃不上一回肉。”"},{"t":"line","id":"A7-W170","who":"Villager","cls":"talk","en":"“Once a dog's killed a chicken and tasted blood, it doesn't stop. I'm not out to make trouble for anybody.”","zh":"“狗咬过鸡，尝过血，改不了的。我不是要跟哪个过不去。”"}]},{"id":"A7-KW1b","label":"If I did not greet the villagers in Act Two","body":[{"t":"line","id":"A7-W180","who":"Villager","cls":"talk","en":"“What do I want? Like you could do anything about it?” He turned his face away. “What's the use telling you people any of this.”","zh":"“我想咋办？我想咋办你们管得了？”他别过脸，“跟你们说这些有啥用。”"}]}],"depends":[{"name":"whether you greeted the villagers","from_":[{"id":"A2-C2A","label":"Act 2: “Of course. They look friendly, and they seem curious about…"},{"id":"A2-C2B","label":"Act 2: “Better not. We'll mostly be teaching at the school and may…"}]}]}]},{"id":"A7-CW1C","en":"Say I've already called the police.","zh":"说我已经报警了。","cond":"you tried calling the police","leaves":false,"body":[{"t":"line","id":"A7-W190","who":"Me","cls":"me","en":"“I've already called the police.”","zh":"“我已经报警了。”"},{"t":"line","id":"A7-W192","who":"Narration","cls":"narr","en":"Behind me, the other teachers froze and glanced at one another. Someone whispered, “When did you call?”","zh":"身后的老师们愣住了，互相看了一眼。有人小声问：“你啥时候打的？”"},{"t":"line","id":"A7-W194","who":"Narration","cls":"narr","en":"He looked at me, then at them, and understood at once.","zh":"他看看我，又看看她们，一下就明白了。"},{"t":"line","id":"A7-W196","who":"Villager","cls":"talk","en":"“The police?” He gave a cold laugh. “You city people, that's all you know how to do.”","zh":"“报警？”他冷笑了一声，“你们城里来的，就会这一套。”"}]},{"id":"A7-CW1D","en":"Say nothing.","zh":"不说话。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-W230","who":"Villager","cls":"talk","en":"“Nothing to say?”","zh":"“不说话？”"}]}],"affects":[{"id":"A7-CW2A","label":"Act 7: option “Offer to pay for the chicken.”"},{"id":"A7-KW2","label":"Act 7: If I heard him out"},{"id":"A7-CW2B","label":"Act 7: option “Hear him out first.”"},{"id":"A7-CW2C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-KW4","label":"Act 7: If I heard him out"},{"id":"A7-KW9","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-CR2A","label":"Act 7: option “Offer to pay for the chicken.”"},{"id":"A7-KR2","label":"Act 7: If I heard him out"},{"id":"A7-CR2B","label":"Act 7: option “Hear him out first.”"},{"id":"A7-CR2C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-KR4","label":"Act 7: If I heard him out"},{"id":"A7-KR9","label":"Act 7: If his attitude ≥ 1"}],"about":["the man's attitude (hidden score)","whether you told him you had called the police","whether you heard him out","whether you offered to pay"]},{"t":"line","id":"A7-W240","who":"Villager","cls":"talk","en":"“You teachers will all be gone in a few days. When this dog comes back tomorrow, which of you will be here?”","zh":"“你们这些老师，过几天就全都走了。这狗明天再来，你们哪个在？”"},{"t":"line","id":"A7-W250","who":"Narration","cls":"narr","en":"No one spoke. The rain was loud.","zh":"没有人说话。雨声很大。"},{"t":"choice","id":"A7-CW2","timer":"9","loop":false,"prompt":null,"writes":["attitude","bluffed","listened","paid","told_secret"],"options":[{"id":"A7-CW2A","en":"Offer to pay for the chicken.","zh":"赔他鸡钱。","cond":"you have not offered to pay yet","leaves":false,"body":[{"t":"if","id":"A7-KW2","vars":["listened"],"branches":[{"id":"A7-KW2a","label":"If I heard him out","body":[{"t":"line","id":"A7-W310","who":"Narration","cls":"narr","en":"We held out the money we'd pooled. This time he looked at it for a long while, then took it.","zh":"我们把凑好的钱递过去。这一次，他看了很久，接了。"},{"t":"line","id":"A7-W320","who":"Villager","cls":"talk","en":"“It's not about the money.” He stuffed it in his pocket. “Keep that dog tied up.”","zh":"“钱不是这个事。”他把钱揣进兜里，“把狗拴好。”"}]},{"id":"A7-KW2b","label":"If I did not hear him out","body":[{"t":"line","id":"A7-W330","who":"Narration","cls":"narr","en":"One of the teachers took out her wallet. Between us we scraped together a crumpled wad of cash and held it out.","zh":"有个老师掏出钱包，我们几个凑了凑，凑出一沓皱巴巴的钱，递了过去。"},{"t":"line","id":"A7-W332","who":"Narration","cls":"narr","en":"He didn't take it. He looked at the money, then at us.","zh":"他没有接，看看那沓钱，又看看我们。"},{"t":"line","id":"A7-W334","who":"Villager","cls":"talk","en":"“What's this supposed to mean? You think money makes this go away?”","zh":"“你们这是啥意思？拿钱来打发我？”"}]}],"depends":[{"name":"whether you heard him out","from_":[{"id":"A7-CW1B","label":"Act 7: “Hear him out first.”"}]}]}]},{"id":"A7-CW2B","en":"Hear him out first.","zh":"先听他说。","cond":"you have not heard him out yet","leaves":false,"body":[{"t":"line","id":"A7-W340","who":"Me","cls":"me","en":"“Sir, what do you want to do?”","zh":"“叔叔，您想怎么办？”"},{"t":"if","id":"A7-KW3","vars":["greeted_villagers"],"branches":[{"id":"A7-KW3a","label":"If I greeted the villagers in Act Two","body":[{"t":"line","id":"A7-W350","who":"Narration","cls":"narr","en":"He paused, as if he hadn't expected anyone to ask.","zh":"他愣了一下，好像没想到会有人问他这个。"},{"t":"line","id":"A7-W360","who":"Villager","cls":"talk","en":"“Those eggs were for my grandson. His parents are off working in the city. We don't get meat at home even once a month.”","zh":"“那几个蛋是留给我孙子的。他爸妈在外面打工，屋头一个月吃不上一回肉。”"},{"t":"line","id":"A7-W370","who":"Villager","cls":"talk","en":"“Once a dog's killed a chicken and tasted blood, it doesn't stop. I'm not out to make trouble for anybody.”","zh":"“狗咬过鸡，尝过血，改不了的。我不是要跟哪个过不去。”"}]},{"id":"A7-KW3b","label":"If I did not greet the villagers in Act Two","body":[{"t":"line","id":"A7-W380","who":"Villager","cls":"talk","en":"“What do I want? Like you could do anything about it?” He turned his face away. “What's the use telling you people any of this.”","zh":"“我想咋办？我想咋办你们管得了？”他别过脸，“跟你们说这些有啥用。”"}]}],"depends":[{"name":"whether you greeted the villagers","from_":[{"id":"A2-C2A","label":"Act 2: “Of course. They look friendly, and they seem curious about…"},{"id":"A2-C2B","label":"Act 2: “Better not. We'll mostly be teaching at the school and may…"}]}]}]},{"id":"A7-CW2C","en":"Say I've already called the police.","zh":"说我已经报警了。","cond":"you tried calling the police and have not told him so yet","leaves":false,"body":[{"t":"line","id":"A7-W390","who":"Me","cls":"me","en":"“I've already called the police.”","zh":"“我已经报警了。”"},{"t":"line","id":"A7-W392","who":"Narration","cls":"narr","en":"Behind me, the other teachers froze and glanced at one another. Someone whispered, “When did you call?”","zh":"身后的老师们愣住了，互相看了一眼。有人小声问：“你啥时候打的？”"},{"t":"line","id":"A7-W394","who":"Narration","cls":"narr","en":"He looked at me, then at them, and understood at once.","zh":"他看看我，又看看她们，一下就明白了。"},{"t":"line","id":"A7-W396","who":"Villager","cls":"talk","en":"“The police?” He gave a cold laugh. “You city people, that's all you know how to do.”","zh":"“报警？”他冷笑了一声，“你们城里来的，就会这一套。”"}]},{"id":"A7-CW2D","en":"Promise her family will keep the dog tied up.","zh":"承诺会让她家把狗拴好。","cond":null,"leaves":false,"body":[{"t":"if","id":"A7-KW4","vars":["listened"],"branches":[{"id":"A7-KW4a","label":"If I heard him out","body":[{"t":"line","id":"A7-W430","who":"Me","cls":"me","en":"“We'll go to her house tomorrow, talk to her mother, and help tie the dog up. Until we leave, we'll check on her every day.”","zh":"“我们明天就去她家，跟她妈妈说，帮着把狗拴好。走之前，我们每天都会去看一眼。”"},{"t":"line","id":"A7-W440","who":"Narration","cls":"narr","en":"He stared at me for a moment.","zh":"他盯着我看了一会儿。"},{"t":"line","id":"A7-W450","who":"Villager","cls":"talk","en":"“You said it.”","zh":"“你们说的。”"}]},{"id":"A7-KW4b","label":"If I did not hear him out","body":[{"t":"line","id":"A7-W460","who":"Me","cls":"me","en":"“We'll talk to her family.”","zh":"“我们会去跟她家说的。”"},{"t":"line","id":"A7-W470","who":"Villager","cls":"talk","en":"“You? And what good will that do? Last year's teachers said they'd build the village a basketball hoop, too.”","zh":"“你们？说了又咋样。去年那拨老师也说要给村里修个篮球架。”"}]}],"depends":[{"name":"whether you heard him out","from_":[{"id":"A7-CW1B","label":"Act 7: “Hear him out first.”"},{"id":"A7-CW2B","label":"Act 7: “Hear him out first.”"}]}]}]},{"id":"A7-CW2E","en":"Tell him about Mai's little sister.","zh":"讲小麦三妹的事。","cond":"Mai told you about her little sister","leaves":false,"body":[{"t":"line","id":"A7-W480","who":"Me","cls":"me","en":"“Mai's little sister... she drowned in that river. This dog is hers...”","zh":"“小麦的三妹……就是在那条河里没的。这条狗是她的……”"},{"t":"line","id":"A7-W490","who":"Narration","cls":"narr","en":"Halfway through, I felt the teachers beside me turn to look at me. They hadn't known.","zh":"我说到一半，感觉到身边几个老师都转过头来看我。她们不知道这件事。"},{"t":"line","id":"A7-W500","who":"Narration","cls":"narr","en":"He was quiet for a moment.","zh":"大叔沉默了一会儿。"},{"t":"line","id":"A7-W510","who":"Villager","cls":"talk","en":"“Everyone in the village knows what happened to that family.”","zh":"“村里哪个不晓得她家的事。”"},{"t":"line","id":"A7-W520","who":"Narration","cls":"narr","en":"His voice dropped, but he didn't lower the stick.","zh":"他的声音低了下去，可手里的棍子没有放下。"}]},{"id":"A7-CW2F","en":"Say nothing, and don't move.","zh":"不说话，站着不走。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-W530","who":"Narration","cls":"narr","en":"None of us moved. We stood in a row in the rain, our flashlights on the mud and feathers.","zh":"我们谁都没有动。一排人站在雨里，手电筒的光照着地上的泥和羽毛。"},{"t":"line","id":"A7-W540","who":"Narration","cls":"narr","en":"After a long standoff, he was the first to look away.","zh":"僵了很久，他先移开了目光。"}]}],"affects":[{"id":"A7-KW9","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-CR2A","label":"Act 7: option “Offer to pay for the chicken.”"},{"id":"A7-KR2","label":"Act 7: If I heard him out"},{"id":"A7-CR2B","label":"Act 7: option “Hear him out first.”"},{"id":"A7-CR2C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-KR4","label":"Act 7: If I heard him out"},{"id":"A7-KR9","label":"Act 7: If his attitude ≥ 1"},{"id":"A8-K0","label":"Act 8: If I told her sister's story in front of the teac…"}],"about":["the man's attitude (hidden score)","whether you told him you had called the police","whether you heard him out","whether you offered to pay","whether you told her sister's story"]},{"t":"if","id":"A7-KW9","vars":["attitude"],"branches":[{"id":"A7-KW9a","label":"If his attitude ≥ 1","body":[{"t":"line","id":"A7-W610","who":"Narration","cls":"narr","en":"He leaned the stick against the wall of the coop.","zh":"他把棍子靠在鸡舍墙上。"},{"t":"line","id":"A7-W620","who":"Villager","cls":"talk","en":"“I'll let it go this time.”","zh":"“这回就算了。”"}]},{"id":"A7-KW9b","label":"If his attitude ≤ 0","body":[{"t":"line","id":"A7-W630","who":"Narration","cls":"narr","en":"He threw the stick down, turned, and left without a word.","zh":"他把棍子扔在地上，转身走了，一句话也没留下。"}]}],"depends":[{"name":"the man's attitude (hidden score)","from_":[{"id":"A7-KW1a","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-CW1C","label":"Act 7: “Say I've already called the police.”"},{"id":"A7-KW2a","label":"Act 7: If I heard him out"},{"id":"A7-KW3a","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-CW2C","label":"Act 7: “Say I've already called the police.”"},{"id":"A7-KW4a","label":"Act 7: If I heard him out"}]}]}]},{"id":"A7-K4b","label":"If I rushed in","body":[{"t":"line","id":"A7-400","who":"Narration","cls":"narr","en":"I rushed forward and put myself between him and Maizai.","zh":"我冲上去，挡在了麦仔前面。"},{"t":"line","id":"A7-R010","who":"Narration","cls":"narr","en":"The stick was still raised in his hand, rain dripping off it drop by drop. My legs were shaking.","zh":"他手里的棍子还举着，雨水顺着棍子一滴一滴往下掉。我的腿在发抖。"},{"t":"line","id":"A7-R020","who":"Villager","cls":"talk","en":"“Move.”","zh":"“让开。”"},{"t":"line","id":"A7-R030","who":"Villager","cls":"talk","en":"“That's the third one. I went to their house twice. Told them to tie it up. Did they?”","zh":"“第三只了。去她家说了两回，说拴，拴了吗？”"},{"t":"choice","id":"A7-CR1","timer":"9","loop":false,"prompt":null,"writes":["attitude","bluffed","listened","paid"],"options":[{"id":"A7-CR1A","en":"Offer to pay for the chicken.","zh":"赔他鸡钱。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-R110","who":"Narration","cls":"narr","en":"I dug around in my pocket and came up with a few soggy bills, crumpled into a ball.","zh":"我在口袋里摸了半天，摸出几张泡湿的零钱，皱成一团。"},{"t":"line","id":"A7-R112","who":"Me","cls":"me","en":"“The chicken... how much? I'll pay.”","zh":"“鸡……多少钱，我赔。”"},{"t":"line","id":"A7-R114","who":"Narration","cls":"narr","en":"He looked down at the money in my hand and didn't take it.","zh":"他低头看着我手里那几张钱，没有接。"},{"t":"line","id":"A7-R116","who":"Villager","cls":"talk","en":"“What's that little bit going to do?”","zh":"“你这点钱，够干啥？”"}]},{"id":"A7-CR1B","en":"Hear him out first.","zh":"先听他说。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-R150","who":"Me","cls":"me","en":"“Sir... what do you want to do?”","zh":"“叔叔……您想怎么办？”"},{"t":"if","id":"A7-KR1","vars":["greeted_villagers"],"branches":[{"id":"A7-KR1a","label":"If I greeted the villagers in Act Two","body":[{"t":"line","id":"A7-R160","who":"Narration","cls":"narr","en":"The hand holding the stick stopped. It was a long while before he spoke.","zh":"他举着棍子的手停住了。过了好一会儿，他才开口。"},{"t":"line","id":"A7-R170","who":"Villager","cls":"talk","en":"“My son and his wife work away from home. They come back once a year. The little one lives with me. Those eggs were for him.”","zh":"“我儿子儿媳在外头打工，一年回来一趟。娃娃跟着我，那几个蛋是留给他的。”"},{"t":"line","id":"A7-R180","who":"Villager","cls":"talk","en":"“I don't want to beat a dog either. But if she doesn't die today, she'll be back tomorrow.”","zh":"“我也不想打狗。可它今天不死，明天还来。”"}]},{"id":"A7-KR1b","label":"If I did not greet the villagers in Act Two","body":[{"t":"line","id":"A7-R190","who":"Villager","cls":"talk","en":"“You're just a girl from the school. What are you asking me that for?” He gripped the stick tighter. “Move.”","zh":"“你一个学校的女娃娃，问这些做啥？”他把棍子握得更紧了，“让开。”"}]}],"depends":[{"name":"whether you greeted the villagers","from_":[{"id":"A2-C2A","label":"Act 2: “Of course. They look friendly, and they seem curious about…"},{"id":"A2-C2B","label":"Act 2: “Better not. We'll mostly be teaching at the school and may…"}]}]}]},{"id":"A7-CR1C","en":"Say I've already called the police.","zh":"说我已经报警了。","cond":"you tried calling the police","leaves":false,"body":[{"t":"line","id":"A7-R200","who":"Me","cls":"me","en":"“I... I've already called the police.”","zh":"“我……我已经报警了。”"},{"t":"line","id":"A7-R202","who":"Narration","cls":"narr","en":"He looked at me for a long time. Then he laughed.","zh":"他看着我，看了很久。然后笑了一声。"},{"t":"line","id":"A7-R204","who":"Villager","cls":"talk","en":"“The police? Crossing three mountains over a dog?”","zh":"“警察？翻三座山来管一条狗？”"},{"t":"line","id":"A7-R206","who":"Narration","cls":"narr","en":"He took a step forward.","zh":"他往前走了一步。"}]},{"id":"A7-CR1D","en":"Say nothing.","zh":"不说话。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-R240","who":"Villager","cls":"talk","en":"“Nothing to say?”","zh":"“不说话？”"}]}],"affects":[{"id":"A7-CR2A","label":"Act 7: option “Offer to pay for the chicken.”"},{"id":"A7-KR2","label":"Act 7: If I heard him out"},{"id":"A7-CR2B","label":"Act 7: option “Hear him out first.”"},{"id":"A7-CR2C","label":"Act 7: option “Say I've already called the police.”"},{"id":"A7-KR4","label":"Act 7: If I heard him out"},{"id":"A7-KR9","label":"Act 7: If his attitude ≥ 1"}],"about":["the man's attitude (hidden score)","whether you told him you had called the police","whether you heard him out","whether you offered to pay"]},{"t":"line","id":"A7-R250","who":"Villager","cls":"talk","en":"“And you? You'll be gone in a few days too. When she comes back tomorrow, will you be here?”","zh":"“你呢？你过几天也走了。它明天再来，你在吗？”"},{"t":"choice","id":"A7-CR2","timer":"9","loop":false,"prompt":null,"writes":["attitude","bluffed","listened","paid"],"options":[{"id":"A7-CR2A","en":"Offer to pay for the chicken.","zh":"赔他鸡钱。","cond":"you have not offered to pay yet","leaves":false,"body":[{"t":"if","id":"A7-KR2","vars":["listened"],"branches":[{"id":"A7-KR2a","label":"If I heard him out","body":[{"t":"line","id":"A7-R310","who":"Narration","cls":"narr","en":"I held out the wet bills again. He looked at them for a while, sighed, and took them.","zh":"我把那几张湿钱又递过去。他看了一会儿，叹了口气，接了。"},{"t":"line","id":"A7-R320","who":"Villager","cls":"talk","en":"“It's not about the money. Keep that dog tied up.”","zh":"“钱不是这个事。把狗拴好。”"}]},{"id":"A7-KR2b","label":"If I did not hear him out","body":[{"t":"line","id":"A7-R330","who":"Narration","cls":"narr","en":"I dug around in my pocket and came up with a few soggy bills, crumpled into a ball.","zh":"我在口袋里摸了半天，摸出几张泡湿的零钱，皱成一团。"},{"t":"line","id":"A7-R332","who":"Me","cls":"me","en":"“The chicken... how much? I'll pay.”","zh":"“鸡……多少钱，我赔。”"},{"t":"line","id":"A7-R334","who":"Narration","cls":"narr","en":"He looked down at the money in my hand and didn't take it.","zh":"他低头看着我手里那几张钱，没有接。"},{"t":"line","id":"A7-R336","who":"Villager","cls":"talk","en":"“What's that little bit going to do?”","zh":"“你这点钱，够干啥？”"}]}],"depends":[{"name":"whether you heard him out","from_":[{"id":"A7-CW1B","label":"Act 7: “Hear him out first.”"},{"id":"A7-CW2B","label":"Act 7: “Hear him out first.”"},{"id":"A7-CR1B","label":"Act 7: “Hear him out first.”"}]}]}]},{"id":"A7-CR2B","en":"Hear him out first.","zh":"先听他说。","cond":"you have not heard him out yet","leaves":false,"body":[{"t":"line","id":"A7-R340","who":"Me","cls":"me","en":"“Sir... what do you want to do?”","zh":"“叔叔……您想怎么办？”"},{"t":"if","id":"A7-KR3","vars":["greeted_villagers"],"branches":[{"id":"A7-KR3a","label":"If I greeted the villagers in Act Two","body":[{"t":"line","id":"A7-R350","who":"Narration","cls":"narr","en":"The hand holding the stick stopped. It was a long while before he spoke.","zh":"他举着棍子的手停住了。过了好一会儿，他才开口。"},{"t":"line","id":"A7-R360","who":"Villager","cls":"talk","en":"“My son and his wife work away from home. They come back once a year. The little one lives with me. Those eggs were for him.”","zh":"“我儿子儿媳在外头打工，一年回来一趟。娃娃跟着我，那几个蛋是留给他的。”"},{"t":"line","id":"A7-R370","who":"Villager","cls":"talk","en":"“I don't want to beat a dog either. But if she doesn't die today, she'll be back tomorrow.”","zh":"“我也不想打狗。可它今天不死，明天还来。”"}]},{"id":"A7-KR3b","label":"If I did not greet the villagers in Act Two","body":[{"t":"line","id":"A7-R380","who":"Villager","cls":"talk","en":"“You're just a girl from the school. What are you asking me that for?” He gripped the stick tighter. “Move.”","zh":"“你一个学校的女娃娃，问这些做啥？”他把棍子握得更紧了，“让开。”"}]}],"depends":[{"name":"whether you greeted the villagers","from_":[{"id":"A2-C2A","label":"Act 2: “Of course. They look friendly, and they seem curious about…"},{"id":"A2-C2B","label":"Act 2: “Better not. We'll mostly be teaching at the school and may…"}]}]}]},{"id":"A7-CR2C","en":"Say I've already called the police.","zh":"说我已经报警了。","cond":"you tried calling the police and have not told him so yet","leaves":false,"body":[{"t":"line","id":"A7-R390","who":"Me","cls":"me","en":"“I... I've already called the police.”","zh":"“我……我已经报警了。”"},{"t":"line","id":"A7-R392","who":"Narration","cls":"narr","en":"He looked at me for a long time. Then he laughed.","zh":"他看着我，看了很久。然后笑了一声。"},{"t":"line","id":"A7-R394","who":"Villager","cls":"talk","en":"“The police? Crossing three mountains over a dog?”","zh":"“警察？翻三座山来管一条狗？”"},{"t":"line","id":"A7-R396","who":"Narration","cls":"narr","en":"He took a step forward.","zh":"他往前走了一步。"}]},{"id":"A7-CR2D","en":"Promise her family will keep the dog tied up.","zh":"承诺会让她家把狗拴好。","cond":null,"leaves":false,"body":[{"t":"if","id":"A7-KR4","vars":["listened"],"branches":[{"id":"A7-KR4a","label":"If I heard him out","body":[{"t":"line","id":"A7-R430","who":"Me","cls":"me","en":"“I'll keep an eye on her. Tomorrow I'll go to her house, help build a doghouse, and tie her up.”","zh":"“我会看着它的。明天我就去她家，帮着搭个狗窝，把它拴上。”"},{"t":"line","id":"A7-R440","who":"Villager","cls":"talk","en":"“A girl like you. You'll keep your word?”","zh":"“你一个女娃娃，说话算数？”"},{"t":"line","id":"A7-R450","who":"Me","cls":"me","en":"“I will.”","zh":"“算数。”"}]},{"id":"A7-KR4b","label":"If I did not hear him out","body":[{"t":"line","id":"A7-R460","who":"Me","cls":"me","en":"“I'll keep an eye on her.”","zh":"“我会看着它的。”"},{"t":"line","id":"A7-R470","who":"Villager","cls":"talk","en":"“A girl like you? You think you can?”","zh":"“你一个女娃娃，看得住？”"}]}],"depends":[{"name":"whether you heard him out","from_":[{"id":"A7-CW1B","label":"Act 7: “Hear him out first.”"},{"id":"A7-CW2B","label":"Act 7: “Hear him out first.”"},{"id":"A7-CR1B","label":"Act 7: “Hear him out first.”"},{"id":"A7-CR2B","label":"Act 7: “Hear him out first.”"}]}]}]},{"id":"A7-CR2E","en":"Tell him about Mai's little sister.","zh":"讲小麦三妹的事。","cond":"Mai told you about her little sister","leaves":false,"body":[{"t":"line","id":"A7-R480","who":"Me","cls":"me","en":"“Mai's little sister drowned in the river. This dog... is hers.”","zh":"“小麦的三妹就是在河里没的。这条狗……是她的。”"},{"t":"line","id":"A7-R490","who":"Narration","cls":"narr","en":"His hand paused.","zh":"他的手顿了一下。"},{"t":"line","id":"A7-R500","who":"Villager","cls":"talk","en":"“Everyone in the village knows what happened to that family.”","zh":"“村里哪个不晓得她家的事。”"},{"t":"line","id":"A7-R510","who":"Narration","cls":"narr","en":"He turned away and looked at the dead chicken on the ground.","zh":"他别过脸去，看着地上那只死鸡。"}]},{"id":"A7-CR2F","en":"Say nothing, and don't move.","zh":"不说话，站着不走。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-R530","who":"Narration","cls":"narr","en":"I said nothing, and I didn't move aside. Rain ran from my hair into my eyes. I didn't wipe it away.","zh":"我什么都没说，也没有让开。雨从头发上流进眼睛里，我没有擦。"},{"t":"line","id":"A7-R540","who":"Narration","cls":"narr","en":"He stared at me, and I stared back.","zh":"他盯着我，我也盯着他。"}]}],"affects":[{"id":"A7-KR9","label":"Act 7: If his attitude ≥ 1"}],"about":["the man's attitude (hidden score)","whether you told him you had called the police","whether you heard him out","whether you offered to pay"]},{"t":"if","id":"A7-KR9","vars":["attitude"],"branches":[{"id":"A7-KR9a","label":"If his attitude ≥ 1","body":[{"t":"line","id":"A7-R610","who":"Narration","cls":"narr","en":"He threw the stick down into the mud.","zh":"他把棍子扔进泥里。"},{"t":"line","id":"A7-R620","who":"Villager","cls":"talk","en":"“Tie her up. Next time, I won't care whether you're here or not.”","zh":"“拴好它。下回我就不管你在不在了。”"},{"t":"line","id":"A7-450","who":"Narration","cls":"narr","en":"He turned and left, and the other man followed.","zh":"他转身走了，另一个人跟在后面。"}]},{"id":"A7-KR9b","label":"If his attitude ≤ 0","body":[{"t":"line","id":"A7-420","who":"Villager","cls":"talk","en":"“You city girls are all so soft-hearted. Does a soft heart put food on the table?”","zh":"“你们城里的这些小姑娘就是容易心软。心软能当饭吃吗？”"},{"t":"line","id":"A7-430","who":"Narration","cls":"narr","en":"Then he threw the stick down into the mud.","zh":"然后，他把棍子扔进泥里。"},{"t":"line","id":"A7-440","who":"Villager","cls":"talk","en":"“You can watch her for a day. You can't watch her forever.”","zh":"“你能看住它一天，看不住一辈子。”"},{"t":"line","id":"A7-R640","who":"Narration","cls":"narr","en":"He turned and left, and the other man followed.","zh":"他转身走了，另一个人跟在后面。"}]}],"depends":[{"name":"the man's attitude (hidden score)","from_":[{"id":"A7-KW1a","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-CW1C","label":"Act 7: “Say I've already called the police.”"},{"id":"A7-KW2a","label":"Act 7: If I heard him out"},{"id":"A7-KW3a","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-CW2C","label":"Act 7: “Say I've already called the police.”"},{"id":"A7-KW4a","label":"Act 7: If I heard him out"},{"id":"A7-KR1a","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-CR1C","label":"Act 7: “Say I've already called the police.”"},{"id":"A7-KR2a","label":"Act 7: If I heard him out"},{"id":"A7-KR3a","label":"Act 7: If I greeted the villagers in Act Two"},{"id":"A7-CR2C","label":"Act 7: “Say I've already called the police.”"},{"id":"A7-KR4a","label":"Act 7: If I heard him out"}]}]}]},{"id":"A7-K4c","label":"If I did not interfere","body":[{"t":"line","id":"A7-480","who":"Narration","cls":"narr","en":"I stood in the dark by the corner of the coop and didn't move.","zh":"我站在鸡舍墙角的黑暗里，没有动。"},{"t":"line","id":"A7-490","who":"Narration","cls":"narr","en":"The rain drowned out most of the sound.","zh":"雨声盖住了大部分声音。"},{"t":"line","id":"A7-500","who":"Narration","cls":"narr","en":"When it was over, he walked past me and paused, as if he wanted to say something. In the end, he said nothing.","zh":"结束以后，他从我身边走过，停了一下，像是想说什么，最后什么也没说。"},{"t":"line","id":"A7-510","who":"Narration","cls":"narr","en":"He didn't look back at the dog. Neither did I. It was as if I'd been nailed to the spot.","zh":"他没有回头看那条狗。我也没有。我像是被钉在了原地。"},{"t":"line","id":"A7-520","who":"Narration","cls":"narr","en":"I walked back through the rain to where Mai and the other teachers were waiting. She saw me and ran over.","zh":"我冒着雨走回小麦和其他老师等着的地方。她看见我，跑了过来。"},{"t":"choice","id":"A7-C3","timer":null,"loop":false,"prompt":{"t":"line","id":"A7-530","who":"Mai","cls":"talk","en":"“Did you find it?”","zh":"“找到了吗？”"},"writes":["lie","trust"],"options":[{"id":"A7-C3A","en":"Tell her the truth.","zh":"告诉她真相。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-540","who":"Narration","cls":"narr","en":"I told her.","zh":"我告诉了她。"},{"t":"line","id":"A7-550","who":"Narration","cls":"narr","en":"She didn't cry right away. She asked:","zh":"她没有马上哭。她问："},{"t":"line","id":"A7-560","who":"Mai","cls":"talk","en":"“Was she in pain?”","zh":"“它疼吗？”"},{"t":"line","id":"A7-570","who":"Narration","cls":"narr","en":"I didn't know how to answer, so I told her that truthfully too.","zh":"我不知道该怎么回答，所以这一句，我也说了实话。"},{"t":"line","id":"A7-580","who":"Narration","cls":"narr","en":"Then she cried. I stayed with her until the rain stopped.","zh":"然后她哭了。我陪着她，一直到雨停。"}]},{"id":"A7-C3B","en":"Tell her Maizai probably just wandered off.","zh":"告诉她麦仔可能只是跑远了。","cond":null,"leaves":false,"body":[{"t":"line","id":"A7-590","who":"Me","cls":"me","en":"“We didn't find her. Maybe she ran off somewhere. Dogs come back on their own.”","zh":"“没找到。可能跑到别的地方去了。狗会自己回来的。”"},{"t":"line","id":"A7-600","who":"Narration","cls":"narr","en":"Only after I'd said it did I realize those were exactly her mother's words.","zh":"说出口我才发现，这和她妈妈说的话一模一样。"},{"t":"line","id":"A7-610","who":"Narration","cls":"narr","en":"She nodded.","zh":"她点点头。"},{"t":"line","id":"A7-620","who":"Mai","cls":"talk","en":"“She always comes back,” Mai said, looking toward the mountain.","zh":"“它每次都会回来的。”她说，朝山的方向望过去。"}]}],"affects":[{"id":"A8-K2","label":"Act 8: If nothing or the hair tie, trust ≥ 4"},{"id":"EP-K3","label":"Epilogue: If the children's camera, trust ≥ 4, Maizai lame"}],"about":["whether you lied to Mai","Mai's trust in you (hidden score)"]}]}],"depends":[{"name":"what you did on the rainy night","from_":[{"id":"A7-C2A","label":"Act 7: “Wait for the other teachers, then step in together.”"},{"id":"A7-C2B","label":"Act 7: “There's no time. Rush in and stop him now.”"},{"id":"A7-C2C","label":"Act 7: “Stay where I am. Don't interfere.”"},{"id":"A7-C4A","label":"Act 7: “Wait for the other teachers, then step in together.”"},{"id":"A7-C4B","label":"Act 7: “There's no time. Rush in and stop him now.”"},{"id":"A7-C4C","label":"Act 7: “Stay where I am. Don't interfere.”"}]}]},{"t":"if","id":"A7-K5","vars":["action"],"branches":[{"id":"A7-K5a","label":"If I saved Maizai","body":[{"t":"line","id":"A7-700","who":"Narration","cls":"narr","en":"One of the teachers had kept Mai waiting under the eaves of the village shop. The moment she saw our flashlights, she ran out into the rain.","zh":"小麦被一位老师留在小卖部的屋檐下等着。她一看见手电筒的光，就冲进了雨里。"},{"t":"if","id":"A7-K6","vars":["dog"],"branches":[{"id":"A7-K6a","label":"If Maizai is unhurt","body":[{"t":"line","id":"A7-460","who":"Narration","cls":"narr","en":"I carried Maizai back to Mai. The dog was heavy and wouldn't stop trembling, but she lay quietly in my arms the whole way.","zh":"我把麦仔抱回小麦身边。它很沉，一直在发抖，但它一直乖乖地躺在我怀里。"},{"t":"line","id":"A7-710","who":"Narration","cls":"narr","en":"Maizai knew Mai at once. Her tail thumped against Mai's arm, again and again, in the rain.","zh":"麦仔认出了小麦，尾巴在雨里一下一下地拍着她的胳膊。"}]},{"id":"A7-K6b","label":"If Maizai is lame","body":[{"t":"line","id":"A7-720","who":"Narration","cls":"narr","en":"We carried Maizai back slung in a raincoat. One of her back legs hung limp, and she whimpered whenever anyone touched her.","zh":"麦仔是被我们用一件雨衣兜着抬回来的。它的一条后腿软软地垂着，一碰就呜咽一声。"},{"t":"line","id":"A7-730","who":"Narration","cls":"narr","en":"She knew Mai and tried to stand, but her back leg gave way and she sank down again. In the end, she just rested her head on Mai's knee.","zh":"它认出了小麦，想站起来，后腿一软，又趴了下去。最后，它只是把头搁在了她的膝盖上。"}]}],"depends":[{"name":"what happened to Maizai","from_":[{"id":"A7-K4a","label":"Act 7: If I waited for the others"},{"id":"A7-K4b","label":"Act 7: If I rushed in"},{"id":"A7-K4c","label":"Act 7: If I did not interfere"}]}]},{"t":"line","id":"A7-740","who":"Narration","cls":"narr","en":"Mai knelt in the mud and buried her face in Maizai's soaked fur, and for a long time she didn't look up.","zh":"小麦跪在泥里，把脸埋进麦仔湿透的毛里，很久都没有抬头。"},{"t":"line","id":"A7-750","who":"Mai","cls":"talk","en":"“I knew you'd come back.”","zh":"“我就知道你会回来的。”"},{"t":"line","id":"A7-760","who":"Narration","cls":"narr","en":"She looked up at me. Water streamed down her face, and I couldn't tell which of it was rain.","zh":"她抬起头看着我。雨水顺着她的脸往下流，我分不清哪些是雨。"},{"t":"line","id":"A7-770","who":"Mai","cls":"talk","en":"“Thank you, Teacher [teacher_name].”","zh":"“谢谢你，[teacher_name]老师。”"},{"t":"line","id":"A7-780","who":"Narration","cls":"narr","en":"She said it very softly, as if speaking any louder might make Maizai disappear again.","zh":"她说得很轻，好像怕声音大了，麦仔又会不见。"},{"t":"if","id":"A7-K7","vars":["dog"],"branches":[{"id":"A7-K7a","label":"If Maizai is lame","body":[{"t":"line","id":"A7-790","who":"Mai","cls":"talk","en":"“Her leg...”","zh":"“它的腿……”"},{"t":"line","id":"A7-800","who":"Me","cls":"me","en":"“It'll get better.”","zh":"“会好的。”"},{"t":"line","id":"A7-810","who":"Narration","cls":"narr","en":"I didn't know if it would. But that night, it was all I could say.","zh":"我不知道会不会好。可那天晚上，我只能这么说。"},{"t":"line","id":"A7-380","who":"Narration","cls":"narr","en":"Maizai survived. One of her back legs was broken, and she would never race up to the hilltop the way she used to.","zh":"麦仔活了下来。它的一条后腿断了，再也不能像以前那样一溜烟地冲上山顶。"}]},{"id":"A7-K7b","label":"If Maizai is unhurt","body":[]}],"depends":[{"name":"what happened to Maizai","from_":[{"id":"A7-K4a","label":"Act 7: If I waited for the others"},{"id":"A7-K4b","label":"Act 7: If I rushed in"},{"id":"A7-K4c","label":"Act 7: If I did not interfere"}]}]}]},{"id":"A7-K5b","label":"If I did not interfere","body":[]}],"depends":[{"name":"what you did on the rainy night","from_":[{"id":"A7-C2A","label":"Act 7: “Wait for the other teachers, then step in together.”"},{"id":"A7-C2B","label":"Act 7: “There's no time. Rush in and stop him now.”"},{"id":"A7-C2C","label":"Act 7: “Stay where I am. Don't interfere.”"},{"id":"A7-C4A","label":"Act 7: “Wait for the other teachers, then step in together.”"},{"id":"A7-C4B","label":"Act 7: “There's no time. Rush in and stop him now.”"},{"id":"A7-C4C","label":"Act 7: “Stay where I am. Don't interfere.”"}]}]},{"t":"if","id":"A7-K8","vars":["village","action"],"branches":[{"id":"A7-K8a","label":"If I saved Maizai and the village is still friendly","body":[{"t":"line","id":"A7-390","who":"Narration","cls":"narr","en":"When I ran into him on the road the next day, he nodded at me. Not exactly friendly, but he nodded.","zh":"第二天在路上碰见，大叔朝我点了点头。不算友善，但他点了头。"}]},{"id":"A7-K8b","label":"If I saved Maizai and the village has turned cold","body":[{"t":"line","id":"A7-470","who":"Narration","cls":"narr","en":"The next morning, as we passed the village shop, the men on the little wooden chairs all turned their faces away.","zh":"第二天早上，我们经过小卖部，门口小木椅上的大叔们都不约而同地把脸转开了。"}]},{"id":"A7-K8c","label":"If I did not interfere","body":[]}],"depends":[{"name":"how the village feels about you","from_":[{"id":"A7-KW9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-KW9b","label":"Act 7: If his attitude ≤ 0"},{"id":"A7-KR9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-KR9b","label":"Act 7: If his attitude ≤ 0"},{"id":"A7-K4c","label":"Act 7: If I did not interfere"}]},{"name":"what you did on the rainy night","from_":[{"id":"A7-C2A","label":"Act 7: “Wait for the other teachers, then step in together.”"},{"id":"A7-C2B","label":"Act 7: “There's no time. Rush in and stop him now.”"},{"id":"A7-C2C","label":"Act 7: “Stay where I am. Don't interfere.”"},{"id":"A7-C4A","label":"Act 7: “Wait for the other teachers, then step in together.”"},{"id":"A7-C4B","label":"Act 7: “There's no time. Rush in and stop him now.”"},{"id":"A7-C4C","label":"Act 7: “Stay where I am. Don't interfere.”"}]}]}]},{"key":"A8","title":"Act 8 · Will you come back next year?","nodes":[{"t":"line","id":"A8-010","who":"Narration","cls":"narr","en":"After the last class, the children didn't leave right away. Someone pressed a candy into my hand. Someone drew a lopsided flower in my notebook.","zh":"最后一节课下课后，孩子们没有马上走。有人往我手里塞了一颗糖，有人在我的本子上画了一朵歪歪扭扭的花。"},{"t":"if","id":"A8-K4","vars":["braid_upset"],"branches":[{"id":"A8-K4a","label":"If the boy left angry during the braid","body":[{"t":"line","id":"A8-012","who":"Narration","cls":"narr","en":"The boy who'd asked me to fix the fan that day didn't come over.","zh":"那天来找我修电扇的男孩，没有过来。"}]},{"id":"A8-K4b","label":"Otherwise","body":[{"t":"line","id":"A8-014","who":"Narration","cls":"narr","en":"The boy who'd asked me to fix the fan that day pushed a drawing into my hand: a whirring fan, with “Thank you, Teacher” scrawled beside it.","zh":"那天找我修电扇的男孩，往我手里塞了一张画：一台呼呼转着的电扇，旁边歪歪扭扭地写着“谢谢老师”。"}]}],"depends":[{"name":"which students left upset during the braid","from_":[{"id":"UI-429","label":"Menus and mini-game text: the braiding mini-game"}]}]},{"t":"line","id":"A8-020","who":"Narration","cls":"narr","en":"Little by little, they drifted off. Mai was the last one left.","zh":"人慢慢散了。小麦留在最后。"},{"t":"line","id":"A8-030","who":"Narration","cls":"narr","en":"She stood by the teacher's desk, picking at its wooden edge with one finger.","zh":"她站在讲台边，手指一下一下地抠着讲台的木边。"},{"t":"if","id":"A8-K0","vars":["told_secret"],"branches":[{"id":"A8-K0a","label":"If I told her sister's story in front of the teachers","body":[{"t":"line","id":"A8-032","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], the thing about my little sister. Did you tell the other teachers?”","zh":"“[teacher_name]老师，三妹的事，是你跟别的老师说的吗？”"},{"t":"line","id":"A8-034","who":"Narration","cls":"narr","en":"I nodded. She didn't ask anything else. She looked down and went on picking at the edge of the desk.","zh":"我点了点头。她没有再问，低下头，继续抠着讲台的木边。"}]},{"id":"A8-K0b","label":"Otherwise","body":[]}],"depends":[{"name":"whether you told her sister's story","from_":[{"id":"A7-CW2E","label":"Act 7: “Tell him about Mai's little sister.”"}]}]},{"t":"line","id":"A8-040","who":"Mai","cls":"talk","en":"“Teacher [teacher_name], will you come back next year?”","zh":"“[teacher_name]老师，你明年还会来吗？”"},{"t":"line","id":"A8-050","who":"The Teacher · inner voice","cls":"inner","en":"She's asking so seriously. I don't want to lie to such an honest child. But I don't want to hurt her either.","zh":"她问得这么认真。我不想骗一个真诚的孩子，但是我也不想让她伤心。"},{"t":"line","id":"A8-060","who":"The Passerby · inner voice","cls":"inner","en":"Next year? Once I leave, it's back to school. Every break after this will go to research or an internship. I'll probably... never come back here again...","zh":"明年？离开这里以后，我就要回去上学了。以后的假期我会被学业和实习填满，这辈子……可能都不会再来这里了……"},{"t":"choice","id":"A8-C1","timer":null,"loop":false,"prompt":{"t":"line","id":"A8-070","who":"Narration","cls":"narr","en":"I was quiet for a long time.","zh":"我沉默了很久。"},"writes":["promise"],"options":[{"id":"A8-C1A","en":"“I will.”","zh":"“会的。”","cond":null,"leaves":false,"body":[{"t":"line","id":"A8-080","who":"Narration","cls":"narr","en":"She smiled, showing those lovely white teeth.","zh":"她笑了，露出那口很好的白牙。"},{"t":"line","id":"A8-090","who":"Mai","cls":"talk","en":"“It's a promise, then. I'll wait for you next year.”","zh":"“说好了噢，那我明年等你。”"}]},{"id":"A8-C1B","en":"“There'll be lots of fun new teachers coming next year.”","zh":"“明年还会有很多有意思的老师们来的。”","cond":null,"leaves":false,"body":[{"t":"line","id":"A8-100","who":"Narration","cls":"narr","en":"She looked at me for a long time.","zh":"她看着我，看了很久。"},{"t":"line","id":"A8-110","who":"Mai","cls":"talk","en":"“Oh. That's what last year's teachers said too.”","zh":"“哦。去年的那些老师也是这么说的。”"}]},{"id":"A8-C1C","en":"“I probably won't come back next year. But I'll miss you all very much.”","zh":"“明年应该不会再来了，但是老师会很想念你们的。”","cond":null,"leaves":false,"body":[{"t":"line","id":"A8-120","who":"Narration","cls":"narr","en":"She nodded.","zh":"她点点头。"},{"t":"line","id":"A8-130","who":"Mai","cls":"talk","en":"“I know.”","zh":"“我知道。”"},{"t":"line","id":"A8-140","who":"Narration","cls":"narr","en":"She turned and looked out the window at the mountains.","zh":"她转过头，看着窗外的山。"}]},{"id":"A8-C1D","en":"Say nothing.","zh":"沉默。","cond":null,"leaves":false,"body":[{"t":"line","id":"A8-150","who":"Narration","cls":"narr","en":"I opened my mouth, but nothing came out.","zh":"我张了张嘴，什么也没说出来。"},{"t":"line","id":"A8-160","who":"Narration","cls":"narr","en":"She waited a moment, then said, “Bye, Teacher [teacher_name],” and turned and ran out of the classroom.","zh":"她等了一会儿，然后说：“[teacher_name]老师再见。”转身跑出了教室。"}]}],"affects":[{"id":"EP-K2","label":"Epilogue: If I promised to come back"}],"about":["what you promised about next year"]},{"t":"choice","id":"A8-C2","timer":null,"loop":false,"prompt":{"t":"line","id":"A8-170","who":"Narration","cls":"narr","en":"That night, lying on my bedding on the classroom floor, I wondered whether I should leave her something.","zh":"那天晚上，我躺在教室的地铺上，想着要不要给她留下点什么。"},"writes":["gift"],"options":[{"id":"A8-C2A","en":"Leave nothing.","zh":"什么也不留。","cond":null,"leaves":false,"body":[{"t":"line","id":"A8-180","who":"Narration","cls":"narr","en":"Anything I could give her, it seemed, would stop meaning much once I was gone.","zh":"我能给她的东西，在我离开以后，好像都不会再有什么意义。"}]},{"id":"A8-C2B","en":"Leave her a children's camera.","zh":"留下一台儿童相机。","cond":"you are taking photos","leaves":false,"body":[{"t":"line","id":"A8-190","who":"Narration","cls":"narr","en":"I had brought a few cheap children's cameras, meaning to teach a photography class, but I never got around to it. I put one in her desk with a note beside it: Take pictures of whatever you want.","zh":"我带了几台便宜的儿童相机，本来是想上一节摄影课，最后没来得及上。我把其中一台放进她的课桌，旁边留了一张纸条：想拍什么，就拍什么。"}]},{"id":"A8-C2D","en":"Leave her a letter.","zh":"留下一封信。","cond":null,"leaves":false,"body":[{"t":"line","id":"A8-210","who":"Narration","cls":"narr","en":"I wrote for a long time, writing and crossing out and writing again. Finally, I folded the letter and put it in her desk.","zh":"我写了很久，写了又划掉，划掉又写。最后，我把信折好，放进了她的课桌。"}]}],"affects":[{"id":"A8-K2","label":"Act 8: If nothing or the hair tie, trust ≥ 4"},{"id":"EP-K3","label":"Epilogue: If the children's camera, trust ≥ 4, Maizai lame"}],"about":["what you left for Mai"]},{"t":"line","id":"A8-220","who":"Narration","cls":"narr","en":"Early the next morning, the three-wheeled cart was waiting under the old locust tree at the edge of the village, ready to carry us over the mountains to the nearest town.","zh":"第二天一早，三轮车停在村口的老槐树下，要载我们翻过山，去最近的镇子。"},{"t":"line","id":"A8-225","who":"Narration","cls":"narr","en":"In every yard along the road, the newly harvested corn was spread out to dry.","zh":"路两边的院坝上，家家都铺满了刚收下来的新玉米。"},{"t":"if","id":"A8-K5","vars":["camera","photos"],"branches":[{"id":"A8-K5a","label":"If I am taking photos and there is film left","body":[{"t":"choice","id":"A8-C5","timer":"5","loop":false,"prompt":null,"writes":["photos"],"options":[{"id":"A8-C5A","en":"Capture this moment.","zh":"拍下这一刻。","cond":null,"leaves":false,"body":[{"t":"mark","text":"Photo is taken here (mini-game)","link":null},{"t":"line","id":"A8-227","who":"Narration","cls":"narr","en":"I put the camera back in my bag. This summer would have to live in those few frames.","zh":"我把相机收回包里。这个夏天，就留在这几格胶片里了。"}]},{"id":"A8-C5B","en":"Just watch.","zh":"只是看着。","cond":null,"leaves":false,"body":[]}],"affects":[{"id":"DV-K2","label":"Back in the city: If I took any photos"},{"id":"EP-K0","label":"Epilogue: If I am taking photos and I took photos"},{"id":"EP-K5","label":"Epilogue: If I am taking photos and I photographed people"},{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"},{"id":"EP-K6","label":"Epilogue: If I took photos"}],"about":["which photos you have taken"]}]},{"id":"A8-K5b","label":"If I am taking photos but the film is used up","body":[{"t":"line","id":"A8-228","who":"Narration","cls":"narr","en":"Without thinking, I reached for the camera, then remembered I had no film left.","zh":"我下意识地摸了摸相机，才想起胶卷早就用完了。"}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"},{"id":"A6-C2A","label":"Act 6: “Capture this moment.”"},{"id":"A6-C1C","label":"Act 6: “Raise the camera.”"}]}]},{"t":"if","id":"A8-K1","vars":["village"],"branches":[{"id":"A8-K1a","label":"If the village is still friendly","body":[{"t":"line","id":"A8-230","who":"Narration","cls":"narr","en":"A few villagers were standing outside the village shop. One of the men pressed a bag of boiled eggs into my hands.","zh":"小卖部门口站着几个村民。一位大叔往我手里塞了一袋煮鸡蛋。"},{"t":"line","id":"A8-240","who":"Villager","cls":"talk","en":"“For the road.”","zh":"“路上吃。”"}]},{"id":"A8-K1b","label":"If the village has turned cold","body":[{"t":"line","id":"A8-250","who":"Narration","cls":"narr","en":"The road was empty. The village shop's door was shut.","zh":"路上空荡荡的。小卖部的门关着。"}]}],"depends":[{"name":"how the village feels about you","from_":[{"id":"A7-KW9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-KW9b","label":"Act 7: If his attitude ≤ 0"},{"id":"A7-KR9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-KR9b","label":"Act 7: If his attitude ≤ 0"},{"id":"A7-K4c","label":"Act 7: If I did not interfere"}]}]},{"t":"if","id":"A8-K2","vars":["trust","gift","camera"],"branches":[{"id":"A8-K2a","label":"If nothing or the hair tie, trust ≥ 4","body":[{"t":"line","id":"A8-260","who":"Narration","cls":"narr","en":"As the cart pulled away, I saw her running after us, her braid swinging. She was long past catching up, and still she kept running.","zh":"三轮车开动的时候，我看见她跑着追了上来，辫子一甩一甩的。早就追不上了，她还在跑。"}]},{"id":"A8-K2b","label":"If nothing or the hair tie, trust 2–3","body":[{"t":"line","id":"A8-270","who":"Narration","cls":"narr","en":"She stood at the edge of the village with her hand raised, waving and waving until the cart rounded the foot of the mountain.","zh":"她站在村口，抬起手，一直挥，直到车拐过了山脚。"}]},{"id":"A8-K2c","label":"If nothing or the hair tie, trust ≤ 1","body":[{"t":"line","id":"A8-280","who":"Narration","cls":"narr","en":"She didn't come out. I kept watching the road until the village disappeared behind the mountain.","zh":"她没有出来。我一直看着那条路，直到村子消失在山的后面。"}]},{"id":"A8-K2d","label":"If the children's camera or the letter","body":[{"t":"line","id":"A8-290","who":"Narration","cls":"narr","en":"The cart started moving. I looked back. A few children were standing under the old locust tree. I couldn't make out whether she was one of them.","zh":"三轮车开动了。我回头看了一眼，老槐树下站着几个孩子，我没有看清里面有没有她。"}]}],"depends":[{"name":"Mai's trust in you (hidden score)","from_":[{"id":"A3-K4a","label":"Act 3: If I never left Mai"},{"id":"A6-C1A","label":"Act 6: “Say nothing. Stand with her for a while.”"},{"id":"A7-C1A","label":"Act 7: ““Let's look for it when the rain stops. It's too dangerous…"},{"id":"A7-K4a","label":"Act 7: If I waited for the others"},{"id":"A7-KW9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-K4b","label":"Act 7: If I rushed in"},{"id":"A7-KR9a","label":"Act 7: If his attitude ≥ 1"},{"id":"A7-C3A","label":"Act 7: “Tell her the truth.”"},{"id":"A8-K0a","label":"Act 8: If I told her sister's story in front of the teachers"}]},{"name":"what you left for Mai","from_":[{"id":"A8-C2A","label":"Act 8: “Leave nothing.”"},{"id":"A8-C2B","label":"Act 8: “Leave her a children's camera.”"},{"id":"A8-C2D","label":"Act 8: “Leave her a letter.”"}]},{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]}]},{"key":"DV","title":"Back in the city · Developing the film","nodes":[{"t":"if","id":"DV-K1","vars":["camera"],"branches":[{"id":"DV-K1a","label":"If I am taking photos","body":[{"t":"line","id":"DV-010","who":"Narration","cls":"narr","en":"By the time I got back to the city, it was the end of August.","zh":"回到城里，已经是八月底了。"},{"t":"line","id":"DV-020","who":"Narration","cls":"narr","en":"That first weekend, I borrowed the school photo club's darkroom and rewound the film out of the camera.","zh":"第一个周末，我借了学校摄影社的暗房，把那卷胶卷从相机里倒了出来。"},{"t":"line","id":"DV-030","who":"Narration","cls":"narr","en":"Developer, stop bath, fixer. Under the red safelight, everything looked as if it were underwater.","zh":"显影，停显，定影。红色的安全灯下，什么都像是泡在水里。"},{"t":"if","id":"DV-K2","vars":["photos"],"branches":[{"id":"DV-K2a","label":"If I took any photos","body":[{"t":"mark","text":"The photos are developed here","link":null},{"t":"line","id":"DV-050","who":"Narration","cls":"narr","en":"I switched on the light and clipped them to the line, one by one, to dry.","zh":"我打开灯，把它们一张张夹在绳子上晾干。"},{"t":"line","id":"DV-060","who":"Narration","cls":"narr","en":"This was the summer only I had seen.","zh":"这是只有我见过的那个夏天。"}]}],"depends":[{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"},{"id":"A6-C2A","label":"Act 6: “Capture this moment.”"},{"id":"A6-C1C","label":"Act 6: “Raise the camera.”"},{"id":"A8-C5A","label":"Act 8: “Capture this moment.”"}]}]}]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]}]}]},{"key":"EP","title":"Epilogue","nodes":[{"t":"line","id":"EP-010","who":"Chat notice","cls":"chat","en":"September.","zh":"九月。"},{"t":"if","id":"EP-K0","vars":["camera","photos"],"branches":[{"id":"EP-K0a","label":"If I am taking photos and I took photos","body":[{"t":"line","id":"EP-012","who":"Chat notice","cls":"chat","en":"The night before the contest deadline, I spread the prints out on my desk.","zh":"大赛截稿的前一晚，我把洗出来的照片摊在桌上。"},{"t":"line","id":"EP-014","who":"Chat notice","cls":"chat","en":"My phone lit up. It was from her.","zh":"手机亮了一下。是她发来的。"}]},{"id":"EP-K0b","label":"Otherwise","body":[]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"},{"id":"A6-C2A","label":"Act 6: “Capture this moment.”"},{"id":"A6-C1C","label":"Act 6: “Raise the camera.”"},{"id":"A8-C5A","label":"Act 8: “Capture this moment.”"}]}]},{"t":"line","id":"EP-020","who":"Mai · chat","cls":"chat","en":"Teacher [teacher_name], are you home yet?","zh":"[teacher_name]老师，你到家了吗？"},{"t":"choice","id":"EP-C1","timer":null,"loop":false,"prompt":null,"writes":["chat_reply"],"options":[{"id":"EP-C1A","en":"Home now! How's school?","zh":"到啦！你在学校还好吗？","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-021","who":"Me · chat","cls":"chat","en":"Home now! How's school?","zh":"到啦！你在学校还好吗？"}]},{"id":"EP-C1B","en":"I'm home. Bit busy lately, I'll talk to you later.","zh":"到了，最近有点忙，晚点跟你说。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-023","who":"Me · chat","cls":"chat","en":"I'm home. Bit busy lately, I'll talk to you later.","zh":"到了，最近有点忙，晚点跟你说。"}]},{"id":"EP-C1C","en":"Reply later.","zh":"晚点再回。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-025","who":"Chat notice","cls":"chat","en":"I turned my phone face down on the desk and told myself I'd reply later.","zh":"我把手机扣在桌上，想着晚点再回。"}]}],"affects":[],"about":["how you replied in the chat"]},{"t":"if","id":"EP-K5","vars":["camera","photos"],"branches":[{"id":"EP-K5a","label":"If I am taking photos and I photographed people","body":[{"t":"line","id":"EP-022","who":"Chat notice","cls":"chat","en":"The deadline was noon tomorrow.","zh":"截止时间是明天中午十二点。"},{"t":"choice","id":"EP-C2","timer":null,"loop":false,"prompt":null,"writes":["festival"],"options":[{"id":"EP-C2A","en":"Submit the ones with people in them.","zh":"投拍到人的那几张。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-024","who":"Chat notice","cls":"chat","en":"I submitted the ones with people in them. In November they made the shortlist and went up on a gallery wall.","zh":"我投了拍到人的那几张。十一月，它们入围了，挂进了展厅。"},{"t":"line","id":"EP-026","who":"Chat notice","cls":"chat","en":"On opening day, a visitor stood in front of the prints and asked me, “How are the people in these photos doing now?”","zh":"开展那天，有个观众站在照片前问我：“照片里的人，现在怎么样了？”"},{"t":"line","id":"EP-028","who":"Chat notice","cls":"chat","en":"I stood in front of the photos and couldn't answer.","zh":"我站在照片前，答不上来。"}]},{"id":"EP-C2B","en":"Put away the ones with people, then submit.","zh":"把拍到人的那几张收起来再投。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-032","who":"Chat notice","cls":"chat","en":"I put the ones with people in a drawer. What was left was clean, and thin.","zh":"拍到人的那几张，我收进了抽屉。剩下的照片很干净，也很单薄。"},{"t":"line","id":"EP-034","who":"Chat notice","cls":"chat","en":"They didn't make the shortlist. I knew the best ones were the ones I had put away.","zh":"它们没有入围。我知道，最好的那几张是我自己收起来的。"}]},{"id":"EP-C2C","en":"Ask her first.","zh":"先问问她。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-036","who":"Chat notice","cls":"chat","en":"I asked her whether photos with her in them could be shown to lots and lots of people.","zh":"我问她，有她的照片，能不能给很多很多人看。"},{"t":"line","id":"EP-038","who":"Mai · chat","cls":"chat","en":"Sure!","zh":"可以呀！"},{"t":"line","id":"EP-039","who":"Chat notice","cls":"chat","en":"She answered right away. I sent the photos in. I didn't know whether a child could understand what she'd just agreed to.","zh":"她回得很快。我把照片投了出去。我不知道，一个孩子明不明白自己答应了什么。"}]},{"id":"EP-C2D","en":"Don't submit it.","zh":"不投了。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-043","who":"Chat notice","cls":"chat","en":"I put the photos in an envelope.","zh":"我把照片收进了一个信封。"}]}],"affects":[{"id":"EP-K4","label":"Epilogue: If I am taking photos, I took photos, and I did n…"}],"about":["what you did about the photo contest"]}]},{"id":"EP-K5b","label":"If I am taking photos but I only photographed scenery","body":[{"t":"line","id":"EP-045","who":"Chat notice","cls":"chat","en":"I submitted the few photos without people in them. They were too thin to go anywhere, and I never heard back.","zh":"我投了那几张没有人的照片。它们太单薄了，投了也没有回音。"}]},{"id":"EP-K5c","label":"If I am not taking photos or no photos","body":[]}],"depends":[{"name":"whether you are taking photos","from_":[{"id":"A4-C1A","label":"Act 4: “Invite her to be the subject of my photos.”"},{"id":"A4-C1B","label":"Act 4: “Start with the classroom itself.”"}]},{"name":"which photos you have taken","from_":[{"id":"A4-K2a","label":"Act 4: If I invited her to be the subject"},{"id":"A4-K2b","label":"Act 4: If I photographed the classroom"},{"id":"A5-C5A","label":"Act 5: “Capture this moment.”"},{"id":"A5-C2A","label":"Act 5: “Raise the camera and photograph Grandpa.”"},{"id":"A5-C6A","label":"Act 5: “Capture this moment.”"},{"id":"A6-C2A","label":"Act 6: “Capture this moment.”"},{"id":"A6-C1C","label":"Act 6: “Raise the camera.”"},{"id":"A8-C5A","label":"Act 8: “Capture this moment.”"}]}]},{"t":"if","id":"EP-K1","vars":["dog"],"branches":[{"id":"EP-K1a","label":"If Maizai survived with a broken leg","body":[{"t":"line","id":"EP-030","who":"Chat notice","cls":"chat","en":"October.","zh":"十月。"},{"t":"line","id":"EP-040","who":"Mai · chat","cls":"chat","en":"(photo) Maizai can walk now, just a little lame","zh":"〔图片〕麦仔会走路了，就是有点瘸"},{"t":"choice","id":"EP-C3","timer":null,"loop":false,"prompt":null,"writes":[],"options":[{"id":"EP-C3A","en":"Does her leg still hurt? Take good care of her.","zh":"腿还疼吗？要好好照顾它。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-041","who":"Me · chat","cls":"chat","en":"Does her leg still hurt? Take good care of her.","zh":"腿还疼吗？要好好照顾它。"}]},{"id":"EP-C3B","en":"She looks so lively! Give her a pat for me.","zh":"它看起来真精神！替我摸摸它。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-042","who":"Me · chat","cls":"chat","en":"She looks so lively! Give her a pat for me.","zh":"它看起来真精神！替我摸摸它。"}]},{"id":"EP-C3C","en":"Don't reply.","zh":"不回。","cond":null,"leaves":false,"body":[]}],"affects":[],"about":[]}]},{"id":"EP-K1b","label":"If Maizai survived unhurt","body":[{"t":"line","id":"EP-050","who":"Chat notice","cls":"chat","en":"October.","zh":"十月。"},{"t":"line","id":"EP-060","who":"Mai · chat","cls":"chat","en":"(photo) Maizai walked me to the hilltop again today","zh":"〔图片〕麦仔今天又送我到山顶了"},{"t":"choice","id":"EP-C4","timer":null,"loop":false,"prompt":null,"writes":[],"options":[{"id":"EP-C4A","en":"She looks so lively! Give her a pat for me.","zh":"它看起来真精神！替我摸摸它。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-061","who":"Me · chat","cls":"chat","en":"She looks so lively! Give her a pat for me.","zh":"它看起来真精神！替我摸摸它。"}]},{"id":"EP-C4B","en":"That's wonderful. You take care too.","zh":"真好。你也要好好的。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-062","who":"Me · chat","cls":"chat","en":"That's wonderful. You take care too.","zh":"真好。你也要好好的。"}]},{"id":"EP-C4C","en":"Don't reply.","zh":"不回。","cond":null,"leaves":false,"body":[]}],"affects":[],"about":[]}]},{"id":"EP-K1c","label":"If Maizai died","body":[]}],"depends":[{"name":"what happened to Maizai","from_":[{"id":"A7-K4a","label":"Act 7: If I waited for the others"},{"id":"A7-K4b","label":"Act 7: If I rushed in"},{"id":"A7-K4c","label":"Act 7: If I did not interfere"}]}]},{"t":"line","id":"EP-070","who":"Chat notice","cls":"chat","en":"December.","zh":"十二月。"},{"t":"line","id":"EP-080","who":"Mai · chat","cls":"chat","en":"Teacher [teacher_name] what are you doing","zh":"[teacher_name]老师你在干嘛"},{"t":"line","id":"EP-090","who":"Chat notice","cls":"chat","en":"I didn't see that message until three days later.","zh":"我三天以后才看到这条消息。"},{"t":"choice","id":"EP-C5","timer":null,"loop":false,"prompt":null,"writes":[],"options":[{"id":"EP-C5A","en":"Studying for finals. How about you?","zh":"在准备期末考试。你呢？","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-091","who":"Me · chat","cls":"chat","en":"Studying for finals. How about you?","zh":"在准备期末考试。你呢？"}]},{"id":"EP-C5B","en":"Just saw this. I've been so busy, sorry.","zh":"刚看到，最近太忙了，对不起。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-092","who":"Me · chat","cls":"chat","en":"Just saw this. I've been so busy, sorry.","zh":"刚看到，最近太忙了，对不起。"}]},{"id":"EP-C5C","en":"Don't reply.","zh":"不回。","cond":null,"leaves":false,"body":[]}],"affects":[],"about":[]},{"t":"line","id":"EP-095","who":"Chat notice","cls":"chat","en":"After that, each of my replies came a little slower than the last.","zh":"后来，我的回复一条比一条慢。"},{"t":"line","id":"EP-097","who":"Chat notice","cls":"chat","en":"And after that...","zh":"再往后……"},{"t":"if","id":"EP-K2","vars":["promise"],"branches":[{"id":"EP-K2a","label":"If I promised to come back","body":[{"t":"line","id":"EP-100","who":"Chat notice","cls":"chat","en":"July, the next year.","zh":"第二年七月。"},{"t":"line","id":"EP-110","who":"Mai · chat","cls":"chat","en":"Teacher [teacher_name], when are you coming?","zh":"[teacher_name]老师，你什么时候来？"},{"t":"choice","id":"EP-C6","timer":null,"loop":false,"prompt":null,"writes":[],"options":[{"id":"EP-C6A","en":"I might not make it this year... I'm sorry.","zh":"今年可能来不了了……对不起。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-111","who":"Me · chat","cls":"chat","en":"I might not make it this year... I'm sorry.","zh":"今年可能来不了了……对不起。"}]},{"id":"EP-C6B","en":"Wait a little longer. I'll try.","zh":"再等等，老师争取。","cond":null,"leaves":false,"body":[{"t":"line","id":"EP-112","who":"Me · chat","cls":"chat","en":"Wait a little longer. I'll try.","zh":"再等等，老师争取。"}]},{"id":"EP-C6C","en":"Don't reply.","zh":"不回。","cond":null,"leaves":false,"body":[]}],"affects":[],"about":[]}]},{"id":"EP-K2b","label":"Otherwise","body":[]}],"depends":[{"name":"what you promised about next year","from_":[{"id":"A8-C1A","label":
